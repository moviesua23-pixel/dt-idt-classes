.studio{grid-template-columns:190px minmax(0,1fr);gap:25px}
.rail{top:190px;padding:9px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 6px 22px rgba(23,28,53,.045)}
.rail::before{content:"YOUR STUDY PATH";padding:7px 10px 9px;color:#858ba0;font:9px var(--f-mono);letter-spacing:.12em}
.rail a{padding:9px 10px;border-radius:9px;font-size:11px;transition:background .22s,color .22s,transform .22s}
.rail a:hover{background:var(--surface-2);transform:translateX(2px)}
.rail a b{width:26px;height:26px;border:0;border-radius:8px;background:#f0f1f6;color:#83899a;font-size:10px}
.rail a.on{background:#f1f0ff;color:#353075}.rail a.on b{background:#665de1;color:white;box-shadow:0 4px 10px rgba(102,93,225,.24);transform:none}
.rail a.done b{background:#e8f5ef;color:#248261}.rail a.done:not(:last-child)::after{background:#6bbf9b}
.stack{gap:18px}
.stack>.stage{--stage-color:#665de1;position:relative;padding:0;border:1px solid #e1e4ee;border-radius:16px;background:var(--surface);box-shadow:0 5px 20px rgba(25,30,57,.045);overflow:hidden}
.stack>.stage::before{display:none}
.stack>.stage:nth-child(2){--stage-color:#b6754f}.stack>.stage:nth-child(3){--stage-color:#537ca8}.stack>.stage:nth-child(4){--stage-color:#268164}
.stage-h{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;min-height:73px;margin:0;padding:15px 23px 14px 19px;border-bottom:1px solid var(--line);background:linear-gradient(100deg,color-mix(in srgb,var(--stage-color) 7%,var(--surface)),var(--surface) 58%)}
.stage-h::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--stage-color)}
.stage-h .no{display:grid;place-items:center;width:36px;height:36px;padding:0;border-radius:11px;background:color-mix(in srgb,var(--stage-color) 12%,var(--surface));color:var(--stage-color);font:700 10px var(--f-mono);letter-spacing:-.03em}
.stage-h h2{margin:0;color:var(--ink);font:700 1.12rem/1.25 var(--f-display);letter-spacing:-.025em}
.stack>.stage>.prov-banner,.stack>.stage>.md-content,.stack>.stage>.player,.stack>.stage>.theater-launch-card,.stack>.stage>.script-slides-list,.stack>.stage>.qtext,.stack>.stage>.sol-toggle,.stack>.stage>.drawer-btn,.stack>.stage>.drawer{margin-left:23px;margin-right:23px}
.stack>.stage>.prov-banner{margin-top:19px;margin-bottom:19px}
.stack>.stage>.md-content{padding:0 0 22px}
.stack>.stage>.md-content:not(.qtext){margin-top:0}
.stack>.stage>#st2,.stack>.stage>.note{color:var(--ink-2)}
.stack>.stage>#st2{padding-bottom:18px}
/* Provision content: readable legal text, rich hierarchy, and polished matrices. */
.prov-banner{position:relative;display:flex;align-items:flex-start;gap:17px;padding:19px 20px;background:linear-gradient(120deg,#f0efff,#f9f8ff 57%,#fff);border:1px solid #e0defb;border-left:4px solid #665de1;border-radius:12px}
.prov-banner-meta{min-width:116px;display:flex;align-items:flex-start;flex-direction:column;gap:9px;margin:0}
.prov-tag{padding:5px 7px;border:0;border-radius:5px;background:#e4e2ff;color:#4e45c5;font:700 8px var(--f-mono);letter-spacing:.08em}
.prov-secs{gap:5px}.prov-banner .sec{background:#fff;border-color:#e4e2ff;color:#6359cf}
.prov-title{font-size:1.22rem;line-height:1.4;align-self:center}
.md-content{font-size:.93rem;line-height:1.8;color:#394154}
.md-content p{margin:0 0 13px}.md-content p:last-child{margin-bottom:0}
.md-content h1,.md-content h2,.md-content h3{margin:23px 0 10px;color:#202744;font-family:var(--f-display);letter-spacing:-.025em}
.md-content h1{font-size:1.35rem}.md-content h2{font-size:1.11rem}.md-content h3{font-size:.98rem}
.md-content h1::before,.md-content h2::before,.md-content h3::before{background:#6a60e8}
.md-content ul,.md-content ol{padding-left:1.35rem;margin:9px 0 17px}.md-content li{padding-left:4px;margin:7px 0}.md-content li::marker{color:#7067df}
.md-content blockquote{margin:17px 0;padding:13px 16px;border:1px solid #e4e2fb;border-left:4px solid #7268e4;border-radius:0 10px 10px 0;background:#f7f6ff;color:#44425f}
.md-content code,.math-plain,.math-fallback{padding:2px 5px;border-radius:5px;background:#f0efff;color:#5148c9;font-size:.88em}
.tbl-wrap{margin:17px 0 20px;border:1px solid #dfe3ed;border-radius:11px;background:var(--surface);box-shadow:0 4px 14px rgba(26,30,55,.035)}
table,.md-content table{width:100%;font-size:.83rem;line-height:1.5}
th,.md-content th{padding:12px 14px;background:#f2f3f9;color:#373b59;border-bottom:1px solid #dce0eb;font:700 9px/1.4 var(--f-mono);letter-spacing:.07em}
td,.md-content td{padding:12px 14px;border-color:#e9ebf2;color:#3d4558;line-height:1.6}
tbody tr:nth-child(even),.md-content tbody tr:nth-child(even){background:#fafaff}tbody tr:hover,.md-content tbody tr:hover{background:#f1f0ff}
tr.total td,.md-content tr.total td{background:#eeedff;color:#4038a5;font-weight:700}
.callout-alert{border-radius:11px;box-shadow:none}.step-badge{border-radius:6px}
/* Audio and presentation launch: custom player, waveform, and launch panel. */
#st2>div:nth-of-type(2){margin:0 23px 13px!important;padding:10px 12px;border-radius:9px;background:#f8f8fc;border:1px solid #eceef4}
#st2 .pill.ok{padding:5px 8px;border-radius:6px;background:#e9f7f0;color:#217857;font-size:9px}
.theater-launch-card{position:relative;margin:0 23px 15px!important;padding:17px 18px;border:1px solid #dcdafa;border-radius:13px;background:radial-gradient(380px circle at 95% 5%,rgba(133,123,242,.14),transparent 60%),linear-gradient(115deg,#f0efff,#fafaff 70%,#fff);color:#202343;box-shadow:0 4px 16px rgba(67,59,154,.055);transition:transform .28s,box-shadow .28s,border-color .28s}
.theater-launch-card:hover{transform:translateY(-3px);border-color:#aaa4f2;box-shadow:0 13px 28px rgba(67,59,154,.13)}
.tlc-badge{padding:5px 8px;border-radius:5px;background:#e3e1ff;color:#5148c9;border:0;font-size:8px;letter-spacing:.09em}
.tlc-icon{width:43px;height:43px;border-radius:12px;background:#fff;color:#665de1;font-size:1.35rem;box-shadow:0 3px 10px rgba(48,42,120,.09)}
.tlc-text h4{color:#242447;font:700 .98rem var(--f-display)}.tlc-text p{color:#687087;font-size:.78rem}
.tlc-btn{padding:10px 14px;border-radius:8px;background:#6259dd;color:#fff;font-size:.76rem;box-shadow:0 5px 12px rgba(98,89,221,.2);transition:transform .2s,background .2s,box-shadow .2s}
.tlc-btn:hover{transform:translateY(-1px);background:#5148c9;box-shadow:0 8px 16px rgba(98,89,221,.27)}
.player{position:relative;display:grid;gap:13px;margin-top:0!important;margin-bottom:14px!important;padding:17px 18px;border:1px solid #dfe2ec;border-radius:13px;background:linear-gradient(145deg,#fafaff,#f3f4fb)}
.player::before{content:"AUDIO LESSON";color:#777d93;font:700 8px var(--f-mono);letter-spacing:.13em}
.wave{height:42px;padding:0 3px}.wave i{border-radius:3px;background:#d7d9e8}.wave i.on{background:#746be6}.player.playing .wave i{animation-duration:.82s}
.ctrl{gap:11px}.play{width:45px;height:45px;background:linear-gradient(145deg,#786ff0,#554bd0);box-shadow:0 6px 14px rgba(86,76,209,.24)}.play:hover{box-shadow:0 9px 20px rgba(86,76,209,.32)}
.time{color:#454b62;font-size:.76rem}.ctrl input[type=range]{accent-color:#645bdd}.speed{padding:7px 10px;border-radius:7px;background:#fff;color:#4f5570;font-size:.72rem}
.drawer-btn{display:flex!important;width:calc(100% - 46px);justify-content:space-between;margin-top:8px!important;margin-bottom:0;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#fafaff;color:#4c45bb;font-size:.8rem;transition:background .22s,border-color .22s}
.drawer-btn:hover{background:#f1f0ff;border-color:#c8c4f5}.drawer{margin-bottom:19px!important}.script-drawer-body{padding:14px 0 2px}.script-slides-list{gap:9px;padding:0}.script-slide-item{padding:12px 14px;border-radius:10px;background:#fafaff;border-color:#e7e8f0}.script-slide-item:hover{border-color:#a9a4ec}.ssi-num{background:#ecebff;color:#5047c8}.ssi-title{font:700 .87rem var(--f-display)}
/* Course header, empty states, and utility controls inside the content column. */
.back-btn{margin:2px 0 5px;border-radius:8px;background:var(--surface);font-size:10px;padding:8px 11px;box-shadow:0 2px 8px rgba(22,27,48,.035)}
.chmeta{align-items:center;margin:21px 0 20px;padding:20px 21px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(110deg,#fff,#f7f7ff);box-shadow:0 4px 16px rgba(22,27,48,.035)}
.chmeta h1{max-width:28ch;margin-top:7px;font:700 clamp(1.65rem,3.3vw,2.45rem)/1.12 var(--f-display);letter-spacing:-.045em}
.chmeta .eyebrow{font-size:9px;color:#6660c9}.chmeta .eyebrow b{color:#5148c9}
.chmeta .seg{box-shadow:0 4px 13px rgba(25,29,69,.04)}
.empty{padding:34px 24px;border:1px solid #e1e3ed;border-radius:15px;background:linear-gradient(145deg,#fff,#f7f7fc);box-shadow:0 5px 19px rgba(23,28,53,.04)}
.empty b{font:700 1.12rem var(--f-display);letter-spacing:-.025em}.empty p{font-size:.84rem;line-height:1.75}.empty .primary{border-radius:8px;background:#5f56d9;font-size:.78rem}.empty .nav-btn{border-radius:8px}
.ring{width:30px;height:30px}.ring svg{width:30px;height:30px}.ring b{font-size:.53rem}
.pill{border-radius:6px;font-size:9px;padding:5px 8px}.pill.ok{background:#e9f7f0;color:#217857}.pill.idle{background:#f2f3f7;color:#737a8d;border:1px solid #e6e8ef}
.sec{border-radius:5px;padding:4px 7px;font-size:9px;background:#f3f1ff;color:#5148c9}
/* Question and solution stage: legible, distinct from the provision reference. */
#st3 .qtext{margin-top:18px!important;margin-bottom:22px!important;padding:21px 23px;border:1px solid #dfe5f0;border-left:4px solid #5b82b6;border-radius:0 12px 12px 0;background:linear-gradient(120deg,#f6f9ff,#fff 82%);color:#28364a;font-size:.95rem;line-height:1.8}
#st3 .qtext::before{content:"CASE FACTS & REQUIREMENT";display:block;margin-bottom:13px;color:#56749b;font:700 8px var(--f-mono);letter-spacing:.14em}
#st3 .qtext p{margin-bottom:12px}#st3 .qtext li{margin:7px 0}
#st4 .sol-toggle{width:calc(100% - 46px);margin:19px 23px 0!important;padding:14px 16px;border:1px solid #d9d7f5;border-radius:10px;background:#f3f2ff;color:#5148c9;font-size:.82rem;text-align:left;transition:background .24s,box-shadow .24s,border-color .24s}
#st4 .sol-toggle:hover{background:#ecebff;box-shadow:0 4px 14px rgba(72,63,165,.08)}#st4 .sol-toggle[aria-expanded="true"]{background:#e9e7ff;border-color:#aaa4f1}
#st4 .drawer{margin-left:23px!important;margin-right:23px!important}.sol{max-width:none;padding:17px 0 21px}.sol>.md-content{padding:17px 19px;border:1px solid #e2e5ee;border-radius:12px;background:#fff;box-shadow:0 4px 14px rgba(22,27,48,.035)}
.sol .md-content h2:first-child,.sol .md-content h3:first-child{margin-top:0}.sol .tbl-wrap{margin-top:15px}.concl{border:1px solid #ccebdd;border-left:4px solid #258466;border-radius:10px;background:#eff9f4;padding:14px 16px}
/* Presentation controls, mind-map surfaces, and narration panel. */
.vtheater-topbar{padding:11px clamp(14px,3vw,34px)!important}.vtb-title{font-family:var(--f-display);letter-spacing:-.015em}.vtb-close-btn{border-radius:8px!important;font-size:.78rem!important}
.vtheater-dock{padding:10px clamp(12px,3vw,30px)!important;gap:12px!important}.vtd-play{background:linear-gradient(145deg,#786ff0,#554bd0)!important;box-shadow:0 5px 14px rgba(86,76,209,.34)!important}.vtd-progress{accent-color:#8c84ff!important}
.ppt-nav-rail{background:rgba(255,255,255,.07)!important;border-radius:10px!important}.ppt-nav-dot{border-radius:8px!important}.ppt-nav-dot.active{background:#7066e7!important}
.ppt-narration-box{border-radius:12px!important;box-shadow:0 12px 30px rgba(23,25,56,.12)!important}.ppt-narration-text{font-size:.96rem!important;line-height:1.75!important}
.vfullscreen-stage{padding-top:64px!important}.mm-root-card,.mm-infographic-block,.mm-infographic-card{filter:drop-shadow(0 5px 10px rgba(28,33,62,.08))}
@media(max-width:900px){#chlist.list,#qlist>.list{grid-template-columns:1fr}.studio{grid-template-columns:1fr}.rail{display:none}.stack>.stage>.prov-banner,.stack>.stage>.md-content,.stack>.stage>.player,.stack>.stage>.theater-launch-card,.stack>.stage>.script-slides-list,.stack>.stage>.qtext,.stack>.stage>.sol-toggle,.stack>.stage>.drawer-btn,.stack>.stage>.drawer{margin-left:16px;margin-right:16px}#st2>div:nth-of-type(2){margin-inline:16px!important}.theater-launch-card{margin-inline:16px!important}#st4 .sol-toggle{width:calc(100% - 32px);margin-inline:16px!important}#st4 .drawer{margin-inline:16px!important}}
@media(max-width:600px){
 #chlist .row{min-height:124px;padding:14px 13px 12px;grid-template-columns:45px minmax(0,1fr) 14px;gap:8px 10px}#chlist .row .num{width:42px;height:42px;border-radius:11px;font-size:1rem}#chlist .row h3{font-size:.89rem}#chlist .row .rt{padding-top:8px}
 #qlist .q{min-height:0;grid-template-columns:40px minmax(0,1fr) 13px;padding:13px;gap:10px}#qlist .q .qn{width:38px;height:38px;border-radius:9px;font-size:.72rem}#qlist .q h3{font-size:.88rem}#qlist .q .pv{font-size:.73rem}
 .stage-h{grid-template-columns:33px minmax(0,1fr);min-height:63px;padding:11px 13px}.stage-h .no{width:31px;height:31px;border-radius:9px;font-size:8px}.stage-h h2{font-size:.98rem}
 .prov-banner{display:block;padding:15px}.prov-banner-meta{margin-bottom:11px}.prov-title{font-size:1.08rem}
 .player{padding:13px}.wave{height:33px}.play{width:40px;height:40px}.time{font-size:.68rem}
 #st3 .qtext{padding:16px;font-size:.86rem}.sol>.md-content{padding:14px}
}
@media(prefers-reduced-motion:reduce){#chlist .row,#qlist .q,.theater-launch-card,.tlc-btn,.drawer-btn{transition:none!important}}

/* Explicit dark theme treatment for all redesigned inner surfaces. */
:root[data-theme="dark"]{
 --bg:#111522;--surface:#191f30;--surface-2:#20273a;--ink:#f1f2fa;--ink-2:#a5acc1;--line:#2d354a;
 --dt:#aaa4ff;--dt-soft:#282541;--idt:#f1a476;--idt-soft:#382921;--brass:#e3b66c;--brass-soft:#382f20;--accent:var(--dt);--accent-soft:var(--dt-soft)
}
:root[data-theme="dark"] #chlist .row,:root[data-theme="dark"] #qlist .q,:root[data-theme="dark"] .cluster,:root[data-theme="dark"] .chmeta,:root[data-theme="dark"] .empty{background:linear-gradient(145deg,#191f30,#202238);border-color:#343a54;color:var(--ink)}

:root[data-theme="dark"] .head h1 span{color:#b8b3ff}

:root[data-theme="dark"] .rail a b{background:#252b3e;color:#a9afc0}

:root[data-theme="dark"] .stage-h h2,:root[data-theme="dark"] .prov-title{color:#f1f2fa}

/* Visible background motion: keep it behind cards, but above the body canvas. */
body{background-size:170% 170%;animation:pageColorDrift 34s ease-in-out infinite alternate}
@keyframes pageColorDrift{0%{background-position:0% 12%}100%{background-position:100% 88%}}
#ambient::before{opacity:.55;z-index:0!important;animation:ambientDrift 24s ease-in-out infinite alternate}
#ambient::after{z-index:0!important;opacity:.18;animation:gridGlide 48s linear infinite}
#ambient .orb{z-index:1;opacity:.38;filter:blur(90px);animation:orbTravel 28s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes gridGlide{from{background-position:0 0}to{background-position:52px 52px}}
@media(prefers-reduced-motion:reduce){body{animation:none!important}}
/* Home screen composition refresh — animated ambient field and new subject components. */
#ambient{isolation:isolate}
#ambient::before{content:"";position:absolute;inset:-18%;z-index:0;background:radial-gradient(ellipse at 17% 25%,rgba(116,105,255,.17),transparent 38%),radial-gradient(ellipse at 82% 36%,rgba(250,157,108,.13),transparent 34%),radial-gradient(ellipse at 55% 92%,rgba(91,148,222,.11),transparent 38%);background-size:170% 170%;animation:ambientDrift 24s ease-in-out infinite alternate}
#ambient::after{content:"";position:absolute;inset:0;z-index:0;opacity:.23;background-image:linear-gradient(rgba(96,100,149,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(96,100,149,.055) 1px,transparent 1px);background-size:52px 52px;mask-image:linear-gradient(to bottom,black,transparent 82%)}
#ambient .orb{opacity:.3;filter:blur(100px);animation:orbTravel 28s cubic-bezier(.45,0,.55,1) infinite alternate}
#ambient .o1{background:#9b94ff;left:-12vmax;top:2vmax}
#ambient .o2{background:#ffbc91;right:-12vmax;bottom:-8vmax;animation-delay:-13s}
@keyframes ambientDrift{0%{transform:translate3d(-2%,0,0) scale(.98);background-position:0 30%}100%{transform:translate3d(2%,2%,0) scale(1.04);background-position:100% 70%}}
@keyframes orbTravel{0%{transform:translate3d(-2vw,0,0) scale(.92)}100%{transform:translate3d(4vw,3vh,0) scale(1.12)}}

<script type="application/json" id="pipeline-data">{"catalog": {"subject": "Direct Tax", "total_chapters": 25, "chapters": [{"chapter_number": 1, "title": "Basic Concepts, Tax Rates and Exempt Income", "page_range": "1.1 - 1.18"}, {"chapter_number": 2, "title": "Capital Gains", "page_range": "2.1 - 2.39"}, {"chapter_number": 3, "title": "Profits and Gains of Business or Profession (PGBP)", "page_range": "3.1 - 3.111"}, {"chapter_number": 4, "title": "Income from Other Sources", "page_range": "4.1 - 4.17"}, {"chapter_number": 5, "title": "Clubbing of Income", "page_range": "5.1 - 5.8"}, {"chapter_number": 6, "title": "Set-off and Carry forward of Losses", "page_range": "6.1 - 6.8"}, {"chapter_number": 7, "title": "Deductions under Chapter VI-A and Section 10AA", "page_range": "7.1 - 7.18"}, {"chapter_number": 8, "title": "Assessment/Taxation of Various Entities (Cooperative Society, AOP, AMT, MAT, Tonnage Tax, Business Trust, Investment Fund, Securitisation Trust)", "page_range": "8.1 - 8.58"}, {"chapter_number": 9, "title": "Charitable Trusts, Political Parties and Electoral Trusts", "page_range": "9.1 - 9.43"}, {"chapter_number": 10, "title": "TDS, TCS, Advance Tax, Interest and Refund", "page_range": "10.1 - 10.52"}, {"chapter_number": 11, "title": "Income Tax Authorities, Return Filing & Assessment Procedure", "page_range": "11.1 - 11.28"}, {"chapter_number": 12, "title": "Appeals and Revision", "page_range": "12.1 - 12.12"}, {"chapter_number": 13, "title": "Dispute Resolution", "page_range": "13.1 - 13.2"}, {"chapter_number": 14, "title": "Penalties, Offences and Prosecution", "page_range": "14.1 - 14.13"}, {"chapter_number": 15, "title": "Miscellaneous Provisions", "page_range": "15.1 - 15.9"}, {"chapter_number": 16, "title": "Tax Planning, Tax Evasion & Tax Avoidance (GAAR)", "page_range": "16.1 - 16.11"}, {"chapter_number": 17, "title": "Tax Audit and Ethical Compliances", "page_range": "17.1 - 17.10"}, {"chapter_number": 18, "title": "The Black Money & Imposition of Tax Law", "page_range": "18.1 - 18.5"}, {"chapter_number": 19, "title": "Double Taxation Relief", "page_range": "19.1 - 19.41"}, {"chapter_number": 20, "title": "Non Resident Taxation", "page_range": "20.1 - 20.57"}, {"chapter_number": 21, "title": "Transfer Pricing", "page_range": "21.1 - 21.42"}, {"chapter_number": 22, "title": "Advance Rulings", "page_range": "22.1 - 22.5"}, {"chapter_number": 23, "title": "Fundamentals of BEPS", "page_range": "23.1 - 23.8"}, {"chapter_number": 24, "title": "Application and Interpretation of Tax Treaties", "page_range": "24.1 - 24.7"}, {"chapter_number": 25, "title": "Overview of Model Tax Conventions", "page_range": "25.1 - 25.6"}]}, "questions": [{"chapter_number": 1, "chapter_title": "Basic Concepts, Tax Rates and Exempt Income", "question_number": 1, "question_title": "Application of Income vs Diversion of Income by Overriding Title", "question_text": "Mr. Bhargava, a leading advocate on corporate law, decided to reduce his practice and to accept briefs only for paying his taxes and making charities with fees received on such briefs. In a particular case, he agreed to appear to defend one company in Supreme Court on the condition that he would be provided with ₹ 5 lacs for a public charitable trust that he would create. He defended the company and was paid the sum by company. He created a trust of that sum by executing a trust deed. Decide whether the amount received by Mr. Bhargava is assessable in his hands as income from profession.", "answer_text": "In the instant case, the trust was created by Mr. Bhargava himself out of his professional income. The client did not create the trust. The client did not impose any obligation in the nature of a trust binding on Mr. Bhargava. Thus, there is no diversion of the money to the trust before it became professional income in the hands of Mr. Bhargava. This case is one of application of professional income and not of diversion of income by overriding title. Therefore, the amount received by Mr. Bhargava is chargeable to tax under the head \"Profits and gains of business or profession\"."}, {"chapter_number": 1, "chapter_title": "Basic Concepts, Tax Rates and Exempt Income", "question_number": 2, "question_title": "Diversion of Income by Overriding Charge on Takeover of Business", "question_text": "XYZ Ltd. took over the running business of a sole-proprietor by a sale deed. As per the sale deed, XYZ Ltd. undertook to pay overriding charges of ₹ 15,000 p.a. to the wife of the sole-proprietor in addition to the sale consideration. The sale deed also specifically mentioned that the amount was charged on the net profits of XYZ Ltd., who had accepted that obligation as a condition of purchase of the going concern. Is the payment of overriding charges by XYZ Ltd. to the wife of the sole-proprietor in the nature of diversion of income or application of income? Discuss.", "answer_text": "This issue came up for consideration before the Allahabad High Court in Jit & Pal X-Rays (P.) Ltd. v. CIT (2004) 267 ITR 370 (All). The Allahabad High Court observed that the overriding charge which had been created in favour of the wife of the sole-proprietor was an integral part of the sale deed by which the going concern was transferred to the assessee. The obligation, therefore, was attached to the very source of income i.e. the going concern transferred to the assessee by the sale deed. The sale deed also specifically mentioned that the amount in question was charged on the net profits of the assessee-company and the assessee-company had accepted that obligation as a condition of purchase of the going concern. Hence, it is clearly a case of diversion of income by an overriding charge and not a mere application of income."}, {"chapter_number": 1, "chapter_title": "Basic Concepts, Tax Rates and Exempt Income", "question_number": 3, "question_title": "Diversion of Partnership Profits by Overriding Title to Deceased Partner's Mother", "question_text": "MKG Agency is a partnership firm consisting of father and three major sons. The partnership deed provided that after the death of father, the business shall be continued by the sons, subject to the condition that the firm shall pay 20% of the profits to the mother. Father died in March, 2025. In the previous year 2025-26, the reconstituted firm paid ₹ 1 lakh (equivalent to 20% of the profits) to the mother and claimed the amount as deduction from its income. Examine the correctness of the claim of the firm.", "answer_text": "The issue raised in the problem is based on the concept of diversion of income by overriding title, which is well recognised in the income-tax law. In the instant case, the amount of ₹ 1 lakh, being 20% of profits of the firm, paid to the mother gets diverted at source by the charge created in her favour as per the terms of the partnership deed. Such income does not reach the assessee-firm.\n\nRather, such income stands diverted to the other person as such other person has a better title on such income than the title of the assessee. The firm might have received the said amount but it so received for and on behalf of the mother, who possesses the overriding title. Therefore, the amount paid to the mother should be excluded from the income of the firm. This view has been confirmed in CIT vs. Nariman B. Bharucha & Sons (1981) 130 ITR 863 (Bom)."}, {"chapter_number": 1, "chapter_title": "Basic Concepts, Tax Rates and Exempt Income", "question_number": 4, "question_title": "Computation of Tax Liability under Normal Provisions (Opting Out of Default Regime) for Different Age Slabs", "question_text": "Mr. Arjun has a total income of ₹ 16,00,000, comprising of income from house property and interest on fixed deposits. Compute his tax liability for A.Y.2026-27 assuming his age is -\n(a) 52 years\n(b) 64 years\n(c) 83 years\nAssume that Mr. Arjun has exercised the option to shift out/opt out of the default tax regime.", "answer_text": "**(a) Computation of Tax liability of Mr. Arjun (aged 52 years)**\n\n| Particulars | Amount (₹) |\n| :--- | :--- |\n| First ₹ 2,50,000 | Nil |\n| Next ₹ 2,50,001 - ₹ 5,00,000 @ 5% of ₹ 2,50,000 | 12,500 |\n| Next ₹ 5,00,001 - ₹ 10,00,000 @ 20% of ₹ 5,00,000 | 1,00,000 |\n| Balance i.e., ₹ 16,00,000 minus ₹ 10,00,000 @ 30% of ₹ 6,00,000 | 1,80,000 |\n| **Total** | **2,92,500** |\n| Add: Health and Education cess @ 4% | 11,700 |\n| **Tax liability** | **3,04,200** |\n\n**(b) Computation of Tax liability of Mr. Arjun (aged 64 years)**\n\n| Particulars | Amount (₹) |\n| :--- | :--- |\n| First ₹ 3,00,000 | Nil |\n| Next ₹ 3,00,001 - ₹ 5,00,000 @ 5% of ₹ 2,00,000 | 10,000 |\n| Next ₹ 5,00,001 - ₹ 10,00,000 @ 20% of ₹ 5,00,000 | 1,00,000 |\n| Balance i.e., ₹ 16,00,000 minus ₹ 10,00,000 @ 30% of ₹ 6,00,000 | 1,80,000 |\n| **Total** | **2,90,000** |\n| Add: Health and Education cess @ 4% | 11,600 |\n| **Tax liability** | **3,01,600** |\n\n**(c) Computation of Tax liability of Mr. Arjun (aged 83 years)**\n\n| Particulars | Amount (₹) |\n| :--- | :--- |\n| First ₹ 5,00,000 | Nil |\n| Next ₹ 5,00,001 - ₹ 10,00,000 @ 20% of ₹ 5,00,000 | 1,00,000 |\n| Balance i.e., ₹ 16,00,000 minus ₹ 10,00,000 @ 30% of ₹ 6,00,000 | 1,80,000 |\n| **Total** | **2,80,000** |\n| Add: Health and Education cess @ 4% | 11,200 |\n| **Tax liability** | **2,91,200** |"}, {"chapter_number": 1, "chapter_title": "Basic Concepts, Tax Rates and Exempt Income", "question_number": 5, "question_title": "Computation of Tax Liability and Rebate u/s 87A under Normal Provisions", "question_text": "Mr. Manish, aged 47 years and a resident in India, has a total income of ₹ 4,15,000, comprising his salary income and interest on bank fixed deposit. Compute his tax liability for A.Y.2026-27 if he exercises the option to shift out of the default tax regime.", "answer_text": "**Computation of tax liability of Mr. Manish**\n\n| Particulars | Amount (₹) |\n| :--- | :--- |\n| Tax @ 5% of ₹ 1,65,000 (₹ 4,15,000 - ₹ 2,50,000) | 8,250 |\n| Less: Rebate u/s 87A (Lower of tax payable or ₹ 12,500) | (8,250) |\n| **Tax Liability** | **Nil** |"}, {"chapter_number": 1, "chapter_title": "Basic Concepts, Tax Rates and Exempt Income", "question_number": 6, "question_title": "Computation of Tax Liability under Default Tax Regime u/s 115BAC", "question_text": "Mr. X has a total income of ₹ 16,00,000, comprising of income from house property and interest on fixed deposits. Compute his tax liability for A.Y.2026-27 under the default tax regime u/s 115BAC.", "answer_text": "**Computation of Tax liability of Mr. X**\n\n| Particulars | Amount (₹) |\n| :--- | :--- |\n| First ₹ 4,00,000 | Nil |\n| Next ₹ 4,00,001 - ₹ 8,00,000 @ 5% of ₹ 4,00,000 | 20,000 |\n| Next ₹ 8,00,001 - ₹ 12,00,000 @ 10% of ₹ 4,00,000 | 40,000 |\n| Next ₹ 12,00,001 - ₹ 16,00,000 @ 15% of ₹ 4,00,000 | 60,000 |\n| **Total** | **1,20,000** |\n| Add: Health and Education cess @ 4% | 4,800 |\n| **Tax liability** | **1,24,800** |"}, {"chapter_number": 1, "chapter_title": "Basic Concepts, Tax Rates and Exempt Income", "question_number": 7, "question_title": "Rebate u/s 87A under Default Tax Regime u/s 115BAC", "question_text": "Mr. Mahesh aged 32 years and a resident in India, has a total income of ₹ 11,00,000, comprising his salary income and interest on bank fixed deposit. Compute his tax liability for A.Y.2026-27 under default tax regime under section 115BAC.", "answer_text": "**Computation of tax liability of Mr. Mahesh**\n\n| Particulars | Amount (₹) |\n| :--- | :--- |\n| First ₹ 4,00,000 | Nil |\n| Next ₹ 4,00,001 — ₹ 8,00,000 (₹ 4,00,000 × 5%) | 20,000 |\n| Balance ₹ 8,00,001 - ₹ 11,00,000 (₹ 3,00,000 × 10%) | 30,000 |\n| **Total** | **50,000** |\n| Less: Rebate u/s 87A (Lower of tax payable or ₹ 60,000) | (50,000) |\n| **Tax Liability** | **Nil** |"}, {"chapter_number": 1, "chapter_title": "Basic Concepts, Tax Rates and Exempt Income", "question_number": 8, "question_title": "Marginal Rebate u/s 87A under Default Tax Regime u/s 115BAC", "question_text": "Mr. Nitin aged 35 years and a resident in India, has a total income of ₹ 12,50,000, comprising his salary income and interest on bank fixed deposit. Compute his tax liability for A.Y.2026-27 under default tax regime under section 115BAC.", "answer_text": "**Computation of tax liability of Mr. Nitin**\n\n| Particulars | Amount (₹) |\n| :--- | :--- |\n| **Step 1:** Total Income of ₹ 12,50,000 - ₹ 12,00,000 (A) | 50,000 |\n| **Step 2:** Tax on total income of ₹ 12,50,000: Tax @ 15% of ₹ 50,000 + ₹ 60,000 (B) | 67,500 |\n| **Step 3:** Since B > A, rebate u/s 87A would be B - A (₹ 67,500 - ₹ 50,000) | (17,500) |\n| **Tax before cess** | **50,000** |\n| Add: HEC @ 4% | 2,000 |\n| **Tax Liability** | **52,000** |"}, {"chapter_number": 1, "chapter_title": "Basic Concepts, Tax Rates and Exempt Income", "question_number": 9, "question_title": "Marginal Relief for Domestic Company (Total Income Exceeding ₹ 1 Crore)", "question_text": "Compute the marginal relief available to X Ltd., a domestic company, assuming that the total income of X Ltd. is ₹ 1,01,00,000 for A.Y.2026-27 and the total income does not include any income in the nature of capital gains. Assume that the company has not exercised option under section 115BAA or 115BAB.\n[Note - The gross receipts of X Ltd. for the P.Y.2023-24 is ₹ 402 crore]", "answer_text": "The tax payable on total income of ₹ 1,01,00,000 of X Ltd. computed @ 32.1% (including surcharge @ 7%) is ₹ 32,42,100.\n\nHowever, the tax cannot exceed ₹ 31,00,000 (i.e., the tax of ₹ 30,00,000 payable on total income of ₹ 1 crore plus ₹ 1,00,000, being the amount of total income exceeding ₹ 1 crore).\n\nTherefore, the tax payable on ₹ 1,01,00,000 would be ₹ 31,00,000.\n\nThe marginal relief is ₹ 1,42,100 (i.e., ₹ 32,42,100 - ₹ 31,00,000)."}, {"chapter_number": 1, "chapter_title": "Basic Concepts, Tax Rates and Exempt Income", "question_number": 10, "question_title": "Marginal Relief for Domestic Company (Total Income Exceeding ₹ 10 Crore)", "question_text": "Compute the marginal relief available to Y Ltd., a domestic company, assuming that the total income of Y Ltd. for A.Y.2026-27 is ₹ 10,01,00,000 and the total income does not include any income in the nature of capital gains. Assume that the company has not exercised option under section 115BAA or 115BAB.\n[Note - The gross receipts of Y Ltd. for the P.Y.2023-24 is ₹ 410 crore]", "answer_text": "The tax payable on total income of ₹ 10,01,00,000 of Y Ltd. computed @ 33.6% (including surcharge @ 12%) is ₹ 3,36,33,600.\n\nHowever, tax cannot exceed ₹ 3,22,00,000 [i.e., the tax of ₹ 3,21,00,000 (32.1% of ₹ 10 crore) payable on total income of ₹ 10 crore plus ₹ 1,00,000, being the amount of total income exceeding ₹ 10 crore].\n\nTherefore, the tax payable on ₹ 10,01,00,000 would be ₹ 3,22,00,000.\n\nThe marginal relief is ₹ 14,33,600 (i.e., ₹ 3,36,33,600 - ₹ 3,22,00,000)."}], "provisions": [{"question_number": 1, "statutory_sections": ["Section 4", "Section 28"], "core_principle": "Section 4: Diversion vs Application of Income", "provision_presentation_markdown": "## Diversion of Income vs. Application of Income\n\n### Statutory test\n\n| Point of comparison | Diversion by overriding title | Application of income |\n| :--- | :--- | :--- |\n| When the obligation operates | Before income accrues to the assessee | After income accrues or is received |\n| Legal connection | Enforceable obligation is attached to the income-producing source | The assessee first obtains the right to the income |\n| What reaches the assessee | Income is diverted before it becomes the assessee’s own | Income reaches the assessee, who later applies it |\n| Usual tax treatment | Diverted amount is not income accruing to the assessee | Income remains taxable; later spending is not itself a deduction |\n\n### Apply the test\n- Examine the legal instrument, enforceability, and link between the obligation and the source.\n- The word “charge” alone does not establish diversion.\n- Ask whether the obligation takes the income away before the assessee acquires it.\n- A later gift, family payment, or voluntary allocation is ordinarily application, subject to any specific statutory deduction or exemption.", "malayalam_audio_script": "ഇന്ന് Section 4-ലെ diversion of income, application of income എന്നീ നിയമസങ്കൽപ്പങ്ങൾ മാത്രം പഠിക്കാം.\n\nവരുമാനത്തിന്റെ വിനിയോഗത്തിൽ രണ്ട് നിയമസ്ഥിതികളുണ്ട്. Source-ൽ തന്നെ മേലധികാരമുള്ള നിയമബാധ്യത വരുമാനം മാറ്റിയാൽ diversion; ആദ്യം വരുമാനം ലഭിച്ച് പിന്നീട് ഉപയോഗിച്ചാൽ application.\n\nപ്രധാന പരിശോധന obligation എപ്പോൾ പ്രവർത്തിക്കുന്നു എന്നതാണ്. വരുമാനം assessee-യുടെ സ്വന്തം വരുമാനമായി ആദ്യം ലഭിക്കുന്നുണ്ടോ എന്ന് കണ്ടെത്തണം.\n\nമുൻകൂട്ടിയുള്ള enforceable obligation വരുമാനം സൃഷ്ടിക്കുന്ന source-നോട് ബന്ധിപ്പിച്ചിരിക്കണം. വരുമാനം സ്വന്തം വരുമാനമായി ലഭിക്കുന്നതിന് മുമ്പ് assessee-യുടെ title മറികടക്കണം.\n\nഒരു payment-നെ “charge” എന്ന് വിളിച്ചതുകൊണ്ട് മാത്രം diversion ആവില്ല. ബന്ധപ്പെട്ട നിയമരേഖ, ബാധ്യത enforce ചെയ്യാമോ, source-നോടുള്ള ബന്ധം എന്നിവ പരിശോധിക്കണം.\n\nവരുമാനം ആദ്യം assessee-ക്ക് ലഭിക്കാനുള്ള അവകാശമോ നിയന്ത്രണമോ ഉണ്ടാകുന്നു. പിന്നീട് ആ വരുമാനത്തിൽ നിന്ന് payment നടത്തുന്നത് ഇതിനകം നേടിയ വരുമാനത്തിലെ ബാധ്യത തീർക്കലാണ്.\n\nപിന്നീട് നൽകുന്ന gift, കുടുംബ payment, അല്ലെങ്കിൽ സ്വമേധയാ മാറ്റിവെക്കൽ സാധാരണയായി application ആണ്. പ്രത്യേക statutory deduction അല്ലെങ്കിൽ exemption ഉണ്ടെങ്കിൽ മാത്രമേ tax treatment മാറൂ.\n\nയഥാർത്ഥ diversion ആണെങ്കിൽ മാറ്റിയ തുക assessee-ക്ക് accrue ചെയ്ത വരുമാനമല്ല. Application ആണെങ്കിൽ വരുമാനം taxable ആയി തുടരും; പിന്നീട് ചെലവാക്കിയത് മാത്രം deduction ആവില്ല.\n\nഅവസാനമായി ചോദിക്കുക: assessee-ക്ക് വരുമാനം ലഭിക്കുന്നതിന് മുമ്പ് obligation അത് source-ൽ നിന്ന് മാറ്റിയോ? ആദ്യം assessee-ക്കാണ് ലഭിച്ചതെങ്കിൽ സാധാരണയായി അത് application ആണ്.", "topic_id": "presentation_q1", "topic_title": "Section 4: Diversion vs Application of Income", "audio_file": "q1.mp3", "dur": 133.86, "duration_seconds": 133.86, "voice_engine": "Gemini Voice (Aoede)", "voice": "Gemini Voice (Aoede)"}, {"question_number": 2, "statutory_sections": ["Section 4"], "core_principle": "Diversion by Overriding Title", "provision_presentation_markdown": "## Diversion by Overriding Title\n\n### Required conditions\n\n| Test | Rule |\n| :--- | :--- |\n| Existing obligation | A pre-existing, enforceable legal obligation must exist. |\n| Attachment | The obligation must bind the income-producing source itself. |\n| Timing | It must operate before income accrues as the assessee’s own. |\n| Legal evidence | The instrument and its terms must establish the superior title; a payment label alone is insufficient. |\n\n### Consequence and distinction\n- If the source is bound before accrual, the amount is diverted and does not accrue as the assessee’s income.\n- If the assessee first obtains the right to the income and pays it afterwards, that is ordinarily application of income.\n- Test the legal effect of the arrangement, not merely the route through which money is paid.", "malayalam_audio_script": "ഇന്ന് overriding title വഴി income diversion ആകുന്നതിന്റെ നിയമതത്വം മാത്രം നോക്കാം.\n\nവരുമാനത്തിന്റെ വിനിയോഗത്തിൽ രണ്ട് നിയമസ്ഥിതികളുണ്ട്. Source-ൽ തന്നെ മേലധികാരമുള്ള നിയമബാധ്യത വരുമാനം മാറ്റിയാൽ diversion; ആദ്യം വരുമാനം ലഭിച്ച് പിന്നീട് ഉപയോഗിച്ചാൽ application.\n\nപ്രധാന പരിശോധന obligation എപ്പോൾ പ്രവർത്തിക്കുന്നു എന്നതാണ്. വരുമാനം assessee-യുടെ സ്വന്തം വരുമാനമായി ആദ്യം ലഭിക്കുന്നുണ്ടോ എന്ന് കണ്ടെത്തണം.\n\nമുൻകൂട്ടിയുള്ള enforceable obligation വരുമാനം സൃഷ്ടിക്കുന്ന source-നോട് ബന്ധിപ്പിച്ചിരിക്കണം. വരുമാനം സ്വന്തം വരുമാനമായി ലഭിക്കുന്നതിന് മുമ്പ് assessee-യുടെ title മറികടക്കണം.\n\nഒരു payment-നെ “charge” എന്ന് വിളിച്ചതുകൊണ്ട് മാത്രം diversion ആവില്ല. ബന്ധപ്പെട്ട നിയമരേഖ, ബാധ്യത enforce ചെയ്യാമോ, source-നോടുള്ള ബന്ധം എന്നിവ പരിശോധിക്കണം.\n\nവരുമാനം ആദ്യം assessee-ക്ക് ലഭിക്കാനുള്ള അവകാശമോ നിയന്ത്രണമോ ഉണ്ടാകുന്നു. പിന്നീട് ആ വരുമാനത്തിൽ നിന്ന് payment നടത്തുന്നത് ഇതിനകം നേടിയ വരുമാനത്തിലെ ബാധ്യത തീർക്കലാണ്.\n\nപിന്നീട് നൽകുന്ന gift, കുടുംബ payment, അല്ലെങ്കിൽ സ്വമേധയാ മാറ്റിവെക്കൽ സാധാരണയായി application ആണ്. പ്രത്യേക statutory deduction അല്ലെങ്കിൽ exemption ഉണ്ടെങ്കിൽ മാത്രമേ tax treatment മാറൂ.\n\nയഥാർത്ഥ diversion ആണെങ്കിൽ മാറ്റിയ തുക assessee-ക്ക് accrue ചെയ്ത വരുമാനമല്ല. Application ആണെങ്കിൽ വരുമാനം taxable ആയി തുടരും; പിന്നീട് ചെലവാക്കിയത് മാത്രം deduction ആവില്ല.\n\nഅവസാനമായി ചോദിക്കുക: assessee-ക്ക് വരുമാനം ലഭിക്കുന്നതിന് മുമ്പ് obligation അത് source-ൽ നിന്ന് മാറ്റിയോ? ആദ്യം assessee-ക്കാണ് ലഭിച്ചതെങ്കിൽ സാധാരണയായി അത് application ആണ്.", "topic_id": "presentation_q2", "topic_title": "Diversion by Overriding Title", "audio_file": "q2.mp3", "dur": 93.07, "duration_seconds": 93.07, "voice_engine": "Gemini Voice (Aoede)", "voice": "Gemini Voice (Aoede)"}, {"question_number": 3, "statutory_sections": ["Section 4"], "core_principle": "Diversion vs Application: Source and Title", "provision_presentation_markdown": "## Diversion vs. Application: Source and Title\n\n### Compare the legal position\n\n| Stage | Diversion by overriding title | Application of income |\n| :--- | :--- | :--- |\n| Before accrual | A superior obligation binds the source | No source-level obligation diverts the income |\n| Accrual | Income does not accrue to the assessee beneficially | Assessee first earns or receives the income |\n| Later payment | Payment gives effect to the overriding title | Payment uses income already belonging to the assessee |\n| Tax result | Diverted amount is excluded from the assessee’s income | Income remains taxable; later use is not by itself deductible |\n\n### Decision question\n- Is there an enforceable obligation attached to the source before the assessee acquires the income?\n- If yes, consider diversion. If the assessee acquires the income first, the later payment is ordinarily application.", "malayalam_audio_script": "ഇന്ന് source-ൽ diversion-ഉം income ലഭിച്ച ശേഷമുള്ള application-ഉം തമ്മിലുള്ള നിയമവ്യത്യാസം മാത്രം പഠിക്കാം.\n\nവരുമാനത്തിന്റെ വിനിയോഗത്തിൽ രണ്ട് നിയമസ്ഥിതികളുണ്ട്. Source-ൽ തന്നെ മേലധികാരമുള്ള നിയമബാധ്യത വരുമാനം മാറ്റിയാൽ diversion; ആദ്യം വരുമാനം ലഭിച്ച് പിന്നീട് ഉപയോഗിച്ചാൽ application.\n\nപ്രധാന പരിശോധന obligation എപ്പോൾ പ്രവർത്തിക്കുന്നു എന്നതാണ്. വരുമാനം assessee-യുടെ സ്വന്തം വരുമാനമായി ആദ്യം ലഭിക്കുന്നുണ്ടോ എന്ന് കണ്ടെത്തണം.\n\nമുൻകൂട്ടിയുള്ള enforceable obligation വരുമാനം സൃഷ്ടിക്കുന്ന source-നോട് ബന്ധിപ്പിച്ചിരിക്കണം. വരുമാനം സ്വന്തം വരുമാനമായി ലഭിക്കുന്നതിന് മുമ്പ് assessee-യുടെ title മറികടക്കണം.\n\nഒരു payment-നെ “charge” എന്ന് വിളിച്ചതുകൊണ്ട് മാത്രം diversion ആവില്ല. ബന്ധപ്പെട്ട നിയമരേഖ, ബാധ്യത enforce ചെയ്യാമോ, source-നോടുള്ള ബന്ധം എന്നിവ പരിശോധിക്കണം.\n\nവരുമാനം ആദ്യം assessee-ക്ക് ലഭിക്കാനുള്ള അവകാശമോ നിയന്ത്രണമോ ഉണ്ടാകുന്നു. പിന്നീട് ആ വരുമാനത്തിൽ നിന്ന് payment നടത്തുന്നത് ഇതിനകം നേടിയ വരുമാനത്തിലെ ബാധ്യത തീർക്കലാണ്.\n\nപിന്നീട് നൽകുന്ന gift, കുടുംബ payment, അല്ലെങ്കിൽ സ്വമേധയാ മാറ്റിവെക്കൽ സാധാരണയായി application ആണ്. പ്രത്യേക statutory deduction അല്ലെങ്കിൽ exemption ഉണ്ടെങ്കിൽ മാത്രമേ tax treatment മാറൂ.\n\nയഥാർത്ഥ diversion ആണെങ്കിൽ മാറ്റിയ തുക assessee-ക്ക് accrue ചെയ്ത വരുമാനമല്ല. Application ആണെങ്കിൽ വരുമാനം taxable ആയി തുടരും; പിന്നീട് ചെലവാക്കിയത് മാത്രം deduction ആവില്ല.\n\nഅവസാനമായി ചോദിക്കുക: assessee-ക്ക് വരുമാനം ലഭിക്കുന്നതിന് മുമ്പ് obligation അത് source-ൽ നിന്ന് മാറ്റിയോ? ആദ്യം assessee-ക്കാണ് ലഭിച്ചതെങ്കിൽ സാധാരണയായി അത് application ആണ്.", "topic_id": "presentation_q3", "topic_title": "Diversion vs Application: Source and Title", "audio_file": "q3.mp3", "dur": 107.84, "duration_seconds": 107.84, "voice_engine": "Gemini Voice (Aoede)", "voice": "Gemini Voice (Aoede)"}, {"question_number": 4, "statutory_sections": ["Annual Finance Act", "Section 115BAC(6)"], "core_principle": "Old-Regime Tax Slabs by Age", "provision_presentation_markdown": "## Old-Regime Tax Slabs by Age\n\n### Resident individual basic exemption and slab rates\n\n| Total income slab | Below 60 years | Age 60 to under 80 | Age 80 and above |\n| :--- | ---: | ---: | ---: |\n| Basic exemption | Up to ₹2,50,000: Nil | Up to ₹3,00,000: Nil | Up to ₹5,00,000: Nil |\n| Next slab | ₹2,50,001–₹5,00,000: 5% | ₹3,00,001–₹5,00,000: 5% | — |\n| Middle slab | ₹5,00,001–₹10,00,000: 20% | ₹5,00,001–₹10,00,000: 20% | ₹5,00,001–₹10,00,000: 20% |\n| Above ₹10,00,000 | 30% | 30% | 30% |\n\n### Regime and rebate rules\n- These old-regime rates apply when the taxpayer validly opts out of the default regime; applicable option rules must be met.\n- Age-based basic exemption is relevant for resident individuals. The default regime does not increase the basic exemption for senior age groups.\n- Section 87A: for a resident individual with total income not exceeding ₹5,00,000, rebate is the lower of tax payable or ₹12,500.\n- Compute slab tax, deduct eligible rebate, then apply surcharge where applicable and 4% Health and Education Cess under the relevant assessment-year rules.", "malayalam_audio_script": "ഇന്ന് old tax regime-ലെ age-based slab വ്യവസ്ഥകൾ മാത്രം നോക്കാം.\n\nDefault regime-ൽ നിന്ന് സാധുവായി മാറി തിരഞ്ഞെടുക്കുമ്പോഴാണ് old regime ബാധകമാകുന്നത്. ഇതിലെ deductions-ഉം exemptions-ഉം default regime-ൽ നിന്ന് വ്യത്യസ്തമാണ്.\n\nResident individual-ന്റെ old-regime basic exemption പ്രായവിഭാഗം അനുസരിച്ച് മാറുന്നു. ശരിയായ age category അനുസരിച്ചുള്ള slab ആണ് തിരഞ്ഞെടുക്കേണ്ടത്.\n\n60 വയസ്സിൽ താഴെയുള്ളവർക്കുള്ള basic exemption ₹2,50,000 ആണ്. ഈ പരിധിക്ക് മുകളിലുള്ള total income-ലാണ് tax തുടങ്ങുന്നത്.\n\n60 മുതൽ 80 വയസ്സിന് താഴെ വരെ exemption ₹3,00,000 ആണ്. 80 വയസ്സും അതിലധികവുമുള്ളവർക്ക് അത് ₹5,00,000 ആണ്.\n\n60 വയസ്സിൽ താഴെയുള്ളവർക്ക് രണ്ടര ലക്ഷം വരെ nil; രണ്ടര മുതൽ അഞ്ച് ലക്ഷം വരെ 5%; അഞ്ച് മുതൽ പത്ത് ലക്ഷം വരെ 20%; പത്ത് ലക്ഷത്തിന് മുകളിൽ 30% നിരക്ക്.\n\nSenior citizens-ന് മൂന്ന് മുതൽ അഞ്ച് ലക്ഷം വരെയുള്ള ഭാഗത്തിന് 5%, തുടർന്ന് പത്ത് ലക്ഷം വരെ 20% ആണ്. Super senior-ന് അഞ്ച് ലക്ഷം വരെ nil; പത്ത് ലക്ഷം വരെ 20%; അതിന് മുകളിൽ 30% ആണ്.\n\nOld regime-ൽ resident individual-ന്റെ total income അഞ്ച് ലക്ഷം കവിയാത്താൽ Section 87A rebate ലഭിക്കും. Tax payable-ഉം ₹12,500-ഉം തമ്മിലുള്ള കുറഞ്ഞ തുകയാണ് rebate.\n\nആദ്യം slab tax കണക്കാക്കുക; ബാധകമായ rebate കുറച്ചശേഷം 4% Health and Education Cess ചേർക്കുക. Surcharge ബാധകമാണെങ്കിൽ അതത് Finance Act അനുസരിച്ച് കണക്കാക്കണം.", "topic_id": "presentation_q4", "topic_title": "Old-Regime Tax Slabs by Age", "audio_file": "q4.mp3", "dur": 121.006, "duration_seconds": 121.006, "voice_engine": "Gemini Voice (Aoede)", "voice": "Gemini Voice (Aoede)"}, {"question_number": 5, "statutory_sections": ["Section 87A"], "core_principle": "Section 87A Rebate: Old Regime", "provision_presentation_markdown": "## Section 87A Rebate: Old Regime\n\n### Eligibility and amount\n\n| Requirement | Rule |\n| :--- | :--- |\n| Taxpayer | Resident individual |\n| Total-income threshold | Not more than ₹5,00,000 |\n| Rebate amount | Lower of income-tax payable or ₹12,500 |\n| Effect | Reduces income-tax; it does not reduce total income |\n\n### Computation order\n1. Compute total income and apply the old-regime slab rates.\n2. Deduct the eligible Section 87A rebate, limited to tax payable and ₹12,500.\n3. Apply surcharge, if applicable, and then 4% Health and Education Cess under the relevant assessment-year rules.\n\nIf the rebate equals the tax payable, income-tax after rebate is nil. If total income exceeds ₹5,00,000, this old-regime rebate is unavailable.", "malayalam_audio_script": "ഇന്ന് Section 87A-യുടെ old-regime rebate വ്യവസ്ഥ മാത്രം പഠിക്കാം.\n\nSection 87A rebate resident individual-നാണ്. ഇത് വരുമാനത്തിൽ നിന്നുള്ള deduction അല്ല; അടയ്ക്കേണ്ട income tax കുറയ്ക്കുന്ന rebate ആണ്.\n\nOld regime-ൽ total income ₹5,00,000 കവിയരുത്. നിയമപ്രകാരം total income കണക്കാക്കിയ ശേഷമാണ് ഈ പരിധി പരിശോധിക്കേണ്ടത്.\n\nIncome tax-ന്റെ 100% വരെ rebate ലഭിക്കാം; പരമാവധി പരിധി ₹12,500 ആണ്. Rebate, അടയ്ക്കേണ്ട tax-നെ കവിയില്ല.\n\nRebate കണക്കാക്കാനുള്ള ലളിതമായ രീതി: income tax payable-ഉം ₹12,500-ഉം തമ്മിലുള്ള കുറഞ്ഞ തുക. Rebate കുറച്ച ശേഷമാണ് cess കണക്കാക്കുന്നത്.\n\nആദ്യം total income-ൽ old-regime slab rates പ്രയോഗിച്ച് tax കണക്കാക്കുക. Rebate-നെ slab ആയോ income exemption ആയോ കാണരുത്.\n\nശേഷം അർഹമായ rebate income tax-ൽ നിന്ന് കുറയ്ക്കുക. Rebate tax-നോട് തുല്യമാണെങ്കിൽ ശേഷിക്കുന്ന income tax nil ആകും.\n\nഅഞ്ച് ലക്ഷം രൂപയുടെ പരിശോധന total income-നെ അടിസ്ഥാനമാക്കിയാണ്. Total income അതിൽ കൂടുതലായാൽ old-regime rebate ലഭ്യമല്ല.\n\nTax കണക്കാക്കുന്ന ക്രമം: slab tax, Section 87A rebate, ബാധകമായ surcharge, തുടർന്ന് 4% cess. ബന്ധപ്പെട്ട assessment year-ലെ നിയമവും rounding-ഉം പാലിക്കണം.", "topic_id": "presentation_q5", "topic_title": "Section 87A Rebate: Old Regime", "audio_file": "q5.mp3", "dur": 98.998, "duration_seconds": 98.998, "voice_engine": "Gemini Voice (Aoede)", "voice": "Gemini Voice (Aoede)"}, {"question_number": 6, "statutory_sections": ["Section 115BAC(1A)"], "core_principle": "Section 115BAC: Default-Regime Slabs", "provision_presentation_markdown": "## Section 115BAC(1A): Default-Regime Slabs\n\n### Progressive slab rates\n\n| Total income slab | Rate of tax |\n| :--- | ---: |\n| Up to ₹4,00,000 | Nil |\n| ₹4,00,001–₹8,00,000 | 5% |\n| ₹8,00,001–₹12,00,000 | 10% |\n| ₹12,00,001–₹16,00,000 | 15% |\n| ₹16,00,001–₹20,00,000 | 20% |\n| ₹20,00,001–₹24,00,000 | 25% |\n| Above ₹24,00,000 | 30% |\n\n### Who and how the regime applies\n- Section 115BAC(1A) provides the default regime for the specified taxpayer classes: individuals, HUFs, AOPs other than co-operative societies, BOIs, and AJPs.\n- Eligible taxpayers may opt for the old regime subject to the applicable option rules.\n- The rates are progressive: each rate applies only to the income falling in that slab.\n- The ₹4,00,000 basic exemption is uniform across age groups; it does not rise for senior citizens.\n\n### Rebate and levy sequence\n- Eligible resident individuals may receive Section 87A rebate up to ₹60,000 where total income does not exceed ₹12,00,000, subject to the applicable statutory conditions.\n- Apply eligible rebate after computing tax; add 4% Health and Education Cess after rebate.\n- Marginal rebate may apply immediately above the ₹12,00,000 threshold.", "malayalam_audio_script": "ഇന്ന് Section 115BAC default regime-ലെ tax slab നിയമങ്ങൾ മാത്രം പഠിക്കാം.\n\nSection 115BAC(1A) നിർദ്ദിഷ്ട വിഭാഗങ്ങൾക്ക് default regime നൽകുന്നു. ബാധകമായ option വ്യവസ്ഥകൾ പാലിച്ച് അർഹരായവർക്ക് old regime തിരഞ്ഞെടുക്കാം.\n\nIndividuals, HUF, co-operative society അല്ലാത്ത AOP, BOI, AJP എന്നിവർക്കാണ് വ്യവസ്ഥ ബാധകമാകുന്നത്. ഈ regime തിരഞ്ഞെടുക്കുമ്പോൾ അതിലെ നിബന്ധനകളും deduction നിയന്ത്രണങ്ങളും ബാധകമാണ്.\n\nനാല് ലക്ഷം രൂപ വരെ tax ഇല്ല. നാല് ലക്ഷം മുതൽ എട്ട് ലക്ഷം വരെയുള്ള slab-ിന് 5% ആണ്.\n\nഎട്ട് ലക്ഷം മുതൽ പന്ത്രണ്ട് ലക്ഷം വരെയുള്ള slab-ിന് 10% ആണ്. ഓരോ നിരക്കും അതത് slab-ിലെ വരുമാനഭാഗത്തിന് മാത്രം പ്രയോഗിക്കുന്ന progressive രീതിയാണ്.\n\nപന്ത്രണ്ട് മുതൽ പതിനാറ് ലക്ഷം വരെ 15%; പതിനാറ് മുതൽ ഇരുപത് ലക്ഷം വരെ 20%. മുൻ slab-ുകളിലെ tax കൂട്ടിച്ചേർത്താണ് തുടർന്നുള്ള tax കണ്ടെത്തുന്നത്.\n\nഇരുപത് മുതൽ ഇരുപത്തിനാല് ലക്ഷം വരെ 25% ആണ്. ഇരുപത്തിനാല് ലക്ഷം രൂപയ്ക്ക് മുകളിലുള്ള ഭാഗത്തിന് 30% ആണ്.\n\nഈ regime-ൽ മുതിർന്ന പ്രായവിഭാഗങ്ങൾക്ക് basic exemption ഉയരുന്നില്ല. പ്രായം നോക്കാതെ ഒരേ slab പരിധികളാണ് ഉപയോഗിക്കുന്നത്.\n\nTotal income ₹12 ലക്ഷം കവിയാത്ത അർഹനായ resident individual-ന് Section 87A പ്രകാരം പരമാവധി ₹60,000 rebate ലഭിക്കും. Rebate-ന് ശേഷം 4% cess ചേർക്കുക; പരിധിക്ക് തൊട്ടുമുകളിലെ വരുമാനത്തിൽ marginal rebate ബാധകമായേക്കാം.", "topic_id": "presentation_q6", "topic_title": "Section 115BAC: Default-Regime Slabs", "audio_file": "q6.mp3", "dur": 124.054, "duration_seconds": 124.054, "voice_engine": "Gemini Voice (Aoede)", "voice": "Gemini Voice (Aoede)"}, {"question_number": 7, "statutory_sections": ["Section 87A", "Section 115BAC"], "core_principle": "Section 87A Rebate: Default Regime", "provision_presentation_markdown": "## Section 87A Rebate: Default Regime\n\n### Eligibility and rebate\n\n| Requirement | Default-regime rule |\n| :--- | :--- |\n| Taxpayer | Resident individual |\n| Standard total-income threshold (A.Y. 2026–27) | Not more than ₹12,00,000 |\n| Maximum rebate | ₹60,000 |\n| Limit | Rebate cannot exceed eligible income-tax payable |\n| Effect | Reduces tax; it does not reduce total income |\n\n### Calculation order\n1. Apply Section 115BAC slab rates progressively and find income-tax before rebate.\n2. If eligible, deduct the lower of tax payable or ₹60,000.\n3. Add 4% Health and Education Cess on the tax remaining after rebate.\n\nThe standard full-threshold rebate is unavailable above ₹12,00,000. Marginal rebate may limit the tax increase immediately above that threshold. Special-rate income may carry separate rebate restrictions, so apply the relevant statutory rules.", "malayalam_audio_script": "ഇന്ന് default regime-ലെ Section 87A rebate വ്യവസ്ഥ മാത്രം നോക്കാം.\n\nSection 87A rebate resident individual-നാണ്. Default regime-ിലെ പരിധി old regime-ിലെ പരിധിയിൽ നിന്ന് വ്യത്യസ്തമാണ്.\n\n2026–27 assessment year-ൽ സാധാരണ rebate ലഭിക്കാൻ total income ₹12,00,000 കവിയരുത്. നിയമപ്രകാരമുള്ള income computation കഴിഞ്ഞാണ് പരിധി പരിശോധിക്കുന്നത്.\n\nഅടയ്ക്കേണ്ട income tax-ന്റെ 100% വരെ rebate ലഭിക്കും. Default regime-ൽ rebate-ന്റെ പരമാവധി ₹60,000 ആണ്.\n\nഇത് total income കുറയ്ക്കുന്നതല്ല, tax കുറയ്ക്കുന്നതാണ്. അർഹമായ income tax-നെക്കാൾ rebate കൂടുതലാകില്ല.\n\nSection 115BAC slab നിരക്കുകൾ progressive ആയി പ്രയോഗിച്ച് ആദ്യം rebate-നു മുമ്പുള്ള income tax കണക്കാക്കുക.\n\nഅർഹതയുണ്ടെങ്കിൽ tax payable-ഉം ₹60,000-ഉം തമ്മിലുള്ള കുറഞ്ഞ തുക കുറയ്ക്കുക. ശേഷിക്കുന്ന tax-ലാണ് cess കണക്കാക്കുന്നത്.\n\nIncome ₹12 ലക്ഷം കവിയുമ്പോൾ സാധാരണ threshold rebate ലഭ്യമല്ല. പരിധിക്ക് തൊട്ടുമുകളിലെ tax വർധന marginal rebate വഴി നിയന്ത്രിക്കാം.\n\nRebate കഴിഞ്ഞ് Health and Education Cess 4% കണക്കാക്കുക. Special-rate income-ന് rebate സംബന്ധിച്ച പ്രത്യേക നിയന്ത്രണങ്ങളുണ്ടാകാം; ബാധകമായ നിയമം പരിശോധിക്കണം.", "topic_id": "presentation_q7", "topic_title": "Section 87A Rebate: Default Regime", "audio_file": "q7.mp3", "dur": 94.174, "duration_seconds": 94.174, "voice_engine": "Gemini Voice (Aoede)", "voice": "Gemini Voice (Aoede)"}, {"question_number": 8, "statutory_sections": ["Section 87A", "Section 115BAC"], "core_principle": "Section 87A Marginal Rebate", "provision_presentation_markdown": "## Section 87A Marginal Rebate\n\n### Threshold and computation\n\n| Step | Rule |\n| :--- | :--- |\n| 1. Find excess income | Total income − ₹12,00,000 |\n| 2. Compute tax | Apply Section 115BAC slabs; find tax before rebate and cess |\n| 3. Compare | Compare tax before rebate with excess income |\n| 4. Limit tax | Where tax exceeds excess income, marginal rebate limits the post-rebate tax to the excess-income ceiling, subject to statutory rules |\n| 5. Add cess | Add 4% Health and Education Cess after rebate |\n\n### Key points\n- Standard Section 87A rebate is available up to total income of ₹12,00,000; limited marginal rebate may apply just above the threshold.\n- The comparison is made before cess. Do not include cess when calculating the marginal-rebate ceiling.\n- Confirm residency, total income, and the nature of income; special-rate income can have separate rebate restrictions.", "malayalam_audio_script": "ഇന്ന് Section 87A പ്രകാരമുള്ള marginal rebate വ്യവസ്ഥ മാത്രം പഠിക്കാം.\n\nSection 87A-യുടെ സാധാരണ rebate total income ₹12 ലക്ഷം വരെ ലഭ്യമാണ്. അതിന് തൊട്ടുമുകളിലെ income-ൽ പരിമിതമായ marginal rebate ലഭിക്കാം.\n\n₹12 ലക്ഷം threshold കടന്നതുകൊണ്ട് tax വർധന, അധിക വരുമാനത്തെക്കാൾ കൂടുതലാകാതിരിക്കാൻ marginal rebate സഹായിക്കുന്നു. ഈ താരതമ്യം cess-നു മുമ്പാണ്.\n\nTotal income-ൽ Section 115BAC slabs പ്രയോഗിക്കുക. Section 87A rebate-നും cess-നും മുമ്പുള്ള income tax കണ്ടെത്തുക.\n\nഅധിക വരുമാനം = total income − ₹12,00,000. Cess-നു മുമ്പുള്ള tax-ന്റെ പരിധി ഈ അധിക തുകയാണ്.\n\nRebate-നു മുമ്പുള്ള tax, അധിക വരുമാനത്തെക്കാൾ കൂടുതലാണെങ്കിൽ marginal relief പ്രസക്തമാണ്. നിയമത്തിലെ പരിധിക്ക് വിധേയമായി marginal rebate = tax before rebate − അധിക വരുമാനം.\n\nRebate ശേഷമുള്ള tax, ₹12 ലക്ഷത്തിന് മുകളിലുള്ള വരുമാനത്തെ കവിയരുത്. ഈ താരതമ്യത്തിൽ cess ഉൾപ്പെടുത്തരുത്.\n\nRebate കുറച്ചശേഷം 4% Health and Education Cess ചേർക്കുക. Relief ശേഷമുള്ള tax-ലാണ് cess കണക്കാക്കേണ്ടത്.\n\nResidency, total-income threshold, വരുമാനത്തിന്റെ സ്വഭാവം എന്നിവ ഉറപ്പാക്കണം. Special-rate income-ന് rebate സംബന്ധിച്ച വേറിട്ട നിയന്ത്രണങ്ങൾ ഉണ്ടാകാം.", "topic_id": "presentation_q8", "topic_title": "Section 87A Marginal Rebate", "audio_file": "q8.mp3", "dur": 109.966, "duration_seconds": 109.966, "voice_engine": "Gemini Voice (Aoede)", "voice": "Gemini Voice (Aoede)"}, {"question_number": 9, "statutory_sections": ["Finance Act", "Domestic Company Rates"], "core_principle": "Company Surcharge Relief above ₹1 Crore", "provision_presentation_markdown": "## Company Surcharge Relief Above ₹1 Crore\n\n### Domestic-company framework\n- Apply the tax rate and option conditions prescribed for the relevant assessment year. Sections 115BA, 115BAA, and 115BAB have separate eligibility and deduction conditions.\n- For a regular domestic company, surcharge is calculated on income-tax. Health and Education Cess is 4% of income-tax plus surcharge.\n\n### Surcharge thresholds and relief\n\n| Threshold | Regular-company surcharge | Marginal-relief ceiling before cess |\n| :--- | ---: | :--- |\n| Income above ₹1 crore up to ₹10 crore | 7% | Tax plus surcharge at ₹1 crore + income exceeding ₹1 crore |\n| Income above ₹10 crore | 12% | Tax plus surcharge at ₹10 crore + income exceeding ₹10 crore |\n\n### Computation sequence\n1. Compute income-tax and surcharge before relief.\n2. Compare tax plus surcharge with the applicable threshold ceiling.\n3. Marginal relief is the positive excess over that ceiling.\n4. Deduct relief, then add 4% cess to the remaining tax plus surcharge.", "malayalam_audio_script": "ഇന്ന് domestic company-കൾക്ക് ഒരു കോടി രൂപ threshold-ൽ ബാധകമായ surcharge relief മാത്രം നോക്കാം.\n\nDomestic company-കൾക്ക് അതത് Finance Act നിശ്ചയിക്കുന്ന നിരക്കാണ് ബാധകം. സാധാരണ നിരക്ക് 30%; നിശ്ചിത turnover വ്യവസ്ഥ പാലിച്ചാൽ 25% നിരക്ക് ലഭിക്കാം.\n\nSections 115BA, 115BAA, 115BAB എന്നിവ വേറിട്ട tax options നൽകുന്നു. Option അനുസരിച്ച് അർഹത, നിബന്ധന, surcharge, deduction നിയന്ത്രണം എന്നിവ മാറും.\n\nസാധാരണ domestic company-ക്ക് income ഒരു കോടി കവിയുകയും പത്ത് കോടി വരെ ആയിരിക്കുകയും ചെയ്താൽ 7% surcharge. പത്ത് കോടി കവിയുമ്പോൾ 12%; surcharge income tax-ലാണ് കണക്കാക്കുന്നത്.\n\nIncome tax-ും surcharge-ും ചേർന്ന തുകയ്ക്ക് 4% Health and Education Cess ബാധകമാണ്. Marginal relief ഉണ്ടെങ്കിൽ അത് കണക്കാക്കിയ ശേഷമാണ് cess ചേർക്കുന്നത്.\n\nഒരു കോടി രൂപയുടെ threshold കടക്കുമ്പോൾ surcharge മൂലം വരുന്ന അധികഭാരം കുറയ്ക്കാനാണ് marginal relief. Tax plus surcharge-നെ threshold tax-ും ഒരു കോടിക്ക് മുകളിലെ അധിക വരുമാനവും ചേർന്ന തുകയുമായി താരതമ്യം ചെയ്യുക.\n\nപരമാവധി പരിധി = ഒരു കോടി രൂപയിലെ tax-ും surcharge-ും + (total income − ഒരു കോടി). Relief = relief-നു മുമ്പുള്ള tax plus surcharge − ഈ പരിധി; വ്യത്യാസം positive ആണെങ്കിൽ.\n\nപത്ത് കോടി കവിയുന്ന income-ൽ സാധാരണ company surcharge 12% ആണ്. പത്ത് കോടിയുടെ threshold-ൽ ഉണ്ടാകുന്ന tax jump marginal relief നിയന്ത്രിക്കുന്നു.\n\nപരമാവധി പരിധി = പത്ത് കോടി രൂപയിലെ tax plus surcharge + അതിന് മുകളിലെ വരുമാനം. Relief കുറച്ചശേഷം ശേഷിക്കുന്ന tax plus surcharge-ൽ 4% cess ചേർക്കുക.", "topic_id": "presentation_q9", "topic_title": "Company Surcharge Relief above ₹1 Crore", "audio_file": "q9.mp3", "dur": 105.368, "duration_seconds": 105.368, "voice_engine": "Gemini Voice (Aoede)", "voice": "Gemini Voice (Aoede)"}, {"question_number": 10, "statutory_sections": ["Finance Act", "Domestic Company Rates"], "core_principle": "Company Surcharge Relief above ₹10 Crore", "provision_presentation_markdown": "## Company Surcharge Relief Above ₹10 Crore\n\n### Domestic-company framework\n- Apply the tax rate and option conditions prescribed for the relevant assessment year. Sections 115BA, 115BAA, and 115BAB have separate eligibility and deduction conditions.\n- For a regular domestic company, surcharge is calculated on income-tax. Health and Education Cess is 4% of income-tax plus surcharge.\n\n### Surcharge thresholds and relief\n\n| Threshold | Regular-company surcharge | Marginal-relief ceiling before cess |\n| :--- | ---: | :--- |\n| Income above ₹1 crore up to ₹10 crore | 7% | Tax plus surcharge at ₹1 crore + income exceeding ₹1 crore |\n| Income above ₹10 crore | 12% | Tax plus surcharge at ₹10 crore + income exceeding ₹10 crore |\n\n### Computation sequence\n1. Compute income-tax and surcharge before relief.\n2. At income just above ₹10 crore, compare tax plus surcharge with the tax and surcharge at ₹10 crore plus income exceeding ₹10 crore.\n3. Marginal relief is the positive excess over that ceiling.\n4. Deduct relief, then add 4% cess to the remaining tax plus surcharge.", "malayalam_audio_script": "ഇന്ന് domestic company-കൾക്ക് പത്ത് കോടി രൂപ threshold-ൽ ബാധകമായ surcharge relief മാത്രം പഠിക്കാം.\n\nDomestic company-കൾക്ക് അതത് Finance Act നിശ്ചയിക്കുന്ന നിരക്കാണ് ബാധകം. സാധാരണ നിരക്ക് 30%; നിശ്ചിത turnover വ്യവസ്ഥ പാലിച്ചാൽ 25% നിരക്ക് ലഭിക്കാം.\n\nSections 115BA, 115BAA, 115BAB എന്നിവ വേറിട്ട tax options നൽകുന്നു. Option അനുസരിച്ച് അർഹത, നിബന്ധന, surcharge, deduction നിയന്ത്രണം എന്നിവ മാറും.\n\nസാധാരണ domestic company-ക്ക് income ഒരു കോടി കവിയുകയും പത്ത് കോടി വരെ ആയിരിക്കുകയും ചെയ്താൽ 7% surcharge. പത്ത് കോടി കവിയുമ്പോൾ 12%; surcharge income tax-ലാണ് കണക്കാക്കുന്നത്.\n\nIncome tax-ും surcharge-ും ചേർന്ന തുകയ്ക്ക് 4% Health and Education Cess ബാധകമാണ്. Marginal relief ഉണ്ടെങ്കിൽ അത് കണക്കാക്കിയ ശേഷമാണ് cess ചേർക്കുന്നത്.\n\nഒരു കോടി രൂപയുടെ threshold കടക്കുമ്പോൾ surcharge മൂലം വരുന്ന അധികഭാരം കുറയ്ക്കാനാണ് marginal relief. Tax plus surcharge-നെ threshold tax-ും ഒരു കോടിക്ക് മുകളിലെ അധിക വരുമാനവും ചേർന്ന തുകയുമായി താരതമ്യം ചെയ്യുക.\n\nപരമാവധി പരിധി = ഒരു കോടി രൂപയിലെ tax-ും surcharge-ും + (total income − ഒരു കോടി). Relief = relief-നു മുമ്പുള്ള tax plus surcharge − ഈ പരിധി; വ്യത്യാസം positive ആണെങ്കിൽ.\n\nപത്ത് കോടി കവിയുന്ന income-ൽ സാധാരണ company surcharge 12% ആണ്. പത്ത് കോടിയുടെ threshold-ൽ ഉണ്ടാകുന്ന tax jump marginal relief നിയന്ത്രിക്കുന്നു.\n\nപരമാവധി പരിധി = പത്ത് കോടി രൂപയിലെ tax plus surcharge + അതിന് മുകളിലെ വരുമാനം. Relief കുറച്ചശേഷം ശേഷിക്കുന്ന tax plus surcharge-ൽ 4% cess ചേർക്കുക.", "topic_id": "presentation_q10", "topic_title": "Company Surcharge Relief above ₹10 Crore", "audio_file": "q10.mp3", "dur": 91.006, "duration_seconds": 91.006, "voice_engine": "Gemini Voice (Aoede)", "voice": "Gemini Voice (Aoede)"}], "mindmaps": {"q1": {"doctrine": "Diversion vs. Application of Income", "root": {"id": "root", "number": "1", "title": "Diversion vs. Application of Income", "badge": "Section 4", "voice_sync_text": "നമസ്കാരം! ഇന്ന് നമ്മൾ പഠിക്കുന്നത് ഇൻകം ടാക്സ് ആക്റ്റിലെ സെക്ഷൻ നാല് പ്രകാരമുള്ള ഏറ്റവും പ്രധാനപ്പെട്ട രണ്ട് ലീഗൽ ഡോക്ട്രിനുകളാണ്: Diversion of Income വേഴ്സസ് Application of Income. ടാക്സബിലിറ്റി നിശ്ചയിക്കുന്നതിൽ ഈ വ്യത്യാസം വളരെ നിർണ്ണായകമാണ്.", "pt_idx": 0, "audio_file": "q1/pt_0.mp3", "drive_audio_id": "1f15ZeBrGVEJ07Px2VT6kbbw7PNFLJbB5", "duration": 15.09}, "branches": [{"branch_id": "branch-1", "branch_title": "Diversion by Overriding Title", "badge": "Non-Taxable", "icon": "shield", "points": [{"id": "beat-1-1", "title": "Legal Overriding Title", "number": "1.1.1", "badge": "Doctrine", "body": ["Obligation is created by a superior title or law.", "The income never effectively reaches the assessee.", "Example: Statutory charge on profit for a specific purpose."], "table_data": null, "voice_sync_text": "ആദ്യമായി, Diversion by Overriding Title എന്താണെന്ന് നോക്കാം. ഇവിടെ ഒരു നിയമപരമായ ഓവർറൈഡിംഗ് ടൈറ്റിൽ കാരണം, വരുമാനം അസസ്സീയുടെ കയ്യിൽ എത്തുന്നതിന് മുൻപ് തന്നെ സോഴ്സിൽ വെച്ച് മറ്റൊരിടത്തേക്ക് മാറ്റപ്പെടുന്നു. ഇത് അസസ്സീയുടെ വരുമാനമായി കണക്കാക്കില്ല, അതിനാൽ തന്നെ ഇതിന് നികുതി നൽകേണ്ടതില്ല.", "pt_idx": 1, "audio_file": "q1/pt_1.mp3", "drive_audio_id": "1V2ZvKmq3X0HQ5GdVKTrGr_6YlI2kdmw5", "duration": 18.33}], "flow_summary": []}, {"branch_id": "branch-2", "branch_title": "Application of Income", "badge": "Taxable", "icon": "rupee", "points": [{"id": "beat-2-1", "title": "Post-Accrual Disposal", "number": "2.1.1", "badge": "Rule", "body": ["Income first accrues to the assessee.", "Assessee then decides to spend or transfer it.", "The destination is chosen by the assessee's will."], "table_data": null, "voice_sync_text": "രണ്ടാമതായി, Application of Income. ഇവിടെ വരുമാനം ആദ്യം അസസ്സീക്ക് നിയമപരമായി വന്നുചേരുന്നു. അതിനുശേഷം അസസ്സീ സ്വന്തം ഇഷ്ടപ്രകാരം ആ പണം മറ്റൊരാൾക്ക് നൽകുകയോ ചെലവഴിക്കുകയോ ചെയ്യുന്നു. ഇത് പൂർണ്ണമായും ടാക്സബിൾ ആണ്, യാതൊരു ഡിഡക്ഷനും ലഭിക്കില്ല.", "pt_idx": 2, "audio_file": "q1/pt_2.mp3", "drive_audio_id": "1TLvI2iJYMvuovO8unR0R2hSPQ7dyI1A5", "duration": 17.45}], "flow_summary": []}, {"branch_id": "branch-3", "branch_title": "Judicial Benchmarks", "badge": "Tests", "icon": "scales", "points": [{"id": "beat-3-1", "title": "Determining Factors", "number": "3.1.1", "badge": "Checklist", "body": ["Who created the obligation? (Client vs Assessee)", "When was the charge created?", "Nature of the binding contract."], "table_data": {"headers": ["Scenario", "Classification"], "rows": [["Partner gives share to wife per Decree", "Diversion"], ["Assessee creates trust from fees", "Application"]]}, "voice_sync_text": "മൂന്നാമതായി, ജുഡീഷ്യൽ ബെഞ്ച്മാർക്കുകളും നിർണ്ണായക ഘടകങ്ങളും. ഒരു തുക ഡൈവേർഷൻ ആണോ ആപ്ലിക്കേഷൻ ആണോ എന്ന് തീരുമാനിക്കുന്നത് ബാധ്യത എപ്പോൾ, ആര് ഉണ്ടാക്കി എന്നതിനെ ആശ്രയിച്ചാണ്. കോടതി വിധി പ്രകാരം പങ്കാളി ഭാര്യക്ക് വിഹിതം നൽകുന്നത് ഓവർറൈഡിംഗ് ടൈറ്റിൽ ആയതിനാൽ ഡൈവേർഷൻ ആണ്. എന്നാൽ ഫീസിൽ നിന്നും ട്രസ്റ്റ് ഉണ്ടാക്കുന്നത് അസസ്സീയുടെ സ്വന്തം തീരുമാനമായതിനാൽ ആപ്ലിക്കേഷൻ മാത്രമാണ്.", "pt_idx": 3, "audio_file": "q1/pt_3.mp3", "drive_audio_id": "17EeqlYLK54fmpB7ugQN26AdNV7cne952", "duration": 23.93}], "flow_summary": []}], "total_points_count": 4, "drive_folder_id": "1gIAoMsQdG8YVUy6HcNsZdvRYvlGxxU6e", "total_duration": 74.8}, "q2": {"doctrine": "Diversion by Overriding Title", "root": {"id": "root", "number": "1", "title": "Diversion by Overriding Title", "badge": "Section 4", "t1": 5.928, "voice_sync_text": "ഇന്ന് overriding title വഴി income diversion ആകുന്നതിന്റെ നിയമതത്വം മാത്രം നോക്കാം."}, "total_duration": 114.84, "branches": [{"branch_id": "q2-branch-1", "branch_title": "Core distinction", "number": "1.1", "badge": "Core distinction", "icon": "scales", "t0": 7.428, "t1": 31.416, "points": [{"id": "q2-beat-1-0", "title": "Two ways income may be transferred", "number": "1.1.1", "badge": "Rule", "body": ["Diversion: a superior legal obligation diverts income at its source.", "Application: the assessee first earns or receives income, then uses it."], "table_data": null, "spoken": true, "t0": 7.428, "t1": 20.268, "voice_sync_text": "വരുമാനത്തിന്റെ വിനിയോഗത്തിൽ രണ്ട് നിയമസ്ഥിതികളുണ്ട്. Source-ൽ തന്നെ മേലധികാരമുള്ള നിയമബാധ്യത വരുമാനം മാറ്റിയാൽ diversion; ആദ്യം വരുമാനം ലഭിച്ച് പിന്നീട് ഉപയോഗിച്ചാൽ application.", "icon": "check", "highlights": []}, {"id": "q2-beat-2-0", "title": "Why timing matters", "number": "1.1.2", "badge": "Rule", "body": ["The decisive question is when the obligation operates.", "Trace whether income reaches the assessee as their own income first."], "table_data": null, "spoken": true, "t0": 21.768, "t1": 31.416, "voice_sync_text": "പ്രധാന പരിശോധന obligation എപ്പോൾ പ്രവർത്തിക്കുന്നു എന്നതാണ്. വരുമാനം assessee-യുടെ സ്വന്തം വരുമാനമായി ആദ്യം ലഭിക്കുന്നുണ്ടോ എന്ന് കണ്ടെത്തണം.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q2-branch-2", "branch_title": "Overriding title", "number": "1.2", "badge": "Overriding title", "icon": "scales", "t0": 32.916, "t1": 58.392, "points": [{"id": "q2-beat-3-0", "title": "Obligation attached to source", "number": "1.2.1", "badge": "Rule", "body": ["A pre-existing enforceable obligation must bind the income-producing source.", "The assessee’s title is overridden before the income accrues as their own."], "table_data": null, "spoken": true, "t0": 32.916, "t1": 44.772, "voice_sync_text": "മുൻകൂട്ടിയുള്ള enforceable obligation വരുമാനം സൃഷ്ടിക്കുന്ന source-നോട് ബന്ധിപ്പിച്ചിരിക്കണം. വരുമാനം സ്വന്തം വരുമാനമായി ലഭിക്കുന്നതിന് മുമ്പ് assessee-യുടെ title മറികടക്കണം.", "icon": "check", "highlights": []}, {"id": "q2-beat-4-0", "title": "Legal character, not label", "number": "1.2.2", "badge": "Rule", "body": ["Calling a payment a “charge” is not enough by itself.", "Examine the legal instrument, enforceability, and link to the source."], "table_data": null, "spoken": true, "t0": 46.272, "t1": 58.392, "voice_sync_text": "ഒരു payment-നെ “charge” എന്ന് വിളിച്ചതുകൊണ്ട് മാത്രം diversion ആവില്ല. ബന്ധപ്പെട്ട നിയമരേഖ, ബാധ്യത enforce ചെയ്യാമോ, source-നോടുള്ള ബന്ധം എന്നിവ പരിശോധിക്കണം.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q2-branch-3", "branch_title": "Application of income", "number": "1.3", "badge": "Application of income", "icon": "scales", "t0": 59.892, "t1": 87.048, "points": [{"id": "q2-beat-5-0", "title": "Income accrues first", "number": "1.3.1", "badge": "Rule", "body": ["The assessee obtains the right to receive or control the income.", "A later payment discharges an obligation from income already earned."], "table_data": null, "spoken": true, "t0": 59.892, "t1": 71.58, "voice_sync_text": "വരുമാനം ആദ്യം assessee-ക്ക് ലഭിക്കാനുള്ള അവകാശമോ നിയന്ത്രണമോ ഉണ്ടാകുന്നു. പിന്നീട് ആ വരുമാനത്തിൽ നിന്ന് payment നടത്തുന്നത് ഇതിനകം നേടിയ വരുമാനത്തിലെ ബാധ്യത തീർക്കലാണ്.", "icon": "check", "highlights": []}, {"id": "q2-beat-6-0", "title": "Use does not erase income", "number": "1.3.2", "badge": "Rule", "body": ["A later gift, family payment, or voluntary allocation is ordinarily application.", "Tax treatment changes only where a specific statutory deduction or exemption applies."], "table_data": null, "spoken": true, "t0": 73.08, "t1": 87.048, "voice_sync_text": "പിന്നീട് നൽകുന്ന gift, കുടുംബ payment, അല്ലെങ്കിൽ സ്വമേധയാ മാറ്റിവെക്കൽ സാധാരണയായി application ആണ്. പ്രത്യേക statutory deduction അല്ലെങ്കിൽ exemption ഉണ്ടെങ്കിൽ മാത്രമേ tax treatment മാറൂ.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q2-branch-4", "branch_title": "Tax consequence and test", "number": "1.4", "badge": "Tax consequence and test", "icon": "scales", "t0": 88.548, "t1": 114.84, "points": [{"id": "q2-beat-7-0", "title": "Different tax treatment", "number": "1.4.1", "badge": "Rule", "body": ["Genuine diversion: the diverted amount is not income accruing to the assessee.", "Application: the income remains taxable; later spending is not itself a deduction."], "table_data": null, "spoken": true, "t0": 88.548, "t1": 101.172, "voice_sync_text": "യഥാർത്ഥ diversion ആണെങ്കിൽ മാറ്റിയ തുക assessee-ക്ക് accrue ചെയ്ത വരുമാനമല്ല. Application ആണെങ്കിൽ വരുമാനം taxable ആയി തുടരും; പിന്നീട് ചെലവാക്കിയത് മാത്രം deduction ആവില്ല.", "icon": "check", "highlights": []}, {"id": "q2-beat-8-0", "title": "Apply the source test", "number": "1.4.2", "badge": "Rule", "body": ["Ask: did the obligation take income away before the assessee acquired it?", "If the assessee acquired it first, the payment is application in the ordinary case."], "table_data": null, "spoken": true, "t0": 102.672, "t1": 114.84, "voice_sync_text": "അവസാനമായി ചോദിക്കുക: assessee-ക്ക് വരുമാനം ലഭിക്കുന്നതിന് മുമ്പ് obligation അത് source-ൽ നിന്ന് മാറ്റിയോ? ആദ്യം assessee-ക്കാണ് ലഭിച്ചതെങ്കിൽ സാധാരണയായി അത് application ആണ്.", "icon": "check", "highlights": []}], "flow_summary": []}]}, "q3": {"doctrine": "Diversion vs Application: Source and Title", "root": {"id": "root", "number": "1", "title": "Diversion vs Application: Source and Title", "badge": "Section 4", "t1": 8.208, "voice_sync_text": "ഇന്ന് source-ൽ diversion-ഉം income ലഭിച്ച ശേഷമുള്ള application-ഉം തമ്മിലുള്ള നിയമവ്യത്യാസം മാത്രം പഠിക്കാം."}, "total_duration": 117.12, "branches": [{"branch_id": "q3-branch-1", "branch_title": "Core distinction", "number": "1.1", "badge": "Core distinction", "icon": "scales", "t0": 9.708, "t1": 33.696, "points": [{"id": "q3-beat-1-0", "title": "Two ways income may be transferred", "number": "1.1.1", "badge": "Rule", "body": ["Diversion: a superior legal obligation diverts income at its source.", "Application: the assessee first earns or receives income, then uses it."], "table_data": null, "spoken": true, "t0": 9.708, "t1": 22.548, "voice_sync_text": "വരുമാനത്തിന്റെ വിനിയോഗത്തിൽ രണ്ട് നിയമസ്ഥിതികളുണ്ട്. Source-ൽ തന്നെ മേലധികാരമുള്ള നിയമബാധ്യത വരുമാനം മാറ്റിയാൽ diversion; ആദ്യം വരുമാനം ലഭിച്ച് പിന്നീട് ഉപയോഗിച്ചാൽ application.", "icon": "check", "highlights": []}, {"i
