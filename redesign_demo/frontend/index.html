d": "q4-branch-2", "branch_title": "Basic exemption", "number": "1.2", "badge": "Basic exemption", "icon": "scales", "t0": 32.436, "t1": 54.096, "points": [{"id": "q4-beat-3-0", "title": "Under 60 years", "number": "1.2.1", "badge": "Rule", "body": ["Basic exemption: ₹2,50,000.", "Tax starts on total income above this limit."], "table_data": null, "spoken": true, "t0": 32.436, "t1": 42.972, "voice_sync_text": "60 വയസ്സിൽ താഴെയുള്ളവർക്കുള്ള basic exemption ₹2,50,000 ആണ്. ഈ പരിധിക്ക് മുകളിലുള്ള total income-ലാണ് tax തുടങ്ങുന്നത്.", "icon": "check", "highlights": []}, {"id": "q4-beat-4-0", "title": "Senior and super senior", "number": "1.2.2", "badge": "Rule", "body": ["Age 60 to under 80: basic exemption ₹3,00,000.", "Age 80 and above: basic exemption ₹5,00,000."], "table_data": null, "spoken": true, "t0": 44.472, "t1": 54.096, "voice_sync_text": "60 മുതൽ 80 വയസ്സിന് താഴെ വരെ exemption ₹3,00,000 ആണ്. 80 വയസ്സും അതിലധികവുമുള്ളവർക്ക് അത് ₹5,00,000 ആണ്.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q4-branch-3", "branch_title": "Progressive slab rates", "number": "1.3", "badge": "Progressive slab rates", "icon": "scales", "t0": 55.596, "t1": 88.248, "points": [{"id": "q4-beat-5-0", "title": "Rates for individuals under 60", "number": "1.3.1", "badge": "Rule", "body": ["Up to ₹2.5 lakh: nil; ₹2.5–5 lakh: 5%.", "₹5–10 lakh: 20%; above ₹10 lakh: 30%."], "table_data": null, "spoken": true, "t0": 55.596, "t1": 69.396, "voice_sync_text": "60 വയസ്സിൽ താഴെയുള്ളവർക്ക് രണ്ടര ലക്ഷം വരെ nil; രണ്ടര മുതൽ അഞ്ച് ലക്ഷം വരെ 5%; അഞ്ച് മുതൽ പത്ത് ലക്ഷം വരെ 20%; പത്ത് ലക്ഷത്തിന് മുകളിൽ 30% നിരക്ക്.", "icon": "check", "highlights": []}, {"id": "q4-beat-6-0", "title": "Rates for senior groups", "number": "1.3.2", "badge": "Rule", "body": ["Senior citizens: 5% above ₹3 lakh to ₹5 lakh; then 20% to ₹10 lakh.", "Super seniors: nil to ₹5 lakh; then 20% to ₹10 lakh; above that 30%."], "table_data": null, "spoken": true, "t0": 70.896, "t1": 88.248, "voice_sync_text": "Senior citizens-ന് മൂന്ന് മുതൽ അഞ്ച് ലക്ഷം വരെയുള്ള ഭാഗത്തിന് 5%, തുടർന്ന് പത്ത് ലക്ഷം വരെ 20% ആണ്. Super senior-ന് അഞ്ച് ലക്ഷം വരെ nil; പത്ത് ലക്ഷം വരെ 20%; അതിന് മുകളിൽ 30% ആണ്.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q4-branch-4", "branch_title": "Reliefs and final levy", "number": "1.4", "badge": "Reliefs and final levy", "icon": "scales", "t0": 89.748, "t1": 120.192, "points": [{"id": "q4-beat-7-0", "title": "Section 87A in old regime", "number": "1.4.1", "badge": "Rule", "body": ["Resident individual; total income not above ₹5,00,000.", "Rebate is the lower of tax payable or ₹12,500."], "table_data": null, "spoken": true, "t0": 89.748, "t1": 105.324, "voice_sync_text": "Old regime-ൽ resident individual-ന്റെ total income അഞ്ച് ലക്ഷം കവിയാത്താൽ Section 87A rebate ലഭിക്കും. Tax payable-ഉം ₹12,500-ഉം തമ്മിലുള്ള കുറഞ്ഞ തുകയാണ് rebate.", "icon": "check", "highlights": []}, {"id": "q4-beat-8-0", "title": "Cess and computation order", "number": "1.4.2", "badge": "Rule", "body": ["Compute slab tax, apply eligible rebate, then add 4% Health and Education Cess.", "Surcharge, where applicable, is governed by the relevant Finance Act."], "table_data": null, "spoken": true, "t0": 106.824, "t1": 120.192, "voice_sync_text": "ആദ്യം slab tax കണക്കാക്കുക; ബാധകമായ rebate കുറച്ചശേഷം 4% Health and Education Cess ചേർക്കുക. Surcharge ബാധകമാണെങ്കിൽ അതത് Finance Act അനുസരിച്ച് കണക്കാക്കണം.", "icon": "check", "highlights": []}], "flow_summary": []}]}, "q5": {"doctrine": "Section 87A Rebate: Old Regime", "root": {"id": "root", "number": "1", "title": "Section 87A Rebate: Old Regime", "badge": "Section 87A", "t1": 5.544, "voice_sync_text": "ഇന്ന് Section 87A-യുടെ old-regime rebate വ്യവസ്ഥ മാത്രം പഠിക്കാം."}, "total_duration": 104.112, "branches": [{"branch_id": "q5-branch-1", "branch_title": "Section 87A scope", "number": "1.1", "badge": "Section 87A scope", "icon": "scales", "t0": 7.044, "t1": 28.968, "points": [{"id": "q5-beat-1-0", "title": "Who may claim", "number": "1.1.1", "badge": "Rule", "body": ["The rebate is for a resident individual.", "It is not a deduction from income; it reduces income-tax payable."], "table_data": null, "spoken": true, "t0": 7.044, "t1": 17.628, "voice_sync_text": "Section 87A rebate resident individual-നാണ്. ഇത് വരുമാനത്തിൽ നിന്നുള്ള deduction അല്ല; അടയ്ക്കേണ്ട income tax കുറയ്ക്കുന്ന rebate ആണ്.", "icon": "check", "highlights": []}, {"id": "q5-beat-2-0", "title": "Old-regime income condition", "number": "1.1.2", "badge": "Rule", "body": ["Total income must not exceed ₹5,00,000.", "Check this threshold after computing total income under the Act."], "table_data": null, "spoken": true, "t0": 19.128, "t1": 28.968, "voice_sync_text": "Old regime-ൽ total income ₹5,00,000 കവിയരുത്. നിയമപ്രകാരം total income കണക്കാക്കിയ ശേഷമാണ് ഈ പരിധി പരിശോധിക്കേണ്ടത്.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q5-branch-2", "branch_title": "Rebate amount", "number": "1.2", "badge": "Rebate amount", "icon": "scales", "t0": 30.468, "t1": 55.128, "points": [{"id": "q5-beat-3-0", "title": "Maximum rebate", "number": "1.2.1", "badge": "Rule", "body": ["Rebate is 100% of income-tax payable, subject to a ₹12,500 cap.", "The rebate cannot exceed the tax payable."], "table_data": null, "spoken": true, "t0": 30.468, "t1": 41.364, "voice_sync_text": "Income tax-ന്റെ 100% വരെ rebate ലഭിക്കാം; പരമാവധി പരിധി ₹12,500 ആണ്. Rebate, അടയ്ക്കേണ്ട tax-നെ കവിയില്ല.", "icon": "check", "highlights": []}, {"id": "q5-beat-4-0", "title": "Practical formula", "number": "1.2.2", "badge": "Rule", "body": ["Rebate = lower of income-tax payable or ₹12,500.", "Cess is computed after reducing the rebate."], "table_data": null, "spoken": true, "t0": 42.864, "t1": 55.128, "voice_sync_text": "Rebate കണക്കാക്കാനുള്ള ലളിതമായ രീതി: income tax payable-ഉം ₹12,500-ഉം തമ്മിലുള്ള കുറഞ്ഞ തുക. Rebate കുറച്ച ശേഷമാണ് cess കണക്കാക്കുന്നത്.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q5-branch-3", "branch_title": "Relationship to slab tax", "number": "1.3", "badge": "Relationship to slab tax", "icon": "scales", "t0": 56.628, "t1": 76.752, "points": [{"id": "q5-beat-5-0", "title": "Compute tax first", "number": "1.3.1", "badge": "Rule", "body": ["Apply the old-regime slab rates to total income.", "Do not treat the rebate as a slab or income exemption."], "table_data": null, "spoken": true, "t0": 56.628, "t1": 66.3, "voice_sync_text": "ആദ്യം total income-ൽ old-regime slab rates പ്രയോഗിച്ച് tax കണക്കാക്കുക. Rebate-നെ slab ആയോ income exemption ആയോ കാണരുത്.", "icon": "check", "highlights": []}, {"id": "q5-beat-6-0", "title": "Apply rebate next", "number": "1.3.2", "badge": "Rule", "body": ["Deduct the eligible rebate from income-tax payable.", "If rebate equals the tax, balance income-tax becomes nil."], "table_data": null, "spoken": true, "t0": 67.8, "t1": 76.752, "voice_sync_text": "ശേഷം അർഹമായ rebate income tax-ൽ നിന്ന് കുറയ്ക്കുക. Rebate tax-നോട് തുല്യമാണെങ്കിൽ ശേഷിക്കുന്ന income tax nil ആകും.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q5-branch-4", "branch_title": "Limits and sequence", "number": "1.4", "badge": "Limits and sequence", "icon": "scales", "t0": 78.252, "t1": 104.112, "points": [{"id": "q5-beat-7-0", "title": "Eligibility boundary", "number": "1.4.1", "badge": "Rule", "body": ["The ₹5 lakh test is a total-income threshold.", "If total income exceeds it, the old-regime rebate is unavailable."], "table_data": null, "spoken": true, "t0": 78.252, "t1": 87.636, "voice_sync_text": "അഞ്ച് ലക്ഷം രൂപയുടെ പരിശോധന total income-നെ അടിസ്ഥാനമാക്കിയാണ്. Total income അതിൽ കൂടുതലായാൽ old-regime rebate ലഭ്യമല്ല.", "icon": "check", "highlights": []}, {"id": "q5-beat-8-0", "title": "Final tax sequence", "number": "1.4.2", "badge": "Rule", "body": ["Slab tax → Section 87A rebate → surcharge, if applicable → 4% cess.", "Follow the assessment-year rules and rounding requirements."], "table_data": null, "spoken": true, "t0": 89.136, "t1": 104.112, "voice_sync_text": "Tax കണക്കാക്കുന്ന ക്രമം: slab tax, Section 87A rebate, ബാധകമായ surcharge, തുടർന്ന് 4% cess. ബന്ധപ്പെട്ട assessment year-ലെ നിയമവും rounding-ഉം പാലിക്കണം.", "icon": "check", "highlights": []}], "flow_summary": []}]}, "q6": {"doctrine": "Section 115BAC: Default-Regime Slabs", "root": {"id": "root", "number": "1", "title": "Section 115BAC: Default-Regime Slabs", "badge": "Section 115BAC(1A)", "t1": 7.152, "voice_sync_text": "ഇന്ന് Section 115BAC default regime-ലെ tax slab നിയമങ്ങൾ മാത്രം പഠിക്കാം."}, "total_duration": 124.632, "branches": [{"branch_id": "q6-branch-1", "branch_title": "Section 115BAC framework", "number": "1.1", "badge": "Section 115BAC framework", "icon": "scales", "t0": 8.652, "t1": 40.368, "points": [{"id": "q6-beat-1-0", "title": "Default regime", "number": "1.1.1", "badge": "Rule", "body": ["Section 115BAC(1A) provides the default regime for specified persons.", "Eligible taxpayers may opt for the old regime subject to the applicable option rules."], "table_data": null, "spoken": true, "t0": 8.652, "t1": 22.668, "voice_sync_text": "Section 115BAC(1A) നിർദ്ദിഷ്ട വിഭാഗങ്ങൾക്ക് default regime നൽകുന്നു. ബാധകമായ option വ്യവസ്ഥകൾ പാലിച്ച് അർഹരായവർക്ക് old regime തിരഞ്ഞെടുക്കാം.", "icon": "check", "highlights": []}, {"id": "q6-beat-2-0", "title": "Specified taxpayer classes", "number": "1.1.2", "badge": "Rule", "body": ["Individuals, HUFs, AOPs (other than co-operative societies), BOIs and AJPs.", "The section’s conditions and disallowances apply when this regime is chosen."], "table_data": null, "spoken": true, "t0": 24.168, "t1": 40.368, "voice_sync_text": "Individuals, HUF, co-operative society അല്ലാത്ത AOP, BOI, AJP എന്നിവർക്കാണ് വ്യവസ്ഥ ബാധകമാകുന്നത്. ഈ regime തിരഞ്ഞെടുക്കുമ്പോൾ അതിലെ നിബന്ധനകളും deduction നിയന്ത്രണങ്ങളും ബാധകമാണ്.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q6-branch-2", "branch_title": "Slabs: first part", "number": "1.2", "badge": "Slabs: first part", "icon": "scales", "t0": 41.868, "t1": 66.96, "points": [{"id": "q6-beat-3-0", "title": "Nil and 5% slabs", "number": "1.2.1", "badge": "Rule", "body": ["Up to ₹4,00,000: nil.", "₹4,00,001–₹8,00,000: 5%."], "table_data": null, "spoken": true, "t0": 41.868, "t1": 51.036, "voice_sync_text": "നാല് ലക്ഷം രൂപ വരെ tax ഇല്ല. നാല് ലക്ഷം മുതൽ എട്ട് ലക്ഷം വരെയുള്ള slab-ിന് 5% ആണ്.", "icon": "check", "highlights": []}, {"id": "q6-beat-4-0", "title": "10% slab", "number": "1.2.2", "badge": "Rule", "body": ["₹8,00,001–₹12,00,000: 10%.", "Tax is progressive: each rate applies only to its slab portion."], "table_data": null, "spoken": true, "t0": 52.536, "t1": 66.96, "voice_sync_text": "എട്ട് ലക്ഷം മുതൽ പന്ത്രണ്ട് ലക്ഷം വരെയുള്ള slab-ിന് 10% ആണ്. ഓരോ നിരക്കും അതത് slab-ിലെ വരുമാനഭാഗത്തിന് മാത്രം പ്രയോഗിക്കുന്ന progressive രീതിയാണ്.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q6-branch-3", "branch_title": "Slabs: upper part", "number": "1.3", "badge": "Slabs: upper part", "icon": "scales", "t0": 68.46, "t1": 92.784, "points": [{"id": "q6-beat-5-0", "title": "15% and 20% slabs", "number": "1.3.1", "badge": "Rule", "body": ["₹12–16 lakh: 15%; ₹16–20 lakh: 20%.", "Each slab has a fixed tax accumulated from the earlier slabs."], "table_data": null, "spoken": true, "t0": 68.46, "t1": 81.996, "voice_sync_text": "പന്ത്രണ്ട് മുതൽ പതിനാറ് ലക്ഷം വരെ 15%; പതിനാറ് മുതൽ ഇരുപത് ലക്ഷം വരെ 20%. മുൻ slab-ുകളിലെ tax കൂട്ടിച്ചേർത്താണ് തുടർന്നുള്ള tax കണ്ടെത്തുന്നത്.", "icon": "check", "highlights": []}, {"id": "q6-beat-6-0", "title": "25% and 30% slabs", "number": "1.3.2", "badge": "Rule", "body": ["₹20–24 lakh: 25%.", "Above ₹24 lakh: 30%."], "table_data": null, "spoken": true, "t0": 83.496, "t1": 92.784, "voice_sync_text": "ഇരുപത് മുതൽ ഇരുപത്തിനാല് ലക്ഷം വരെ 25% ആണ്. ഇരുപത്തിനാല് ലക്ഷം രൂപയ്ക്ക് മുകളിലുള്ള ഭാഗത്തിന് 30% ആണ്.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q6-branch-4", "branch_title": "Reliefs and regime features", "number": "1.4", "badge": "Reliefs and regime features", "icon": "scales", "t0": 94.284, "t1": 124.632, "points": [{"id": "q6-beat-7-0", "title": "No age-based exemption increase", "number": "1.4.1", "badge": "Rule", "body": ["The basic exemption under this regime does not rise for senior age groups.", "Use the same slab thresholds regardless of age."], "table_data": null, "spoken": true, "t0": 94.284, "t1": 103.14, "voice_sync_text": "ഈ regime-ൽ മുതിർന്ന പ്രായവിഭാഗങ്ങൾക്ക് basic exemption ഉയരുന്നില്ല. പ്രായം നോക്കാതെ ഒരേ slab പരിധികളാണ് ഉപയോഗിക്കുന്നത്.", "icon": "check", "highlights": []}, {"id": "q6-beat-8-0", "title": "Rebate and cess", "number": "1.4.2", "badge": "Rule", "body": ["Eligible resident individuals: Section 87A rebate up to ₹60,000 when total income is within ₹12 lakh.", "Apply 4% cess after eligible rebate; marginal rebate may apply just above the threshold."], "table_data": null, "spoken": true, "t0": 104.64, "t1": 124.632, "voice_sync_text": "Total income ₹12 ലക്ഷം കവിയാത്ത അർഹനായ resident individual-ന് Section 87A പ്രകാരം പരമാവധി ₹60,000 rebate ലഭിക്കും. Rebate-ന് ശേഷം 4% cess ചേർക്കുക; പരിധിക്ക് തൊട്ടുമുകളിലെ വരുമാനത്തിൽ marginal rebate ബാധകമായേക്കാം.", "icon": "check", "highlights": []}], "flow_summary": []}]}, "q7": {"doctrine": "Section 87A Rebate: Default Regime", "root": {"id": "root", "number": "1", "title": "Section 87A Rebate: Default Regime", "badge": "Section 87A · Section 115BAC", "t1": 5.568, "voice_sync_text": "ഇന്ന് default regime-ലെ Section 87A rebate വ്യവസ്ഥ മാത്രം നോക്കാം."}, "total_duration": 104.736, "branches": [{"branch_id": "q7-branch-1", "branch_title": "Eligibility", "number": "1.1", "badge": "Eligibility", "icon": "scales", "t0": 7.068, "t1": 35.736, "points": [{"id": "q7-beat-1-0", "title": "Eligible person", "number": "1.1.1", "badge": "Rule", "body": ["Section 87A rebate is available to a resident individual.", "The default regime’s limit is distinct from the old-regime limit."], "table_data": null, "spoken": true, "t0": 7.068, "t1": 19.788, "voice_sync_text": "Section 87A rebate resident individual-നാണ്. Default regime-ിലെ പരിധി old regime-ിലെ പരിധിയിൽ നിന്ന് വ്യത്യസ്തമാണ്.", "icon": "check", "highlights": []}, {"id": "q7-beat-2-0", "title": "Income threshold", "number": "1.1.2", "badge": "Rule", "body": ["For A.Y. 2026–27, total income must not exceed ₹12,00,000 for the standard rebate.", "Check total income after applying the Act’s computation rules."], "table_data": null, "spoken": true, "t0": 21.288, "t1": 35.736, "voice_sync_text": "2026–27 assessment year-ൽ സാധാരണ rebate ലഭിക്കാൻ total income ₹12,00,000 കവിയരുത്. നിയമപ്രകാരമുള്ള income computation കഴിഞ്ഞാണ് പരിധി പരിശോധിക്കുന്നത്.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q7-branch-2", "branch_title": "Rebate amount", "number": "1.2", "badge": "Rebate amount", "icon": "scales", "t0": 37.236, "t1": 56.064, "points": [{"id": "q7-beat-3-0", "title": "Maximum and cap", "number": "1.2.1", "badge": "Rule", "body": ["Rebate is up to 100% of income-tax payable.", "Maximum rebate under the default regime: ₹60,000."], "table_data": null, "spoken": true, "t0": 37.236, "t1": 46.524, "voice_sync_text": "അടയ്ക്കേണ്ട income tax-ന്റെ 100% വരെ rebate ലഭിക്കും. Default regime-ൽ rebate-ന്റെ പരമാവധി ₹60,000 ആണ്.", "icon": "check", "highlights": []}, {"id": "q7-beat-4-0", "title": "Rebate is tax relief", "number": "1.2.2", "badge": "Rule", "body": ["It reduces tax, not total income.", "It cannot exceed the eligible income-tax payable."], "table_data": null, "spoken": true, "t0": 48.024, "t1": 56.064, "voice_sync_text": "ഇത് total income കുറയ്ക്കുന്നതല്ല, tax കുറയ്ക്കുന്നതാണ്. അർഹമായ income tax-നെക്കാൾ rebate കൂടുതലാകില്ല.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q7-branch-3", "branch_title": "Calculation order", "number": "1.3", "badge": "Calculation order", "icon": "scales", "t0": 57.564, "t1": 78.792, "points": [{"id": "q7-beat-5-0", "title": "Compute slab tax", "number": "1.3.1", "badge": "Rule", "body": ["Apply Section 115BAC slab rates progressively.", "Determine income-tax before rebate."], "table_data": null, "spoken": true, "t0": 57.564, "t1": 67.236, "voice_sync_text": "Section 115BAC slab നിരക്കുകൾ progressive ആയി പ്രയോഗിച്ച് ആദ്യം rebate-നു മുമ്പുള്ള income tax കണക്കാക്കുക.", "icon": "check", "highlights": []}, {"id": "q7-beat-6-0", "title": "Deduct the rebate", "number": "1.3.2", "badge": "Rule", "body": ["Where eligible, reduce tax by the lower of tax payable or ₹60,000.", "Then compute cess on the remaining tax."], "table_data": null, "spoken": true, "t0": 68.736, "t1": 78.792, "voice_sync_text": "അർഹതയുണ്ടെങ്കിൽ tax payable-ഉം ₹60,000-ഉം തമ്മിലുള്ള കുറഞ്ഞ തുക കുറയ്ക്കുക. ശേഷിക്കുന്ന tax-ലാണ് cess കണക്കാക്കുന്നത്.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q7-branch-4", "branch_title": "Boundary and conditions", "number": "1.4", "badge": "Boundary and conditions", "icon": "scales", "t0": 80.292, "t1": 104.736, "points": [{"id": "q7-beat-7-0", "title": "Income above ₹12 lakh", "number": "1.4.1", "badge": "Rule", "body": ["The standard full-threshold rebate is not available above ₹12 lakh.", "Marginal rebate may limit the tax increase immediately above the threshold."], "table_data": null, "spoken": true, "t0": 80.292, "t1": 90.684, "voice_sync_text": "Income ₹12 ലക്ഷം കവിയുമ്പോൾ സാധാരണ threshold rebate ലഭ്യമല്ല. പരിധിക്ക് തൊട്ടുമുകളിലെ tax വർധന marginal rebate വഴി നിയന്ത്രിക്കാം.", "icon": "check", "highlights": []}, {"id": "q7-beat-8-0", "title": "Cess and special income", "number": "1.4.2", "badge": "Rule", "body": ["Health and Education Cess is 4% after rebate.", "Special-rate income may have separate rebate restrictions; check the applicable law."], "table_data": null, "spoken": true, "t0": 92.184, "t1": 104.736, "voice_sync_text": "Rebate കഴിഞ്ഞ് Health and Education Cess 4% കണക്കാക്കുക. Special-rate income-ന് rebate സംബന്ധിച്ച പ്രത്യേക നിയന്ത്രണങ്ങളുണ്ടാകാം; ബാധകമായ നിയമം പരിശോധിക്കണം.", "icon": "check", "highlights": []}], "flow_summary": []}]}, "q8": {"doctrine": "Section 87A Marginal Rebate", "root": {"id": "root", "number": "1", "title": "Section 87A Marginal Rebate", "badge": "Section 87A · Section 115BAC", "t1": 5.736, "voice_sync_text": "ഇന്ന് Section 87A പ്രകാരമുള്ള marginal rebate വ്യവസ്ഥ മാത്രം പഠിക്കാം."}, "total_duration": 103.104, "branches": [{"branch_id": "q8-branch-1", "branch_title": "Threshold and purpose", "number": "1.1", "badge": "Threshold and purpose", "icon": "scales", "t0": 7.236, "t1": 32.424, "points": [{"id": "q8-beat-1-0", "title": "Threshold rule", "number": "1.1.1", "badge": "Rule", "body": ["Standard Section 87A rebate is available up to total income of ₹12 lakh.", "A limited marginal rebate can apply when total income is slightly above ₹12 lakh."], "table_data": null, "spoken": true, "t0": 7.236, "t1": 18.924, "voice_sync_text": "Section 87A-യുടെ സാധാരണ rebate total income ₹12 ലക്ഷം വരെ ലഭ്യമാണ്. അതിന് തൊട്ടുമുകളിലെ income-ൽ പരിമിതമായ marginal rebate ലഭിക്കാം.", "icon": "check", "highlights": []}, {"id": "q8-beat-2-0", "title": "Purpose of marginal rebate", "number": "1.1.2", "badge": "Rule", "body": ["It prevents the tax increase from exceeding the income increase over ₹12 lakh.", "The comparison is made before cess."], "table_data": null, "spoken": true, "t0": 20.424, "t1": 32.424, "voice_sync_text": "₹12 ലക്ഷം threshold കടന്നതുകൊണ്ട് tax വർധന, അധിക വരുമാനത്തെക്കാൾ കൂടുതലാകാതിരിക്കാൻ marginal rebate സഹായിക്കുന്നു. ഈ താരതമ്യം cess-നു മുമ്പാണ്.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q8-branch-2", "branch_title": "Compute tax first", "number": "1.2", "badge": "Compute tax first", "icon": "scales", "t0": 33.924, "t1": 54.336, "points": [{"id": "q8-beat-3-0", "title": "Progressive slab calculation", "number": "1.2.1", "badge": "Rule", "body": ["Apply the Section 115BAC slabs to total income.", "Find income-tax before Section 87A rebate and cess."], "table_data": null, "spoken": true, "t0": 33.924, "t1": 44.844, "voice_sync_text": "Total income-ൽ Section 115BAC slabs പ്രയോഗിക്കുക. Section 87A rebate-നും cess-നും മുമ്പുള്ള income tax കണ്ടെത്തുക.", "icon": "check", "highlights": []}, {"id": "q8-beat-4-0", "title": "Find excess income", "number": "1.2.2", "badge": "Rule", "body": ["Excess = total income − ₹12,00,000.", "This excess sets the marginal tax ceiling before cess."], "table_data": null, "spoken": true, "t0": 46.344, "t1": 54.336, "voice_sync_text": "അധിക വരുമാനം = total income − ₹12,00,000. Cess-നു മുമ്പുള്ള tax-ന്റെ പരിധി ഈ അധിക തുകയാണ്.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q8-branch-3", "branch_title": "Marginal rebate formula", "number": "1.3", "badge": "Marginal rebate formula", "icon": "scales", "t0": 55.836, "t1": 79.704, "points": [{"id": "q8-beat-5-0", "title": "Compare tax with excess", "number": "1.3.1", "badge": "Rule", "body": ["If tax before rebate exceeds the excess income, marginal relief is relevant.", "Marginal rebate = tax before rebate − excess income, limited by statutory rebate rules."], "table_data": null, "spoken": true, "t0": 55.836, "t1": 69.324, "voice_sync_text": "Rebate-നു മുമ്പുള്ള tax, അധിക വരുമാനത്തെക്കാൾ കൂടുതലാണെങ്കിൽ marginal relief പ്രസക്തമാണ്. നിയമത്തിലെ പരിധിക്ക് വിധേയമായി marginal rebate = tax before rebate − അധിക വരുമാനം.", "icon": "check", "highlights": []}, {"id": "q8-beat-6-0", "title": "Cap tax before cess", "number": "1.3.2", "badge": "Rule", "body": ["Tax after rebate is restricted so it does not exceed income above ₹12 lakh.", "Do not include cess in this comparison."], "table_data": null, "spoken": true, "t0": 70.824, "t1": 79.704, "voice_sync_text": "Rebate ശേഷമുള്ള tax, ₹12 ലക്ഷത്തിന് മുകളിലുള്ള വരുമാനത്തെ കവിയരുത്. ഈ താരതമ്യത്തിൽ cess ഉൾപ്പെടുത്തരുത്.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q8-branch-4", "branch_title": "Finish computation", "number": "1.4", "badge": "Finish computation", "icon": "scales", "t0": 81.204, "t1": 103.104, "points": [{"id": "q8-beat-7-0", "title": "Apply cess afterward", "number": "1.4.1", "badge": "Rule", "body": ["After rebate, add Health and Education Cess at 4%.", "Cess is calculated on the tax remaining after relief."], "table_data": null, "spoken": true, "t0": 81.204, "t1": 90.132, "voice_sync_text": "Rebate കുറച്ചശേഷം 4% Health and Education Cess ചേർക്കുക. Relief ശേഷമുള്ള tax-ലാണ് cess കണക്കാക്കേണ്ടത്.", "icon": "check", "highlights": []}, {"id": "q8-beat-8-0", "title": "Use the right eligibility rules", "number": "1.4.2", "badge": "Rule", "body": ["Confirm residency, total-income threshold and nature of income.", "Special-rate income can carry separate rebate restrictions."], "table_data": null, "spoken": true, "t0": 91.632, "t1": 103.104, "voice_sync_text": "Residency, total-income threshold, വരുമാനത്തിന്റെ സ്വഭാവം എന്നിവ ഉറപ്പാക്കണം. Special-rate income-ന് rebate സംബന്ധിച്ച വേറിട്ട നിയന്ത്രണങ്ങൾ ഉണ്ടാകാം.", "icon": "check", "highlights": []}], "flow_summary": []}]}, "q9": {"doctrine": "Company Surcharge Relief above ₹1 Crore", "root": {"id": "root", "number": "1", "title": "Company Surcharge Relief above ₹1 Crore", "badge": "Finance Act · Domestic Company Rates", "t1": 7.68, "voice_sync_text": "ഇന്ന് domestic company-കൾക്ക് ഒരു കോടി രൂപ threshold-ൽ ബാധകമായ surcharge relief മാത്രം നോക്കാം."}, "total_duration": 143.352, "branches": [{"branch_id": "q9-branch-1", "branch_title": "Company tax framework", "number": "1.1", "badge": "Company tax framework", "icon": "scales", "t0": 9.18, "t1": 41.616, "points": [{"id": "q9-beat-1-0", "title": "Normal domestic-company rate", "number": "1.1.1", "badge": "Rule", "body": ["Domestic companies use the rate prescribed by the relevant Finance Act.", "The regular rate is generally 30%; specified turnover-based eligibility can provide 25%."], "table_data": null, "spoken": true, "t0": 9.18, "t1": 22.572, "voice_sync_text": "Domestic company-കൾക്ക് അതത് Finance Act നിശ്ചയിക്കുന്ന നിരക്കാണ് ബാധകം. സാധാരണ നിരക്ക് 30%; നിശ്ചിത turnover വ്യവസ്ഥ പാലിച്ചാൽ 25% നിരക്ക് ലഭിക്കാം.", "icon": "check", "highlights": []}, {"id": "q9-beat-2-0", "title": "Concessional regimes", "number": "1.1.2", "badge": "Rule", "body": ["Sections 115BA, 115BAA and 115BAB provide separate tax options.", "Eligibility, conditions, surcharge and deduction restrictions differ by option."], "table_data": null, "spoken": true, "t0": 24.072, "t1": 41.616, "voice_sync_text": "Sections 115BA, 115BAA, 115BAB എന്നിവ വേറിട്ട tax options നൽകുന്നു. Option അനുസരിച്ച് അർഹത, നിബന്ധന, surcharge, deduction നിയന്ത്രണം എന്നിവ മാറും.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q9-branch-2", "branch_title": "Surcharge", "number": "1.2", "badge": "Surcharge", "icon": "scales", "t0": 43.116, "t1": 76.512, "points": [{"id": "q9-beat-3-0", "title": "Surcharge thresholds", "number": "1.2.1", "badge": "Rule", "body": ["For a regular domestic company: 7% where income exceeds ₹1 crore up to ₹10 crore.", "12% applies where income exceeds ₹10 crore; surcharge is on income-tax."], "table_data": null, "spoken": true, "t0": 43.116, "t1": 58.932, "voice_sync_text": "സാധാരണ domestic company-ക്ക് income ഒരു കോടി കവിയുകയും പത്ത് കോടി വരെ ആയിരിക്കുകയും ചെയ്താൽ 7% surcharge. പത്ത് കോടി കവിയുമ്പോൾ 12%; surcharge income tax-ലാണ് കണക്കാക്കുന്നത്.", "icon": "check", "highlights": []}, {"id": "q9-beat-4-0", "title": "Cess", "number": "1.2.2", "badge": "Rule", "body": ["Health and Education Cess is 4% of income-tax plus surcharge.", "Add cess after determining any applicable marginal relief."], "table_data": null, "spoken": true, "t0": 60.432, "t1": 76.512, "voice_sync_text": "Income tax-ും surcharge-ും ചേർന്ന തുകയ്ക്ക് 4% Health and Education Cess ബാധകമാണ്. Marginal relief ഉണ്ടെങ്കിൽ അത് കണക്കാക്കിയ ശേഷമാണ് cess ചേർക്കുന്നത്.", "icon": "check", "highlights": []}], "flow_summary": []}, {"branch_id": "q9-branch-3", "branch_title": "Marginal relief above ₹1 crore", "number": "1.3", "badge": "Marginal relief above ₹1 crore", "icon": "scales", "t function buildModelFromPipeline(data) {
  const chaptersSource = (data?.catalog?.chapters && data.catalog.chapters.length >= 25)
    ? data.catalog.chapters
    : DEFAULT_DT_CHAPTERS;

  const dtChapters = chaptersSource.map(c => {
    const pr = c.page_range || (c.chapter_number + ".1 - " + c.chapter_number + ".20");
    const parts = pr.includes("-") ? pr.split("-") : [pr, pr];
    return [c.chapter_number, c.title, parts[0].trim(), parts[1].trim()];
  });

  const realQna = (data?.questions || []).map(q => {
    const chNum = parseInt(q.chapter_number) || 1;
    const qNum = parseInt(q.question_number) || 1;
    const subCode = (q.subject || "dt").toLowerCase();
    const p = (data?.provisions || []).find(x => 
      (x.chapter_number ? x.chapter_number === chNum : true) && 
      (x.question_number === qNum || (q.topic_id && x.topic_id === q.topic_id))
    );
    const topicId = q.topic_id || p?.topic_id || ("T_CH" + chNum + "_Q" + qNum);
    return {
      id: `${subCode}-${chNum}-${qNum}`,
      sub: subCode,
      ch: chNum,
      n: qNum,
      title: q.question_title,
      topic: topicId,
      secs: (p?.statutory_sections && p.statutory_sections.length) ? p.statutory_sections : (q.secs || ["Income Tax Act"]),
      question_text: q.question_text,
      q: [q.question_text],
      rawAnswer: q.answer_text
    };
  });

  const provMap = {};
  (data?.provisions || []).forEach(p => {
    const chNum = parseInt(p.chapter_number) || 1;
    const qNum = parseInt(p.question_number) || 1;
    const tid = p.topic_id || ("T_CH" + chNum + "_Q" + qNum);
    if (!provMap[tid]) {
      provMap[tid] = {
        doctrine: p.topic_title || p.core_principle || ("Topic " + tid),
        principle: p.core_principle || p.topic_title || "",
        secs: p.statutory_sections || [],
        rawMarkdown: p.provision_presentation_markdown || "",
        dur: p.dur || p.duration_seconds || 60,
        voice: p.voice_engine || "Gemini Voice (Aoede)",
        file: p.audio_file || (chNum > 1 ? `ch${chNum}_q${qNum}.mp3` : `q${qNum}.mp3`),
        video: p.video_file || (chNum > 1 ? `ch${chNum}_q${qNum}.mp4` : `q${qNum}.mp4`),
        ml: p.malayalam_audio_script || "",
        drive_file_id: p.drive_file_id || null,
        chapter_number: chNum,
        question_number: qNum
      };
    }
  });

  // Keep the readable provision and its presentation-only summary as separate
  // layers. Mind maps are the curated, point-sized summary used by the
  // presentation; they must never be substituted into the provision section.
  const sourceMindmaps = data?.mindmaps || {};
  const presentationSummaries = {};
  Object.entries(sourceMindmaps.question_to_mindmap || {}).forEach(([questionNumber, mindmapKey]) => {
    const summary = sourceMindmaps[mindmapKey];
    if (summary) presentationSummaries['q' + questionNumber] = summary;
  });
  // Also index direct mindmap objects (keyed by chX_qY, topicSlug, or qX)
  Object.entries(sourceMindmaps).forEach(([k, v]) => {
    if (v && typeof v === 'object' && (v.root || v.branches)) {
      presentationSummaries[k] = v;
    }
  });

  return {
    catalog: {
      dt: { name: "Direct Tax", code: "DT", chapters: dtChapters },
      idt: { name: "Indirect Tax", code: "IDT", chapters: [] }
    },
    qna: realQna,
    prov: provMap,
    storyboards: data?.storyboards || {},
    mindmaps: sourceMindmaps,
    presentationSummaries
  };
}

window.handleGoogleSheetData = function(json) {
  try {
    const rows = json.table && json.table.rows;
    if (!rows || rows.length <= 1) return;

    const liveQuestions = [];
    const liveProvisions = [];
    const liveMindmaps = {};
    const seenTopics = {};

    const chapterTitles = {};
    DEFAULT_DT_CHAPTERS.forEach(c => { chapterTitles[c.chapter_number] = c.title; });

    for (let i = 0; i < rows.length; i++) {
      const c = rows[i].c;
      if (!c) continue;
      const val = (idx) => (c[idx] && c[idx].v !== null && c[idx].v !== undefined) ? String(c[idx].v) : "";
      if (val(0).trim().toLowerCase() === "subject" || val(2).trim().toLowerCase().includes("question")) continue;
      
      const subject = val(0) || "DT";
      const chapterStr = val(1) || "1";
      const chNum = parseInt(chapterStr.replace(/\D/g, "")) || 1;
      const qNoStr = val(2) || ("Q" + i);
      const qNum = parseInt(qNoStr.replace(/\D/g, "")) || i;
      
      // Col 3: Canonical Topic (Deduplication / Grouping)
      const canonicalTopic = val(3) || ("Topic Ch" + chNum + " Q" + qNum);
      const topicSlug = "T_" + canonicalTopic.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
      
      const qText = val(4) || "";
      const ansText = val(5) || "";
      const provMd = val(6) || "";
      const provSummary = val(7) || "";
      const driveAudioId = val(8) || "";
      const timingsStr = val(9) || "";

      // Dynamically extract statutory sections from topic and markdown
      let qSecs = [];
      const secMatches = (canonicalTopic + " " + provMd).match(/Section\s+[0-9]+[A-Z]*(?:\([0-9a-zA-Z]+\))?/gi);
      if (secMatches) {
        qSecs = [...new Set(secMatches.map(s => s.trim()))].slice(0, 3);
      }
      if (!qSecs.length) qSecs = ["Income Tax Act"];

      const chTitle = chapterTitles[chNum] || ("Chapter " + chNum);

      liveQuestions.push({
        subject: subject.toLowerCase(),
        chapter_number: chNum,
        chapter_title: chTitle,
        question_number: qNum,
        question_title: canonicalTopic,
        question_text: qText,
        answer_text: ansText,
        topic_id: topicSlug,
        secs: qSecs
      });

      let mmObj = null;
      try {
        if (provSummary && provSummary.startsWith("{")) {
          mmObj = JSON.parse(provSummary);
          liveMindmaps["ch" + chNum + "_q" + qNum] = mmObj;
          if (chNum === 1) liveMindmaps["q" + qNum] = mmObj;
          if (!liveMindmaps[topicSlug]) liveMindmaps[topicSlug] = mmObj;
        }
      } catch(err) {}

      const provItem = {
        subject: subject.toLowerCase(),
        chapter_number: chNum,
        question_number: qNum,
        topic_id: topicSlug,
        topic_title: canonicalTopic,
        statutory_sections: qSecs,
        core_principle: canonicalTopic,
        provision_presentation_markdown: provMd,
        voice: "Gemini Voice (Aoede)",
        audio_file: chNum > 1 ? `ch${chNum}_q${qNum}.mp3` : `q${qNum}.mp3`,
        drive_file_id: driveAudioId || null,
        dur: mmObj ? (mmObj.total_duration || 75) : 75
      };

      if (!seenTopics[topicSlug]) {
        seenTopics[topicSlug] = true;
        liveProvisions.push(provItem);
      } else {
        liveProvisions.push(provItem);
      }
    }

    if (liveQuestions.length > 0) {
      console.log("☁️ Successfully loaded", liveQuestions.length, "questions from Google Sheet live!");
      
      const updatedPipeline = {
        catalog: { chapters: DEFAULT_DT_CHAPTERS },
        questions: liveQuestions,
        provisions: liveProvisions,
        mindmaps: Object.assign({}, window.D ? window.D.mindmaps : {}, liveMindmaps)
      };
      
      window.D = buildModelFromPipeline(updatedPipeline);
      D = window.D;
      if (typeof render === "function") render();
    }
  } catch(err) {
    console.error("Error processing Google Sheet data:", err);
  }
};

function safeKatexRender(tex, displayMode = false){
  if(!window.katex) return tex;
  let safe = tex.trim().replace(/\\text\{([^}]+)\}/g, (m, inner) => `\\text{${inner.replace(/&/g, '\\&').replace(/%/g, '\\%')}}`);
  safe = safe.replace(/(?<!\\)%/g, '\\%');
  try {
    const res = katex.renderToString(safe, { displayMode, throwOnError: false });
    if(res.includes("katex-error")){
      const plain = tex.replace(/\\text\{([^}]+)\}/g, '$1')
                       .replace(/\\le/g, '≤').replace(/\\ge/g, '≥')
                       .replace(/\\times/g, '×').replace(/\\pm/g, '±')
                       .replace(/[\$\\]/g, '');
      return `<span class="math-plain">${plain}</span>`;
    }
    return res;
  } catch(e) {
    const plain = tex.replace(/\\text\{([^}]+)\}/g, '$1')
                     .replace(/\\le/g, '≤').replace(/\\ge/g, '≥')
                     .replace(/\\times/g, '×').replace(/\\pm/g, '±')
                     .replace(/[\$\\]/g, '');
    return `<span class="math-plain">${plain}</span>`;
  }
}

function processMarkdownCallouts(md){
  if(!md) return "";
  // 1. Globally convert Unicode box-drawing tree characters (├──, └──, │) and ASCII pseudo-diagrams (|------, |--->) into clean markdown bullet items
  let cleanMd = md.replace(/[ \t]*[\u2500-\u257F]+[ \t\u2500-\u257F\-—>]*/g, '\n- ')
                  .replace(/[ \t]*\|[-—>]{2,}[ \t]*/g, '\n- ')
                  .replace(/^- ([A-Za-z0-9\s]{2,30})\s*:\s*/gm, '- **$1:** ');

  // 2. Process GitHub alert callouts: > [!NOTE], > [!TIP], > [!IMPORTANT], > [!WARNING], > [!CAUTION]
  let out = cleanMd.replace(/(?:^|\n)(?:>\s*)?\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\](?:\s*:\s*|\s+)?([^\n]+(?:\n(?:>\s*)?[^\n]+)*)/gim, (m, type, body) => {
    type = type.toUpperCase();
    const icons = {
      NOTE: 'ℹ️',
      TIP: '💡',
      IMPORTANT: '📌',
      WARNING: '⚠️',
      CAUTION: '🛑'
    };
    const labels = {
      NOTE: 'Statutory Note',
      TIP: 'Key Exam Takeaway',
      IMPORTANT: 'Important Statutory Requirement',
      WARNING: 'Crucial Sequence & Compliance Warning',
      CAUTION: 'Caution & Disallowance Risk'
    };
    const icon = icons[type] || 'ℹ️';
    const label = labels[type] || type;

    // Split lines, remove leading '>' and ASCII / Unicode box drawing characters
    let lines = body.split('\n').map(l => l.replace(/^>\s?/, '').replace(/[ \t]*[\u2500-\u257F]+[ \t\u2500-\u257F\-—>]*/g, '\n- ').replace(/[ \t]*\|[-—>]{2,}[ \t]*/g, '\n- ').trim()).filter(Boolean);
    let fullText = lines.join('\n').replace(/^- ([A-Za-z0-9\s]{2,30})\s*:\s*/gm, '- **$1:** ');

    // Extract clean subtitle if present (e.g. "**Difference in Section 87A between Regimes**" or "Status Requirement: ...")
    let subtitle = '';
    const firstLine = lines[0] || '';
    if (firstLine.includes(':') && firstLine.indexOf(':') < 55) {
      const cIdx = firstLine.indexOf(':');
      subtitle = firstLine.substring(0, cIdx).replace(/[\*\_]+/g, '').trim();
      lines[0] = firstLine.substring(cIdx + 1).trim();
      fullText = lines.filter(Boolean).join('\n');
    } else if (firstLine.length < 65 && lines.length > 1 && !firstLine.startsWith('-') && !firstLine.startsWith('*')) {
      subtitle = firstLine.replace(/[\*\_]+/g, '').trim();
      fullText = lines.slice(1).join('\n');
    }

    // Clean stray unclosed asterisks in subtitle and fullText
    subtitle = subtitle.replace(/[\*\_]+/g, '').trim();
    fullText = fullText.replace(/^\s*\*\*\s*-\s*/gm, '- ');
    fullText = fullText.replace(/(^|\n)\s*\*\*\s*([A-Za-z])/g, '$1$2');

    // Keep inline numbered statutory headings as separate paragraphs. Source
    // material sometimes stores several rules on one line (for example,
    // "...cess. 2. Age determination rule: ..."), which Markdown otherwise
    // displays as one run-on paragraph.
    fullText = fullText.replace(/([^\n])\s+(\d{1,2})[.)]\s+(?=(?:\*\*)?[A-Z][^\n:]{2,90}:)/g, '$1\n\n$2. ');

    // Preserve intentional source line breaks and paragraph spacing in the
    // provision and its callouts instead of collapsing soft breaks into spaces.
    let parsedBody = marked.parse(fullText.trim(), { breaks: true });

    return `\n\n<div class="callout-alert alert-${type.toLowerCase()}">
      <div class="callout-head">
        <span class="callout-icon">${icon}</span>
        <span class="callout-title">${label}${subtitle ? `: <b>${subtitle}</b>` : ''}</span>
      </div>
      <div class="callout-body">${parsedBody}</div>
    </div>\n\n`;
  });

  // 3. Preprocess Math before marked
  if(window.katex){
    out = out.replace(/\$\$([\s\S]+?)\$\$/g, (m, tex) => safeKatexRender(tex, true));
    out = out.replace(/\$([^\$\n]+?)\$/g, (m, tex) => safeKatexRender(tex, false));
  }

  // 4. Clean up any unwrapped LaTeX like \text{Net Tax} + \text{Health & Education Cess @ 4%}
  out = out.replace(/\\text\{([^}]+)\}/g, (m, inner) => `<strong>${inner.replace(/\\&/g, '&')}</strong>`);
  out = out.replace(/\\le\b/g, '≤').replace(/\\ge\b/g, '≥');

  return out;
}

function renderProvMarkdown(rawMd, doctrine){
 if(!rawMd) return "";

  cleaned = lines.join("\n");
 }
 // Split inline numbered provision headings into distinct paragraphs, even

 cleaned = cleaned.replace(/([^\n])\s+(\d{1,2})[.)]\s+(?=(?:\*\*)?[A-Z][^\n:]{2,90}:)/g, '$1\n\n$2. ');
 cleaned = processMarkdownCallouts(cleaned);

function renderQuestionMarkdown(rawQuestion){
 if(!rawQuestion) return "";
 if (Array.isArray(rawQuestion)) rawQuestion = rawQuestion.join("\n\n");
 let text = rawQuestion.trim();
 // 1. Strip Question X prefix
 text = text.replace(/^\s*Question\s+\d+[:\.\s\-]*\n?/i, "").trim();
 // 2. Clean font glyph corruptions
 text = text.replace(/\b55\s*\(P\)\s*Ltd\./g, "SS(P) Ltd.");
 text = text.replace(/(?:[%¢=t~]|[\uFFFD\u00A2\u20AC])\s*(?=\d)/g, "₹ ");
 text = text.replace(/\b8\s+(?=\d{1,3}(?:,\d{2,3})+)/g, "₹ ");
 text = text.replace(/[\uFFFD\u201C\u201D\u2018\u2019]/g, '"');
 // 3. Format sub-questions (i), (ii), etc.
 text = text.replace(/(?:^|\n)\s*\(([ivxIVX]+|\d+|[a-zA-Z])\)\s*/g, "\n\n- **($1)** ");
 // 4. Collapse any blank lines between table rows so markdown renders valid table
 while (/(\|[^\n]+\|)\s*\n\s*\n\s*(?=\|[^\n]+\|)/.test(text)) {
  text = text.replace(/(\|[^\n]+\|)\s*\n\s*\n\s*(?=\|[^\n]+\|)/g, "$1\n");
 }
 // 5. Parse markdown
 let html = marked.parse(text);
 html = html.replace(/<table>/g, '<div class="tbl-wrap"><table>').replace(/<\/table>/g, '</table></div>');
 return html;
}

  // Check specific chapter-question key first (e.g. ch2_q1)
  if (summaries[chKey]) return summaries[chKey];
  if (maps[chKey]) return maps[chKey];

  // Check topic slug
  if (topicId && summaries[topicId]) return summaries[topicId];
  if (topicId && maps[topicId]) return maps[topicId];

  // Check legacy 'q' + qn for Chapter 1
  if (ch === '1' || !ch) {
    if (summaries['q' + qn]) return summaries['q' + qn];
    const mmKey = (maps.question_to_mindmap && maps.question_to_mindmap[qn]) || ('q' + qn);
    if (maps[mmKey]) return maps[mmKey];
  }

  return buildQuestionMindMap(q, p);
}

// Build the same nested presentation model for every question from its timed
// storyboard. Storyboard timings are aligned to the question's Malayalam track.
function buildQuestionMindMap(q, p){
  const qn = String(q && q.n || '');
  const sb = D.storyboards && (D.storyboards['q' + qn] || D.storyboards[p && p.file ? p.file.replace('.mp3', '') : '']);
  const slides = sb && Array.isArray(sb.slides) ? sb.slides : [];
  if(!slides.length) return null;
  const groups = new Map();
  slides.forEach((slide, si) => {
    const t0 = Number(slide.t0 || 0);
    const t1 = Number(slide.t1 || (t0 + Number(slide.duration || 8)));
    const groupKey = slide.block_number != null ? `block-${slide.block_number}` : (slide.section_badge || `section-${si + 1}`);
    if(!groups.has(groupKey)) groups.set(groupKey, {
      branch_id:`q${qn}-branch-${groups.size + 1}`,
      number:`1.${groups.size + 1}`,
      branch_title:slide.block_name || slide.section_badge || `Section ${groups.size + 1}`,
      badge:slide.section_badge || '', icon:'scales', t0, t1, points:[], flow_summary:[]
    });
    const branch = groups.get(groupKey);
    branch.t0 = Math.min(branch.t0, t0);
    branch.t1 = Math.max(branch.t1, t1);
    (slide.cards || []).forEach((card, ci) => {
      const table = card.table;
      const tableData = table && table.headers && table.rows ? {
        title:slide.slide_title || card.title || '', headers:table.headers, rows:table.rows
      } : null;
      const body = (card.bullets || []).map(line => String(line || '').replace(/\*\*/g, '').trim()).filter(Boolean);
      branch.points.push({
        id:`q${qn}-beat-${slide.slide_number || si + 1}-c${ci}`,
        number:card.number || slide.point_number || `1.${groups.size}.${branch.points.length + 1}`,
        title:card.title || slide.slide_title || `Point ${branch.points.length + 1}`,
        badge:card.badge || card.type || '', body, table_data:tableData,
        spoken:true, t0, t1, voice_sync_text:slide.malayalam_narration || '',
        icon:tableData ? 'calculator' : 'check', highlights:card.highlights || []
      });
    });
  });
  const branches = Array.from(groups.values());
  return {
    doctrine:p.doctrine || q.title || `Question ${qn}`,
    root:{ id:'root', title:p.doctrine || q.title || `Question ${qn}`, badge:(p.secs || []).join(' · ') || '§ LAW', t1:slides[0].t1 || 5 },
    total_duration:Number(sb.total_duration || p.dur || 0), branches
  };
}

function highlightKeywords(text, hl){
  if(!text) return "";
  let clean = esc(String(text));

  // Dynamic Keyword Highlights with time attributes
  if (Array.isArray(hl) && hl.length > 0) {
    const validHls = hl.map(item => {
      if (typeof item === "string") return { phrase: item.trim(), time_sec: 0 };
      if (item && typeof item === "object") {
        const phrase = (item.phrase || item.word || "").trim();
        const time_sec = parseFloat(item.time_sec !== undefined ? item.time_sec : (item.time || 0)) || 0;
        return { phrase, time_sec };
      }
      return null;
    }).filter(item => item && item.phrase.length > 0);

    validHls.sort((a, b) => b.phrase.length - a.phrase.length);

    validHls.forEach(({ phrase, time_sec }) => {
      const escPhrase = esc(phrase);
      const regexSafe = escPhrase.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const regex = new RegExp("(?<![<a-zA-Z0-9])(" + regexSafe + ")(?![^<]*>)(?![a-zA-Z0-9])", "gi");
      clean = clean.replace(regex, `<mark class="hl-word hl-pending" data-time="${time_sec}">$1</mark>`);
    });
  }

  // 1. Amounts: ₹ 2,50,000, ₹ 1 Crore, etc.
  clean = clean.replace(/(₹\s*[\d,]+(?:\.\d+)?(?:\s*(?:Lakhs?|Crores?|L|Cr|lacs?))?)(?![^<]*>)/gi, '<span class="chip-amt">$1</span>');
  
  // 2. Percentages: 5%, 20%, 30%, 32.1%, etc.
  clean = clean.replace(/(\b\d+(?:\.\d+)?%)(?![^<]*>)/g, '<span class="chip-rate">$1</span>');
  
  // 3. Statutory Sections: Section 115BAC, u/s 87A, § 4, etc.
  clean = clean.replace(/((?:Section|u\/s|§)\s*[0-9A-Za-z()]+(?:\([0-9A-Za-z]+\))?)(?![^<]*>)/gi, '<span class="chip-sec">$1</span>');

  return clean;
}

function renderCardBodyContent(pt){
  let out = '';
  if (pt.trap_data) {
    out += `

        <div class="mm-trap-row wrong">
          <span class="mm-trap-badge wrong">⚠️ COMMON MISTAKE</span>
          <span class="mm-trap-text">${highlightKeywords(pt.trap_data.mistake, pt.highlights)}</span>
        </div>
        <div class="mm-trap-row correct">
          <span class="mm-trap-badge correct">✓ STATUTORY RULE</span>
          <span class="mm-trap-text">${highlightKeywords(pt.trap_data.statutory_rule, pt.highlights)}</span>
        </div>
      </div>
    `;
  } else if (pt.table_data && pt.table_data.headers && pt.table_data.rows) {
    const headers = pt.table_data.headers || [];
    const columnCount = Math.max(headers.length, 1);
    const columnWidths = columnCount === 2 ? [52, 48] : columnCount === 3 ? [44, 18, 38] : [36, ...Array(columnCount - 2).fill(34 / Math.max(columnCount - 2, 1)), 30];
    out += `
      <div class="mm-table-panel">
        ${pt.table_data.title ? `<div class="mm-table-title">${esc(pt.table_data.title)}</div>` : ''}
        <table class="mm-stat-table" style="--mm-col-count:${columnCount};--mm-table-min-width:${columnCount * 132}px">
          <colgroup>${headers.map((h, hi) => `<col class="${/rate|percentage|percent/i.test(String(h)) ? 'mm-col-compact' : ''}" style="width:${columnWidths[hi] || 100 / columnCount}%">`).join('')}</colgroup>
          <thead>
            <tr>
              ${headers.map((h, hi) => `<th class="${/rate|percentage|percent/i.test(String(h)) ? 'mm-col-compact' : ''} ${hi > 0 ? 'text-right' : 'text-left'}">${esc(h)}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${(pt.table_data.rows || []).map(row => `
              <tr>
                ${(row || []).map((c, ci) => `<td class="${/rate|percentage|percent/i.test(String(headers[ci] || '')) ? 'mm-col-compact' : ''} ${ci > 0 ? 'cell-mono text-right' : 'text-left'}">${highlightKeywords(String(c), pt.highlights)}</td>`).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } else if (pt.example_calc) {
    out += `
      <div class="mm-example-panel">
        <div class="mm-example-head">
          <span class="mm-example-tag">WORKED CALCULATION EXAMPLE</span>
          ${pt.example_calc.title ? `<span class="mm-example-title">${esc(pt.example_calc.title)}</span>` : ''}
        </div>
        ${pt.example_calc.inputs ? `<div class="mm-example-inputs"><b>Assumptions:</b> ${highlightKeywords(pt.example_calc.inputs, pt.highlights)}</div>` : ''}
        <div class="mm-example-steps">
          ${(pt.example_calc.steps || []).map(st => `<div class="mm-example-step-line"><span class="step-bullet">▸</span><span>${highlightKeywords(st, pt.highlights)}</span></div>`).join('')}
        </div>
      </div>
    `;
  }

  // Bullet points
  const bodyItems = Array.isArray(pt.body) ? pt.body : (pt.body ? [pt.body] : []);
  if (bodyItems.length > 0) {
    bodyItems.forEach(b => {
      out += `
        <div class="mm-card-point-row">
          <span class="mm-card-point-bullet"></span>
          <span class="mm-card-point-text">${highlightKeywords(b, pt.highlights)}</span>
        </div>
      `;
    });
  }

  return out;
}

function makePlayer(p, q){
 const root=$("#player"),playB=$("#play"),seek=$("#seek"),time=$("#time"),spd=$("#speed"),note=$("#anote"),bars=$$("#wave i");

 const prevBtn=$("#vtd-prev") || $("#ppt-prev-btn"),nextBtn=$("#vtd-next") || $("#ppt-next-btn");
 const btnViewMindmap=$("#btn-view-mindmap"),btnViewSlides=$("#btn-view-slides");
 const pptMindmapView=$("#ppt-mindmap-view"),pptSlidesWrapper=$("#ppt-slides-wrapper"),pptNavRail=$("#ppt-nav-rail");

 window.SYNC_LEAD_SEC = (typeof window.SYNC_LEAD_SEC === "number") ? window.SYNC_LEAD_SEC : 0.6;
 const mm = getMindMapForQuestion(q, p);
 const speeds=[0.5,0.75,1,1.25,1.5,2];let si=2,playing=false,vraf=0,mmRaf=0,dead=false;
 const audioFile = p.file || p.audio_file || "q1.mp3";
 // Support streaming directly from Google Drive as well as local fallback
 let audioUrl;
 if (p.drive_file_id) {
  audioUrl = "https://drive.google.com/uc?export=download&id=" + p.drive_file_id;
 } else if (p.audio_url && p.audio_url.startsWith("http")) {
  audioUrl = p.audio_url;
 } else {
  const audioBase = window.location.protocol === "file:"
   ? new URL("../data/audio/" + encodeURIComponent(audioFile.split('/').pop()), window.location.href).href
   : (audioFile.startsWith('/') ? audioFile : "/audio/" + audioFile);
  audioUrl = audioBase + "?v=card_clean_20261110_" + Math.round(p.dur || 1);
 }
 
 // Discrete Point-by-Point Voice Engine
 const discretePlaylist = [];
 if (mm && mm.root && (mm.root.drive_audio_id || mm.root.audio_file || mm.root.pt_idx !== undefined)) {
  discretePlaylist.push({
   pt_idx: mm.root.pt_idx !== undefined ? mm.root.pt_idx : 0,
   id: "root",
   elId: "mm-node-root",
   title: mm.root.title || p.doctrine || "Overview",
   badge: mm.root.badge || "Intro",
   drive_id: mm.root.drive_audio_id,
   audio_file: mm.root.audio_file,
   text: mm.root.voice_sync_text || ""
  });
 }
 if (mm && Array.isArray(mm.branches)) {
  mm.branches.forEach((b) => {
   (b.points || []).forEach((pt) => {
    discretePlaylist.push({
     pt_idx: pt.pt_idx !== undefined ? pt.pt_idx : discretePlaylist.length,
     id: pt.id,
     elId: "mm-card-" + pt.id,
     branchId: b.branch_id,
     title: pt.title,
     badge: pt.badge || b.branch_title,
     drive_id: pt.drive_audio_id,
     audio_file: pt.audio_file,
     text: pt.voice_sync_text || ""
    });
   });
  });
 }
 const isDiscreteMode = (discretePlaylist.length > 1 && discretePlaylist.some(item => item.drive_id || item.audio_file));
 let currentPtIdx = 0;

 function getDiscreteAudioUrls(item){
  if (!item) return [];
  const urls = [];
  const isLocal = (window.location.protocol === "file:");
  
  if (item.audio_file) {
   const fn = item.audio_file.replace(/\\/g, '/').replace(/^\/+/, '');
   if (isLocal) {
    urls.push(new URL("../data/audio/" + fn, window.location.href).href);
    urls.push(new URL("data/audio/" + fn, window.location.href).href);
   } else {
    urls.push("data/audio/" + fn);
    urls.push("/data/audio/" + fn);
    urls.push("../data/audio/" + fn);
   }
  }

  if (item.drive_id && !item.drive_id.startsWith("DRIVE_PT_")) {
   urls.push("https://drive.google.com/uc?export=download&id=" + item.drive_id);
   urls.push("https://docs.google.com/uc?export=open&id=" + item.drive_id);
   urls.push("https://drive.usercontent.google.com/download?id=" + item.drive_id + "&export=download");
  }

  return urls;
 }

 function getDiscreteAudioUrl(item){
  const urls = getDiscreteAudioUrls(item);
  return urls.length > 0 ? urls[0] : null;
 }

 function highlightDiscretePoint(item, isNewBranch = false){
  if (!item) return;

  const rootNode = document.getElementById("mm-node-root");

  if (item.id === "root") {
   if (rootNode) {
    rootNode.classList.remove("status-done", "status-hidden");
    rootNode.classList.add("status-active");
   }
   (mm?.branches || []).forEach(b => {
    const bBlock = document.getElementById("mm-block-" + b.branch_id);
    if (bBlock) bBlock.className = "mm-infographic-block status-hidden";
   });
  } else {
   if (rootNode) {
    rootNode.classList.remove("status-active", "status-hidden");
    rootNode.classList.add("status-done");
   }
   (mm?.branches || []).forEach(b => {
    const bBlock = document.getElementById("mm-block-" + b.branch_id);
    if (!bBlock) return;
    const bIdx = (mm.branches || []).findIndex(x => x.branch_id === b.branch_id);
    const curBIdx = (mm.branches || []).findIndex(x => x.branch_id === item.branchId);
    if (curBIdx !== -1 && bIdx < curBIdx) {
     bBlock.className = "mm-infographic-block status-mastered";
    } else if (b.branch_id === item.branchId) {
     bBlock.className = "mm-infographic-block status-active";
    } else {
     bBlock.className = "mm-infographic-block status-hidden";
    }
   });
  }

  discretePlaylist.forEach((ptItem, idx) => {
   const el = document.getElementById(ptItem.elId);
   const tag = document.getElementById("tag-pt-" + ptItem.id);
   if (!el) return;
   if (idx < currentPtIdx) {
    el.classList.remove("status-hidden", "status-active");
    el.classList.add("status-done");
    if (tag) {
     tag.textContent = "Done";
     tag.className = "mm-card-live-strip tag-done";
    }
    el.querySelectorAll(".hl-word").forEach(m => { m.classList.remove("hl-pending", "hl-active"); m.classList.add("hl-done"); });
   } else if (idx === currentPtIdx && !isNewBranch) {
    el.classList.remove("status-hidden", "status-done");
    el.classList.add("status-active");
    if (tag) {
     tag.textContent = "● EXPLAINING NOW";
     tag.className = "mm-card-live-strip tag-active";
    }
   } else {
    // Current point and future points start hidden at t=0 so Phase 1 zooms out cleanly
    el.classList.remove("status-active", "status-done");
    el.classList.add("status-hidden");
    if (tag) {
     tag.textContent = "";
     tag.className = "mm-card-live-strip";
    }
   }
  });

  // Update SVG connectors for progressive reveal
  function updateDiscreteConnectors(revealCardConnector = false){
   if (typeof updateConnectorPaths === "function" && mm) {
    const dState = {
     branchStates: {},
     pointStates: {},
     cardConnectors: {},
     convergeStates: {},
     flowStates: {}
    };
    (mm.branches || []).forEach(b => {
     let bStatus = "hidden";
     const bIdx = (mm.branches || []).findIndex(x => x.branch_id === b.branch_id);
     const curBIdx = (mm.branches || []).findIndex(x => x.branch_id === item.branchId);
     if (b.branch_id === item.branchId) bStatus = "active";
     else if (curBIdx !== -1 && bIdx < curBIdx) bStatus = "mastered";
     dState.branchStates[b.branch_id] = { status: bStatus, progress: bStatus === "hidden" ? 0 : 1 };

     (b.points || []).forEach(pt => {
      const ptIdxInList = discretePlaylist.findIndex(x => x.id === pt.id);
      let pStatus = "hidden";
      if (ptIdxInList !== -1 && ptIdxInList < currentPtIdx) pStatus = "done";
      else if (ptIdxInList === currentPtIdx) pStatus = revealCardConnector ? "active" : "hidden";
      dState.pointStates[pt.id] = pStatus;
      dState.cardConnectors[pt.id] = {
       status: pStatus === "active" ? "active" : (pStatus === "done" ? "mastered" : "hidden"),
       progress: (pStatus === "active" || pStatus === "done") ? 1 : 0
      };
     });
    });
    try { updateConnectorPaths(dState); } catch(e){}
   }
  }

  // Choreographed Camera & Arrow Sequence (Matching scratch/complex_provision_mindmap_demo.html)
  const stage = document.getElementById("mm-scroll-stage");
  if (stage) {
   window.clearTimeout(stage.__mmDiscreteCamTimer1);
   window.clearTimeout(stage.__mmDiscreteCamTimer2);
  }
  if (item.id === "root") {
   updateDiscreteConnectors(false);
   zoomToMapTarget(null, null, "root");
  } else if (!isNewBranch) {
   // Under same topic heading: smoothly scroll/pan directly to the next content card without zooming out
   updateDiscreteConnectors(true);
   zoomToMapTarget(item.id, null, item.branchId);
  } else {
   // Switching to a NEW topic heading: 3-phase cinematic zoom out -> connect -> zoom in
   // Phase 1 (t = 0ms): ZOOM OUT to branch context framing Root Heading Card and Topic Heading Pill
   // Arrow connects from Root to the Topic Heading Pill
   updateDiscreteConnectors(false);
   showBranchContext(item.branchId);
   if (stage) {
    // Phase 2 (t = 650ms): Camera moves to card context framing Topic Heading and Content Card
    // Arrow extends from Topic Heading to Topic Content Card, card appears
    stage.__mmDiscreteCamTimer1 = setTimeout(() => {
     if (currentPtIdx === discretePlaylist.findIndex(x => x.id === item.id)) {
      const cardEl = document.getElementById(item.elId);
      if (cardEl) {
       cardEl.classList.remove("status-hidden");
       cardEl.classList.add("status-active");
       const cTag = document.getElementById("tag-pt-" + item.id);
       if (cTag) {
        cTag.textContent = "● EXPLAINING NOW";
        cTag.className = "mm-card-live-strip tag-active";
       }
      }
      updateDiscreteConnectors(true);
      showMapContext(item.id, item.branchId);
     }
    }, 650);
    // Phase 3 (t = 1300ms): ZOOM IN directly onto the active Topic Content Card (focus scale ~1.25)
    stage.__mmDiscreteCamTimer2 = setTimeout(() => {
     if (currentPtIdx === discretePlaylist.findIndex(x => x.id === item.id)) {
      zoomToMapTarget(item.id, null, item.branchId);
     }
    }, 1300);
   }
  }

  // Display clean title on controls dock (NEVER display raw identification number)
  const vtdLabel = $("#vtd-label");
  if (vtdLabel) vtdLabel.textContent = item.title;
  if (note) note.textContent = "Playing point: " + item.title;
 }

 function updateDiscreteUI(){
  if (!isDiscreteMode || !discretePlaylist.length) return;
  const totalPts = discretePlaylist.length;

 function finishDiscrete(){
  stop();

  if (rootNode) rootNode.className = "mm-root-card status-mastered";
  (mm?.branches || []).forEach(b => {
   const bBlock = document.getElementById("mm-block-" + b.branch_id);
   if (bBlock) bBlock.className = "mm-infographic-block status-mastered";

  const vtdLabel = $("#vtd-label");

   vtdLabel.innerHTML = `✓ Concept Complete <button id="vtd-replay-btn" class="vtd-pill-btn" style="margin-left:10px;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:3px 10px;cursor:pointer;font-size:0.78rem">↺ Replay</button>`;
   const replayBtn = $("#vtd-replay-btn");
   if (replayBtn) replayBtn.onclick = (e) => { e.stopPropagation(); playPoint(0, true); };
