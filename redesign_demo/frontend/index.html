 function playPoint(targetIdx, startPlaying = true){
  if (!isDiscreteMode || !discretePlaylist.length) return;
  if (targetIdx < 0) targetIdx = 0;
  if (targetIdx >= discretePlaylist.length) {
   finishDiscrete();
   return;
  }
  if (startPlaying && vtheater && !vtheater.classList.contains("open")) {
   openTheater(() => playPoint(targetIdx, true));
   return;
  }
  const prevIdx = currentPtIdx;
  const prevItem = (prevIdx >= 0 && prevIdx < discretePlaylist.length) ? discretePlaylist[prevIdx] : null;
  currentPtIdx = targetIdx;
  const item = discretePlaylist[currentPtIdx];
  const isNewBranch = (!prevItem || prevItem.id === "root" || prevItem.branchId !== item.branchId);
  const candidateUrls = getDiscreteAudioUrls(item);

  audio.pause();
  window.clearTimeout(window.__mmAudioPlayTimer);
  highlightDiscretePoint(item, isNewBranch);
  updateDiscreteUI();
  if (note && note.innerHTML.includes("Audio unavailable")) {
   note.textContent = "Playing point: " + item.title;
  }

  let uIdx = 0;
  function attemptPlayback(){
   window.clearTimeout(window.__mmAudioPlayTimer);
   if (uIdx >= candidateUrls.length) {
    audio.__onFallback = null;
    console.warn("All candidate audio sources exhausted for point:", item);
    playing = false;
    root.classList.remove("playing");
    playB.innerHTML = I.play;
    const curVtdPlay = $("#vtd-play");
    if (curVtdPlay) curVtdPlay.innerHTML = I.play;

    // Display Skip and Retry state on dock and note
    const vtdLabel = $("#vtd-label");
    if (vtdLabel) {
     vtdLabel.innerHTML = `<span>⚠️ Audio unavailable</span> <button id="vtd-skip-btn" style="margin-left:8px;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:3px 10px;cursor:pointer;font-size:0.8rem">Skip ⏭</button> <button id="vtd-retry-btn" style="margin-left:4px;background:rgba(255,255,255,0.15);color:inherit;border:1px solid rgba(255,255,255,0.3);border-radius:12px;padding:3px 8px;cursor:pointer;font-size:0.8rem">Retry ↺</button>`;
     const skipBtn = $("#vtd-skip-btn");
     if (skipBtn) skipBtn.onclick = (e) => { e.stopPropagation(); playPoint(currentPtIdx + 1, true); };
     const retryBtn = $("#vtd-retry-btn");
     if (retryBtn) retryBtn.onclick = (e) => { e.stopPropagation(); playPoint(currentPtIdx, true); };
    }
    if (note) {
     note.innerHTML = `⚠️ Audio unavailable for "${esc(item.title)}". Review the card points, or tap <b>Skip ⏭</b> to continue.`;
    }
    return;
   }
   const nextSrc = candidateUrls[uIdx++];
   audio.__onFallback = attemptPlayback;
   if (audio.src !== nextSrc) {
    audio.src = nextSrc;
    audio.currentTime = 0;
   }
   if (startPlaying) {
    const playDelay = (item.id === "root") ? 50 : 1400;
    window.__mmAudioPlayTimer = setTimeout(() => {
     audio.play().then(() => {
      audio.__onFallback = null;
      playing = true;
      root.classList.add("playing");
      playB.innerHTML = I.pause;
      playB.setAttribute("aria-label", "Pause audio");
      const curVtdPlay = $("#vtd-play");
      if (curVtdPlay) curVtdPlay.innerHTML = I.pause;
      vizOn();
      if (note && note.innerHTML.includes("Audio unavailable")) {
       note.textContent = "Playing point: " + item.title;
      }
      const vtdLabel = $("#vtd-label");
      if (vtdLabel && vtdLabel.innerHTML.includes("Audio unavailable")) {
       vtdLabel.textContent = item.title;
      }
     }).catch(err => {
      console.warn("Audio play failed on source:", nextSrc, err);
      attemptPlayback();
     });
    }, playDelay);
   } else {
    audio.__onFallback = null;
    playing = false;
    root.classList.remove("playing");
    playB.innerHTML = I.play;
    const curVtdPlay = $("#vtd-play");
    if (curVtdPlay) curVtdPlay.innerHTML = I.play;
   }
  }

  attemptPlayback();
 }

 const audio = new Audio();
 audio.preload = "auto";
 audio.src = isDiscreteMode ? (getDiscreteAudioUrl(discretePlaylist[0]) || audioUrl) : audioUrl;
 window.__currAudio = audio;
 window.__ui = ui;

 const total = () => (audio && isFinite(audio.duration) && audio.duration > 0) ? audio.duration : (p.dur || 75);

 function branchRevealTime(mindmap, branch){
  const index=(mindmap?.branches || []).findIndex(item=>item.branch_id===branch.branch_id);
  if(index<=0){
   const firstPoint=branch.points?.[0];
   return Number(mindmap?.root?.t1 || Math.max(0,Number(firstPoint?.t0 || branch.t0 || 0)-1.5));
  }
  const previous=mindmap.branches[index-1];
  return Math.max(Number(previous.t1 || 0),...(previous.flow_summary || []).map(step=>Number(step.t1 || 0)));
 }

 function pointRevealTiming(mindmap, branch, point){
  const pt0=Number(point.t0 || branch.t0 || 0);
  const pointNumber=String(point.number || "");
  const parentPoint=(branch.points || []).filter(candidate=>candidate.id!==point.id
    && pointNumber.startsWith(String(candidate.number || "")+"."))
    .sort((a,b)=>String(b.number || "").length-String(a.number || "").length)[0];
  const parentReadyAt=parentPoint
   ? Number(parentPoint.t1 || pt0)
   : branchRevealTime(mindmap,branch)+0.55;
  const drawT0=Math.max(pt0-0.95,parentReadyAt+0.1);
  const revealT0=Math.min(pt0,Math.max(pt0-0.6,drawT0+0.25));
  return {drawT0,revealT0};
 }

 function getState(mindmap, cur){
  if(!mindmap || !mindmap.branches) return { branchStates: {}, pointStates: {}, flowStates: {}, convergeStates: {}, cardConnectors: {}, activePoint: null, activeFlowStep: null, activeBranch: null, allMastered: false };
  const branchStates = {};
  const pointStates = {};
  const flowStates = {};
  const convergeStates = {};
  const cardConnectors = {};
  let activePoint = null;
  let activeFlowStep = null;
  let activeBranch = null;
  const tot = mindmap.total_duration || total();
  const allMastered = cur >= tot;

  mindmap.branches.forEach((b) => {
    let status = "hidden";
    let progress = 0;
    // Reveal each branch only after the preceding narration ends. Its detail
    // cards are staged later, so the parent is visibly established first.
    const t0 = Math.max(0,branchRevealTime(mindmap,b));
    const t1 = parseFloat(b.t1 || 999);

    if(cur >= t1){
      status = "mastered";
      progress = 1;
    } else if(cur >= t0){
      activeBranch = b;
      const elapsed = cur - t0;
      const DRAW_TIME = 0.55;
      if(elapsed < DRAW_TIME){
        status = "drawing";
        progress = Math.min(1, Math.max(0, elapsed / DRAW_TIME));
      } else {
        status = "active";
        progress = 1;
      }
    } else {
      status = "hidden";
      progress = 0;
    }
    branchStates[b.branch_id] = { status, progress, t0, t1 };

    // Find last spoken beat t1 for reference cards
    const spkPts = (b.points || []).filter(p => p.spoken === true);
    const lastSpkT1 = spkPts.length > 0 ? parseFloat(spkPts[spkPts.length - 1].t1 || b.t1) : b.t1;

    // Points / Cards
    (b.points || []).forEach(pt => {
      if(pt.spoken === true){
        const pt0 = parseFloat(pt.t0 != null ? pt.t0 : t0);
        const pt1 = parseFloat(pt.t1 != null ? pt.t1 : t1);
        let pStatus = "hidden";
        let connProg = 0;
        const connDur = 0.25;
        const {drawT0,revealT0}=pointRevealTiming(mindmap,b,pt);
        const doneT1 = Math.max(revealT0, pt1 - 0.10);

        let connectorStatus="hidden";
        if(cur >= doneT1){
          pStatus = "done";
          connProg = 1;
          connectorStatus="done";
        } else if(cur >= revealT0){
          pStatus = "active";
          activePoint = pt;
          activeBranch = b;
          connProg = Math.min(1, Math.max(0, (cur - drawT0) / connDur));
          connectorStatus="active";
        } else if(cur >= drawT0){
          pStatus = "hidden";
          connProg = Math.min(1, Math.max(0, (cur - drawT0) / connDur));
          connectorStatus="drawing";
        } else {
          pStatus = "hidden";
          connProg = 0;
        }
        pointStates[pt.id] = pStatus;
        cardConnectors[pt.id] = { status: connectorStatus, progress: connProg };
      } else {
        // Reference cards reveal immediately after last spoken beat of that branch
        if(cur >= lastSpkT1){
          pointStates[pt.id] = "reference";
          cardConnectors[pt.id] = { status: "reference", progress: 1 };
        } else {
          pointStates[pt.id] = "hidden";
          cardConnectors[pt.id] = { status: "hidden", progress: 0 };
        }
      }
    });

    // Flow Summary steps
    let anyFlowActive = false;
    let allFlowDone = (b.flow_summary && b.flow_summary.length > 0);
    (b.flow_summary || []).forEach((step, si) => {
      const st0 = parseFloat(step.t0 || 0);
      const st1 = parseFloat(step.t1 || 999);
      let fStatus = "hidden";
      if(cur >= st1){
        fStatus = "done";
      } else if(cur >= st0){
        fStatus = "active";
        anyFlowActive = true;
        activeFlowStep = { branch_id: b.branch_id, step, index: si, t0: st0 };
        activeBranch = b;
        allFlowDone = false;
      } else {
        fStatus = "hidden";
        allFlowDone = false;
      }
      flowStates[b.branch_id + '_' + si] = fStatus;
    });

    // Converging connectors state
    if(allFlowDone || status === "mastered"){
      convergeStates[b.branch_id] = "done";
    } else if(anyFlowActive || (b.flow_summary && b.flow_summary.length > 0 && cur >= parseFloat(b.flow_summary[0].t0 || 0))){
      convergeStates[b.branch_id] = "active";
    } else {
      convergeStates[b.branch_id] = "hidden";
    }
  });

  return { branchStates, pointStates, flowStates, convergeStates, cardConnectors, activePoint, activeFlowStep, activeBranch, allMastered };
 }

 let lastActiveBranchId = null;
 let lastActivePointId = null;
 let lastActiveFlowStepKey = null;
 let userScrolledUntil = 0;

 function scrollToCard(el, smooth = true){
  const stage = document.getElementById("mm-scroll-stage");
  if(!stage || !el) return;
  if(stage.clientWidth < 1 || stage.clientHeight < 1) return;
  const canvas = document.getElementById("mm-canvas-container");
  if(canvas && el.id !== "mm-node-root"){
    const animateBranchChange = stage.classList.contains("mm-branch-transition");
    const preserveFocusPan = stage.classList.contains("mm-point-focused")
      && !stage.classList.contains("mm-camera-overview")
      && stage.dataset.focusedPoint
      && stage.dataset.focusedPoint === (el.dataset.pointId || "");
    if(animateBranchChange) stage.classList.remove("mm-branch-transition");
    stage.classList.add("mm-camera-measuring");
    if(!preserveFocusPan){
      canvas.style.setProperty("--mm-pan-x", "0px");
      canvas.style.setProperty("--mm-pan-y", "0px");
      canvas.style.setProperty("--mm-pan-x", "0px");
    }
    stage.dataset.focusedPoint = el.dataset.pointId || "";
    void el.getBoundingClientRect();
    stage.classList.remove("mm-camera-measuring");
    if(animateBranchChange) stage.classList.add("mm-branch-transition");
  } else if(canvas){
    canvas.style.setProperty("--mm-pan-x", "0px");
    canvas.style.setProperty("--mm-pan-y", "0px");
    stage.dataset.focusedPoint = "";
  }
  const elRect = el.getBoundingClientRect();
  const viewport = mindMapVisibleViewport(stage);
  
  let targetY;
  if(elRect.height > viewport.height){
    targetY = stage.scrollTop + (elRect.top - viewport.top) - 16;
  } else {
    const elCenter = elRect.top + (elRect.height / 2);
    targetY = stage.scrollTop + (elCenter - viewport.centerY);
  }
  const elCenterX = elRect.left + elRect.width / 2;
  const targetX = stage.scrollLeft + (elCenterX - viewport.centerX);
  stage.scrollTo({ left: Math.max(0, targetX), top: Math.max(0, targetY), behavior: smooth ? 'smooth' : 'auto' });
 }

 function handleAutoScroll(activeBranchId, isManualScrub = false, activePointId = null, activeFlowStepKey = null){
  const stage = document.getElementById("mm-scroll-stage");
  if(!stage) return;
  const now = Date.now();

  if(isManualScrub){
    window.clearTimeout(stage.__mmCameraTimer);
    window.clearTimeout(stage.__mmFocusScrollTimer);
    stage.dataset.preparedPoint = "";
    stage.dataset.preparedBranch = "";
    stage.dataset.shownBranch = "";
    stage.dataset.cameraVoicePoint = "";
    audio.playbackRate = speeds[si];
    stage.classList.remove("mm-camera-overview","mm-camera-context","mm-point-focused");
    lastActiveBranchId = activeBranchId;
    lastActivePointId = activePointId;
    lastActiveFlowStepKey = activeFlowStepKey;
    userScrolledUntil = 0;
    if(activePointId){
      zoomToMapTarget(activePointId, null, activeBranchId);
      return;
    }
    if(activeFlowStepKey){
      zoomToMapTarget(null, activeFlowStepKey, activeBranchId);
      return;
    }
    if(activeBranchId === "root" || (audio.currentTime || 0) < 0.8){
      zoomToMapTarget(null, null, "root");
    } else if(activeBranchId){
      zoomToMapTarget(null, null, activeBranchId);
    }
    return;
  }

  // Match the standalone demo: move to parent/next-point context during silence,
  // reveal the point, then focus it before its narration starts.
  if(!activePointId && !activeFlowStepKey){
    const points=(mm?.branches || []).flatMap(branch=>(branch.points || []).map(point=>({point,branch})))
      .sort((a,b)=>Number(a.point.t0 || 0)-Number(b.point.t0 || 0));
    const upcomingIndex=points.findIndex(item=>Number(item.point.t0 || 0) > nowAudioTime() + .002);
    if(upcomingIndex >= 0){
      const upcoming=points[upcomingIndex];
      const previousItem=upcomingIndex > 0 ? points[upcomingIndex-1] : null;
      const previousEnd=previousItem
        ? Math.max(Number(previousItem.point.t1 || 0),
          ...(previousItem.branch.branch_id===upcoming.branch.branch_id ? [] : (previousItem.branch.flow_summary || []).map(step=>Number(step.t1 || 0))))
        : Number(mm?.root?.t1 || 0);
      if(nowAudioTime() >= previousEnd && nowAudioTime() < Number(upcoming.point.t0 || 0) - .002){
        if(stage.dataset.shownBranch !== upcoming.branch.branch_id){
          window.clearTimeout(stage.__mmCameraTimer);
          window.clearTimeout(stage.__mmFocusScrollTimer);
          lastActiveBranchId=upcoming.branch.branch_id;
          lastActivePointId=null;
          lastActiveFlowStepKey=null;
          stage.dataset.preparedBranch=upcoming.branch.branch_id;
          stage.dataset.preparedPoint="";
          stage.dataset.shownBranch=upcoming.branch.branch_id;
          showBranchContext(upcoming.branch.branch_id);
        } else if(stage.dataset.preparedBranch !== upcoming.branch.branch_id
          && stage.dataset.preparedPoint !== upcoming.point.id){
          window.clearTimeout(stage.__mmCameraTimer);
          window.clearTimeout(stage.__mmFocusScrollTimer);
          lastActiveBranchId=upcoming.branch.branch_id;
          lastActivePointId=upcoming.point.id;
          lastActiveFlowStepKey=null;
          stage.dataset.preparedBranch="";
          stage.dataset.preparedPoint=upcoming.point.id;
          showMapContext(upcoming.point.id, upcoming.branch.branch_id);
        }
      }
    }
  }

  if(activePointId && (stage.dataset.preparedPoint === activePointId || stage.dataset.preparedBranch === activeBranchId)){
    stage.dataset.preparedPoint="";
    stage.dataset.preparedBranch="";
    stage.dataset.cameraVoicePoint=activePointId;
    lastActiveBranchId=activeBranchId;
    lastActivePointId=activePointId;
    zoomToMapTarget(activePointId, null, activeBranchId);
    return;
  }

  // If playback skips the inter-clip gap, focus the newly active point directly.
  if(!activePointId && !activeFlowStepKey && !activeBranchId) return;
  if(activeBranchId !== lastActiveBranchId){
    lastActiveBranchId = activeBranchId;
    lastActivePointId = activePointId;
    lastActiveFlowStepKey = activeFlowStepKey;
    userScrolledUntil = 0;
    zoomToMapTarget(activePointId, activeFlowStepKey, activeBranchId);
    return;
  }

  // Auto-scroll to active flow step
  if(now >= userScrolledUntil && activeFlowStepKey && activeFlowStepKey !== lastActiveFlowStepKey){
    lastActiveFlowStepKey = activeFlowStepKey;
    const fEl = document.getElementById("mm-fstep-" + activeFlowStepKey);
    if(fEl){
      scrollToCard(fEl, true);
      return;
    }
  }

  // Auto-scroll to active spoken point card
  if(now >= userScrolledUntil && activePointId && activePointId !== lastActivePointId){
    lastActivePointId = activePointId;
    zoomToMapTarget(activePointId, null, activeBranchId);
    return;
  }

  if(now < userScrolledUntil) return;
 }

 function nowAudioTime(){ return Number(audio.currentTime || 0); }

 function pointInMindMapCanvas(el, canvas){
  let left = 0, top = 0, node = el;
  while(node && node !== canvas){
    left += node.offsetLeft || 0;
    top += node.offsetTop || 0;
    node = node.offsetParent;
  }
  const w = el.offsetWidth || 0;
  const h = el.offsetHeight || 0;
  return {
    x: left + w / 2,
    y: top + h / 2,
    width: w,
    height: h
  };
 }

 function layoutRectInContainer(el, container){
  let left = 0, top = 0, node = el;
  while(node && node !== container){
    left += node.offsetLeft || 0;
    top += node.offsetTop || 0;
    node = node.offsetParent;
  }
  const width = el.offsetWidth || 0, height = el.offsetHeight || 0;
  return { left, top, width, height, right: left + width, bottom: top + height, centerX: left + width / 2, centerY: top + height / 2 };
 }

 function mindMapCanvasBase(stage, canvas){
  const stageRect = stage.getBoundingClientRect();
  return {
    left: stageRect.left - stage.scrollLeft,
    top: stageRect.top - stage.scrollTop
  };
 }

 function mindMapVisibleViewport(stage){
  const rect = stage.getBoundingClientRect();
  const theater = stage.closest(".vtheater");
  const topbar = theater?.querySelector(".vtheater-topbar");
  const dock = theater?.querySelector(".vtheater-dock");
  const controlsVisible = !theater?.classList.contains("controls-hidden");
  const top = Math.max(rect.top + stage.clientTop, controlsVisible && topbar ? topbar.getBoundingClientRect().bottom : rect.top + stage.clientTop);
  const bottom = Math.min(rect.top + stage.clientTop + stage.clientHeight, controlsVisible && dock ? dock.getBoundingClientRect().top : rect.top + stage.clientTop + stage.clientHeight);
  const left = rect.left + stage.clientLeft;
  const width = Math.max(220, stage.clientWidth);
  const height = Math.max(180, bottom - top);
  // Place the focus anchor above center so the map content shifts up, reducing the top gap
  // and leaving more breathing room below the focused card.
  return { left, top, width, height, centerX:left + width / 2, centerY:top + height * 0.40 };
 }

 function cameraPanToPoint(stage, canvas, point, scale){
  const viewport = mindMapVisibleViewport(stage);
  const base = mindMapCanvasBase(stage, canvas);
  return {
    x: viewport.centerX - (base.left + point.x * scale),
    y: viewport.centerY - (base.top + point.y * scale)
  };
 }

 function showBranchContext(branchId){
  const stage = document.getElementById("mm-scroll-stage");
  const canvas = document.getElementById("mm-canvas-container");
  const root = document.getElementById("mm-node-root");
  const branch = document.getElementById("mm-block-" + branchId);
  const target = document.getElementById("mm-bpill-" + branchId);
  if(!stage || !canvas || !root || !branch || !target) return;
  layoutMindMapTree(true);
  const rootPoint = pointInMindMapCanvas(root, canvas);
  const branchPoint = pointInMindMapCanvas(target, canvas);
  const left = Math.min(rootPoint.x - rootPoint.width / 2, branchPoint.x - branchPoint.width / 2);
  const right = Math.max(rootPoint.x + rootPoint.width / 2, branchPoint.x + branchPoint.width / 2);
  const top = Math.min(rootPoint.y - rootPoint.height / 2, branchPoint.y - branchPoint.height / 2);
  const bottom = Math.max(rootPoint.y + rootPoint.height / 2, branchPoint.y + branchPoint.height / 2);
  const width = Math.max(1, right - left + 80);
  const height = Math.max(1, bottom - top + 80);
  const viewport = mindMapVisibleViewport(stage);
  const availableH = Math.max(180, viewport.height - 24);
  const scale = Math.min(0.85, (viewport.width * 0.72) / width, availableH / height);
  const pan = cameraPanToPoint(stage, canvas, { x: (left + right) / 2, y: (top + bottom) / 2 }, scale);
  stage.classList.remove("mm-point-focused", "mm-camera-overview", "mm-branch-transition");
  stage.classList.add("mm-camera-context");
  stage.style.setProperty("--mm-context-scale", scale.toFixed(3));
  canvas.style.setProperty("--mm-pan-x", `${pan.x}px`);
  canvas.style.setProperty("--mm-pan-y", `${pan.y}px`);
 }

 function showMapContext(pointId, branchId){
  const stage = document.getElementById("mm-scroll-stage");
  const canvas = document.getElementById("mm-canvas-container");
  if(!stage || !canvas) return;
  layoutMindMapTree(true);
  const branch = document.getElementById("mm-block-" + branchId);
  const target = document.getElementById("mm-card-" + pointId);
  const parent = target?.dataset.treeParentPoint
    ? document.getElementById("mm-card-" + target.dataset.treeParentPoint)
    : document.getElementById("mm-bpill-" + branchId);
  if(!branch || !parent || !target) return;

  const parentPoint = pointInMindMapCanvas(parent, canvas);
  const targetPoint = pointInMindMapCanvas(target, canvas);

  const left = Math.min(parentPoint.x - parentPoint.width / 2, targetPoint.x - targetPoint.width / 2);
  const right = Math.max(parentPoint.x + parentPoint.width / 2, targetPoint.x + targetPoint.width / 2);
  const top = Math.min(parentPoint.y - parentPoint.height / 2, targetPoint.y - targetPoint.height / 2);
  const bottom = Math.max(parentPoint.y + parentPoint.height / 2, targetPoint.y + targetPoint.height / 2);
  const contextWidth = Math.max(1, right - left + 80);
  const contextHeight = Math.max(1, bottom - top + 80);
  const viewport = mindMapVisibleViewport(stage);
  const availableH = Math.max(180, viewport.height - 24);
  const contextScale = Math.min(0.92, (viewport.width * 0.78) / contextWidth, availableH / contextHeight);
  const contextCenter = { x: (left + right) / 2, y: (top + bottom) / 2 };
  const pan = cameraPanToPoint(stage, canvas, contextCenter, contextScale);
  stage.classList.remove("mm-point-focused", "mm-camera-overview", "mm-branch-transition");
  stage.classList.add("mm-camera-context");
  stage.style.setProperty("--mm-context-scale", contextScale.toFixed(3));
  canvas.style.setProperty("--mm-pan-x", `${pan.x}px`);
  canvas.style.setProperty("--mm-pan-y", `${pan.y}px`);
 }

 function zoomToMapTarget(pointId, flowKey, branchId, targetOverride=null){
  const stage = document.getElementById("mm-scroll-stage");
  const canvas = document.getElementById("mm-canvas-container");
  if(!stage || !canvas) return;
  layoutMindMapTree(true);
  const target = targetOverride || (pointId
    ? document.getElementById("mm-card-" + pointId)
    : (flowKey ? document.getElementById("mm-fstep-" + flowKey)
      : (branchId === "root" ? document.getElementById("mm-node-root") : (document.getElementById("mm-bpill-" + branchId) || document.getElementById("mm-block-" + branchId)))));
  if(pointId) stage.dataset.focusedPoint = pointId;
  else stage.dataset.focusedPoint = "";
  if(target){
    const targetPoint = pointInMindMapCanvas(target, canvas);
    const viewport = mindMapVisibleViewport(stage);
    const availableW = Math.max(220, viewport.width * 0.90);
    const availableH = Math.max(180, viewport.height * 0.86);
    let focusPoint = targetPoint;
    // Measure the full rendered content, then fit it with breathing room. Small cards
    // may enlarge slightly; dense or tall cards scale down to stay fully in view.
    const contentWidth = Math.max(targetPoint.width, target.scrollWidth || 0);
    const contentHeight = Math.max(targetPoint.height, target.scrollHeight || 0);
    const fitW = availableW / Math.max(1, contentWidth);
    const fitH = availableH / Math.max(1, contentHeight);
    let focusScale = Math.min(1.08, Math.max(0.46, Math.min(fitW, fitH)));
    if(target.id === "mm-node-root"){
      focusScale = Math.min(1.04, Math.max(0.46, Math.min(fitW, fitH)));
    }
    const pan = cameraPanToPoint(stage, canvas, focusPoint, focusScale);
    stage.style.setProperty("--mm-focus-scale", focusScale.toFixed(3));
    canvas.style.setProperty("--mm-pan-x", `${pan.x}px`);
    canvas.style.setProperty("--mm-pan-y", `${pan.y}px`);
  }
  stage.classList.remove("mm-camera-overview", "mm-camera-context");
  stage.classList.add("mm-point-focused");
 }

 function zoomOutToFullMindMap(){
  const stage = document.getElementById("mm-scroll-stage");
  const canvas = document.getElementById("mm-canvas-container");
  if(!stage || !canvas) return;
  layoutMindMapTree(true);
  const nodes = Array.from(canvas.querySelectorAll(".mm-root-card,.mm-block-pill,.mm-infographic-card,.mm-flow-pill,.mm-flow-step-box"))
    .filter(node => node.offsetWidth > 0 && node.offsetHeight > 0 && getComputedStyle(node).display !== "none");
  if(!nodes.length) return;
  let left=Infinity, top=Infinity, right=-Infinity, bottom=-Infinity;
  nodes.forEach(node=>{
    const box=pointInMindMapCanvas(node,canvas);
    left=Math.min(left,box.x-box.width/2);
    top=Math.min(top,box.y-box.height/2);
    right=Math.max(right,box.x+box.width/2);
    bottom=Math.max(bottom,box.y+box.height/2);
  });
  const padding=48;
  const mapWidth=Math.max(1,right-left+padding*2);
  const mapHeight=Math.max(1,bottom-top+padding*2);
  const viewport=mindMapVisibleViewport(stage);
  const availableWidth=Math.max(160,viewport.width-40);
  const availableHeight=Math.max(140,viewport.height-36);
  const scale=Math.min(1,availableWidth/mapWidth,availableHeight/mapHeight);
  const center={x:(left+right)/2,y:(top+bottom)/2};
  const base=mindMapCanvasBase(stage,canvas);
  const pan={
    x:viewport.centerX-(base.left+center.x*scale),
    y:(viewport.top+viewport.height/2)-(base.top+center.y*scale)
  };
  stage.classList.remove("mm-point-focused","mm-camera-context","mm-branch-transition");
  stage.classList.add("mm-camera-overview");
  stage.style.setProperty("--mm-overview-scale",Math.max(.04,scale).toFixed(3));
  canvas.style.setProperty("--mm-pan-x",`${pan.x}px`);
  canvas.style.setProperty("--mm-pan-y",`${pan.y}px`);
 }

 function layoutMindMapTree(force=false){
  const canvas=document.getElementById("mm-canvas-container");
  if(!canvas || !mm?.branches || canvas.offsetWidth<1) return;
  if(!force && canvas.dataset.treeLayoutDone==="1") return;
  const root=document.getElementById("mm-node-root");
  if(!root) return;
  const rootH=root.offsetHeight||90;
  const branchX=400;
  let cursor=76;
  const branchCenters=[];
  let deepestColumn=1;
  let maxBranchRowLeft=450;
  mm.branches.forEach(branch=>{
    const block=document.getElementById("mm-block-"+branch.branch_id);
    const pill=document.getElementById("mm-bpill-"+branch.branch_id);
    const row=document.getElementById("mm-cards-"+branch.branch_id);
    if(!block||!pill||!row) return;
    const pillW=pill.offsetWidth||360;
    const pillH=pill.offsetHeight||64;
    const cardColumnX=Math.max(450, pillW + 48);
    if(cardColumnX > maxBranchRowLeft) maxBranchRowLeft = cardColumnX;
    const points=branch.points||[];
    const records=points.map((point,index)=>({point,index,number:String(point.number||`${branch.number||'1'}.${index+1}`)}));
    const children=new Map(records.map(record=>[record.point.id,[]]));
    const parents=new Map();
    records.forEach(record=>{
      const parent=records.filter(candidate=>candidate.point.id!==record.point.id
        && record.number.startsWith(candidate.number+'.'))
        .sort((a,b)=>b.number.length-a.number.length)[0];
      if(parent){parents.set(record.point.id,parent.point.id);children.get(parent.point.id).push(record);}
    });
    const roots=records.filter(record=>!parents.has(record.point.id));
    let localMaxDepth=1;
    const placePoint=(record,depth)=>{
      const point=record.point;
      const card=document.getElementById("mm-card-"+point.id);
      if(!card) return {center:cursor,min:cursor,max:cursor};
      const h=Math.max(116,card.offsetHeight||150);
      const descendants=children.get(point.id)||[];
      const placed=descendants.map(child=>placePoint(child,depth+1));
      localMaxDepth=Math.max(localMaxDepth,depth);
      const center=placed.length?(placed[0].center+placed[placed.length-1].center)/2:cursor+h/2;
      const top=center-h/2;
      card.style.left=`${(depth-1)*580}px`;
      card.style.top=`${top}px`;
      card.dataset.treeDepth=String(depth);
      card.dataset.treeParentPoint=parents.get(point.id)||'';
      const min=placed.length?Math.min(top,...placed.map(item=>item.min)):top;
      const max=placed.length?Math.max(top+h,...placed.map(item=>item.max)):top+h;
      if(!placed.length) cursor=top+h+52;
      else cursor=Math.max(cursor,top+h+52);
      return {center,min,max};
    };
    const placedRoots=roots.map(record=>placePoint(record,1));
    const centerY=placedRoots.length
      ? (placedRoots[0].center+placedRoots[placedRoots.length-1].center)/2
      : cursor+pillH/2;
    if(!placedRoots.length) cursor+=pillH+72;
    deepestColumn=Math.max(deepestColumn,localMaxDepth);
    const blockTop=centerY-pillH/2;
    block.style.left=`${branchX}px`;
    block.style.top=`${blockTop}px`;
    block.style.width=`${cardColumnX+580}px`;
    row.style.left=`${cardColumnX}px`;
    row.style.top=`${-blockTop}px`;
    row.style.width="580px";
    branchCenters.push(centerY);
    if(branch.flow_summary?.length){
      const flowY=cursor-blockTop;
      const conv=document.getElementById("mm-conv-wrap-"+branch.branch_id);
      const flow=document.getElementById("mm-fpill-"+branch.branch_id);
      const steps=document.getElementById("mm-fsteps-"+branch.branch_id);
      if(conv){conv.style.top=`${flowY}px`;conv.style.left=`${cardColumnX}px`;}
      if(flow){flow.style.top=`${flowY+48}px`;flow.style.left=`${cardColumnX}px`;}
      if(steps){steps.style.top=`${flowY+104}px`;steps.style.left=`${cardColumnX}px`;}
      cursor+=180;
    }
    cursor+=70;
  });
  const rootCenter=branchCenters.length ? (branchCenters[0]+branchCenters[branchCenters.length-1])/2 : 180;
  root.style.left="48px";
  root.style.top=`${rootCenter-rootH/2}px`;
  const canvasWidth=branchX + maxBranchRowLeft + (deepestColumn-1)*580 + 640;
  canvas.style.width=`${Math.max(1600, canvasWidth)}px`;
  canvas.style.height=`${Math.max(760,cursor+40)}px`;
  canvas.dataset.treeLayoutDone="1";
 }

 function updateConnectorPaths(st){
  if(!mm || !mm.branches) return;
  layoutMindMapTree();
  const svg = document.getElementById("mm-connector-svg");
  const container = document.getElementById("mm-canvas-container");
  const rootCard = document.getElementById("mm-node-root");
  if(!svg || !container || !rootCard) return;

  const rootRect = layoutRectInContainer(rootCard, container);

  // 1. Inter-Block Connectors (Root -> B1 -> B2 -> B3 -> B4)
  mm.branches.forEach((b, bi) => {
    const bEl = document.getElementById("mm-bpill-" + b.branch_id);
    const blockEl = document.getElementById("mm-block-" + b.branch_id);
    if(!bEl || !blockEl) return;
    const currRect = layoutRectInContainer(bEl, container);

    const x0 = rootRect.right;
    const y0 = rootRect.centerY;
    const x1 = currRect.left;
    const y1 = currRect.centerY;

    let path = document.getElementById("mm-path-" + b.branch_id);
    if(!path){
      path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.id = "mm-path-" + b.branch_id;
      path.classList.add("mm-branch-path");
      svg.appendChild(path);
    }

    const midX=(x0+x1)/2;
    const d = `M ${x0.toFixed(1)} ${y0.toFixed(1)} H ${midX.toFixed(1)} V ${y1.toFixed(1)} H ${x1.toFixed(1)}`;

    if(path.getAttribute("d") !== d){
      path.setAttribute("d", d);
    }

    const bState = (st && st.branchStates && st.branchStates[b.branch_id]) || { status: "hidden", progress: 0 };
    let len = 0;
    try { len = path.getTotalLength() || 100; } catch(e){ len = 100; }

    path.style.strokeDasharray = len.toFixed(1);
    const offset = len * (1 - Math.min(1, Math.max(0, bState.progress)));
    path.style.strokeDashoffset = offset.toFixed(1);
    path.setAttribute("marker-end", `url(#arrow-${bState.status === "active" ? "gold" : (bState.status === "mastered" ? "teal" : "blue")})`);
    path.className.baseVal = `mm-branch-path path-${bState.status}`;

    // 2. Detail connectors follow the same orthogonal tree paths as the demo.
    (b.points || []).forEach((pt, pi) => {
      const cEl = document.getElementById("mm-card-" + pt.id);
      if(!cEl) return;
      const cardRect = layoutRectInContainer(cEl, container);
      const parentPointId=cEl.dataset.treeParentPoint;
      const parentNode=parentPointId?document.getElementById("mm-card-"+parentPointId):bEl;
      const parentRect=parentNode?layoutRectInContainer(parentNode,container):currRect;
      const px0 = parentRect.right;
      const py0 = parentRect.centerY;
      const px1 = cardRect.left;
      const py1 = cardRect.centerY;

      let cardPath = document.getElementById("mm-cpath-to-" + pt.id);
      if(!cardPath){
        cardPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        cardPath.id = "mm-cpath-to-" + pt.id;
        cardPath.classList.add("mm-card-path");
        svg.appendChild(cardPath);
      }

      const pMidX=(px0+px1)/2;
      const cd = `M ${px0.toFixed(1)} ${py0.toFixed(1)} H ${pMidX.toFixed(1)} V ${py1.toFixed(1)} H ${px1.toFixed(1)}`;
      if(cardPath.getAttribute("d") !== cd){
        cardPath.setAttribute("d", cd);
      }

      const connData = (st && st.cardConnectors && st.cardConnectors[pt.id]) || { status: "hidden", progress: 0 };
      let cLen = 0;
      try { cLen = cardPath.getTotalLength() || 80; } catch(e){ cLen = 80; }

      cardPath.style.strokeDasharray = cLen.toFixed(1);
      const cOffset = cLen * (1 - Math.min(1, Math.max(0, connData.progress)));
      cardPath.style.strokeDashoffset = cOffset.toFixed(1);

      // Color mapping
      let markerColor = "blue";
      let strokeColor = "#1C7ED6";
      if(pt.trap_data){ markerColor = "trap"; strokeColor = "#FA5252"; }
      else if(pt.table_data){ markerColor = "blue"; strokeColor = "#1C7ED6"; }
      else if(pt.example_calc){ markerColor = "green"; strokeColor = "#12A150"; }
      else {
        const pal = [
          { m: "green", s: "#12A150" },
          { m: "orange", s: "#E8590C" },
          { m: "purple", s: "#7048E8" },
          { m: "blue", s: "#1C7ED6" },
          { m: "teal", s: "#0CA678" }
        ];
        const item = pal[pi % pal.length];
        markerColor = item.m;
        strokeColor = item.s;
      }

      if (vtheater && vtheater.classList.contains("open")) {
        const mColor = connData.status === "active" ? "gold" : ((connData.status === "mastered" || connData.status === "done") ? "teal" : markerColor);
        cardPath.setAttribute("marker-end", `url(#arrow-${mColor})`);
      } else {
        cardPath.style.stroke = strokeColor;
        cardPath.setAttribute("marker-end", `url(#arrow-${markerColor})`);
      }
      cardPath.className.baseVal = `mm-card-path path-${connData.status}`;
    });

    // 3. Converging Connectors inside this block (Cards -> Flow Summary Pill)
    const convSvg = document.getElementById("mm-converge-" + b.branch_id);
    const convWrap = document.getElementById("mm-conv-wrap-" + b.branch_id);
    const flowPill = document.getElementById("mm-fpill-" + b.branch_id);
    if(convSvg && convWrap && flowPill){
      const wRect = layoutRectInContainer(convWrap, container);
      const fRect = layoutRectInContainer(flowPill, container);
      const fx = fRect.centerX - wRect.left;
      const fy = fRect.top - wRect.top;

      (b.points || []).forEach(pt => {
        const cEl = document.getElementById("mm-card-" + pt.id);
        if(!cEl) return;
        const cardRect = layoutRectInContainer(cEl, container);
        const cx = cardRect.centerX - wRect.left;
        const cy = cardRect.bottom - wRect.top;

        let cPath = document.getElementById("mm-cpath-" + pt.id);
        if(!cPath){
          cPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
          cPath.id = "mm-cpath-" + pt.id;
          cPath.classList.add("mm-converge-path");
          convSvg.appendChild(cPath);
        }

        const cd = `M ${cx.toFixed(1)} ${cy.toFixed(1)} C ${cx.toFixed(1)} ${(fy * 0.5).toFixed(1)}, ${fx.toFixed(1)} ${(fy * 0.5).toFixed(1)}, ${fx.toFixed(1)} ${fy.toFixed(1)}`;
        if(cPath.getAttribute("d") !== cd){
          cPath.setAttribute("d", cd);
        }
        const convStatus = (st && st.convergeStates && st.convergeStates[b.branch_id]) || "hidden";
        cPath.className.baseVal = `mm-converge-path path-${convStatus}`;
      });
    }
  });
 }

 function syncMindMap(cur){
  if (isDiscreteMode) return;
  if(!mm) return;
  const cameraStage=document.getElementById("mm-scroll-stage");
  if(cameraStage?.dataset.preparedPoint || cameraStage?.dataset.preparedBranch){
    if(audio.playbackRate!==1) audio.playbackRate=1;
  } else if(cameraStage?.dataset.cameraVoicePoint){
    const voicePoint=mm.branches.flatMap(branch=>branch.points||[]).find(point=>point.id===cameraStage.dataset.cameraVoicePoint);
    if(voicePoint && cur>=Number(voicePoint.t0||0)){
      audio.playbackRate=speeds[si];
      cameraStage.dataset.cameraVoicePoint="";
    } else if(audio.playbackRate!==1){
      audio.playbackRate=1;
    }
  }
  const st = getState(mm, cur);

  // Update Infographic Blocks
  mm.branches.forEach(b => {
    const blockEl = document.getElementById("mm-block-" + b.branch_id);
    const bState = st.branchStates[b.branch_id] || { status: "hidden" };

    if(blockEl){
      blockEl.className = `mm-infographic-block status-${bState.status}`;
    }

    // Update Cards
    (b.points || []).forEach((pt, pi) => {
      const cardEl = document.getElementById("mm-card-" + pt.id);
      const cTagEl = document.getElementById("tag-pt-" + pt.id);
      if(cardEl){
        const pStatus = st.pointStates[pt.id] || "hidden";
        const isFull = !!(pt.table_data || pt.example_calc);
        let theme = 'theme-blue';
        if (pt.trap_data) theme = 'theme-trap';
        else if (pt.table_data) theme = 'theme-blue';
        else if (pt.example_calc) theme = 'theme-green';
        else {
          const pal = ['theme-green', 'theme-orange', 'theme-purple', 'theme-blue', 'theme-teal'];
          theme = pal[pi % pal.length];
        }

        cardEl.className = `mm-infographic-card ${theme} ${isFull ? 'card-fullwidth' : ''} status-${pStatus}`;
        if(cTagEl){
          if(pStatus === "active" && cur < Number(pt.t0 || 0)){
            cTagEl.textContent = "→ NEXT POINT";
            cTagEl.className = "mm-card-live-strip tag-active";
          } else if(pStatus === "active"){
            cTagEl.textContent = "● EXPLAINING NOW";
            cTagEl.className = "mm-card-live-strip tag-active";
          } else if(pStatus === "done"){
            cTagEl.textContent = "✓ Done";
            cTagEl.className = "mm-card-live-strip tag-done";
          } else if(pStatus === "reference"){
            cTagEl.textContent = "Reference";
            cTagEl.className = "mm-card-live-strip tag-ref";
          } else {
            cTagEl.textContent = "";
            cTagEl.className = "mm-card-live-strip";
          }
        }
        // Sync keyword highlighting for continuous playback
        const hlMarks = cardEl.querySelectorAll(".hl-word");
        if(hlMarks.length > 0){
          if(pStatus === "done"){
            hlMarks.forEach(m => { m.classList.remove("hl-pending", "hl-active"); m.classList.add("hl-done"); });
          } else if(pStatus === "active"){
            const ptT0 = Number(pt.t0 || 0);
            const relTime = Math.max(0, cur - ptT0);
            hlMarks.forEach(m => {
              const t = parseFloat(m.getAttribute("data-time") || "0");
              if(relTime >= t){
                if(!m.classList.contains("hl-active")){
                  m.classList.remove("hl-pending");
                  m.classList.add("hl-active");
                }
              } else {
                m.classList.remove("hl-active", "hl-done");
                m.classList.add("hl-pending");
              }
            });
          } else {
            hlMarks.forEach(m => { m.classList.remove("hl-active", "hl-done"); m.classList.add("hl-pending"); });
          }
        }
      }
    });

    // Update Flow Summary Pill & Steps
    const flowPill = document.getElementById("mm-fpill-" + b.branch_id);
    if(flowPill){
      const cState = st.convergeStates[b.branch_id] || "hidden";
      flowPill.className = `mm-flow-pill status-flow-${cState}`;
    }

    (b.flow_summary || []).forEach((step, si) => {
      const stepEl = document.getElementById("mm-fstep-" + b.branch_id + "-" + si);
      if(stepEl){
        const fStatus = st.flowStates[b.branch_id + '_' + si] || "hidden";
        stepEl.className = `mm-flow-step-box status-${fStatus}`;
      }
    });
  });

  // Update connector paths
  updateConnectorPaths(st);

  // Auto-scroll view smoothly to active card or flow step
  const activeBranchId = st.activeBranch ? st.activeBranch.branch_id : (cur < 1.0 ? "root" : (st.allMastered ? mm.branches[mm.branches.length - 1].branch_id : null));
  const activePointId = st.activePoint ? st.activePoint.id : null;
  const activeFlowStepKey = st.activeFlowStep ? (st.activeFlowStep.branch_id + '-' + st.activeFlowStep.index) : null;
  const mapStage = document.getElementById("mm-scroll-stage");
  handleAutoScroll(activeBranchId, false, activePointId, activeFlowStepKey);
  if(mapStage && activePointId && mapStage.dataset.focusedPoint !== activePointId){
    zoomToMapTarget(activePointId, null, activeBranchId);
  }

  // Update Explaining Now Live Bar (shows exact Malayalam narration sentence)
  const liveText = $("#mm-live-text");
  if(liveText){
    if(st.activePoint && cur < Number(st.activePoint.t0 || 0)){
      liveText.textContent = "അടുത്ത പോയിന്റിലേക്ക് മാറുന്നു...";
    } else if(st.activePoint && st.activePoint.voice_sync_text){
      liveText.textContent = st.activePoint.voice_sync_text;
    } else if(st.activeFlowStep && st.activeFlowStep.step){
      liveText.textContent = `Flow Step ${st.activeFlowStep.index + 1}: ${st.activeFlowStep.step.label} (${st.activeFlowStep.step.sub || ''})`;
    } else if(st.activeBranch && st.activeBranch.branch_title){
      liveText.textContent = `Explaining: ${st.activeBranch.branch_title}`;
    } else if(st.allMastered){
      liveText.textContent = "✓ Complete Concept Tree Mastered!";
    } else {
      liveText.textContent = `§ ${esc(mm.doctrine || '')} · Spoken Malayalam Teacher Audio`;
    }
  }

  // Update Dock Label
  const vtdLabel = $("#vtd-label");
  if(vtdLabel){
    if(st.activePoint && cur < Number(st.activePoint.t0 || 0)){
      vtdLabel.textContent = `${st.activeBranch ? st.activeBranch.branch_title + ' · ' : ''}Next: ${st.activePoint.title}`;
    } else if(st.activePoint){
      vtdLabel.textContent = `${st.activeBranch ? st.activeBranch.branch_title + ' · ' : ''}${st.activePoint.title}`;
    } else if(st.activeFlowStep && st.activeFlowStep.step){
      vtdLabel.textContent = `${st.activeBranch ? st.activeBranch.branch_title + ' · ' : ''}Step: ${st.activeFlowStep.step.label}`;
    } else if(st.activeBranch){
      vtdLabel.textContent = st.activeBranch.branch_title;
    } else if(st.allMastered){
      vtdLabel.textContent = "✓ Concept Tree Complete";
    } else {
      vtdLabel.textContent = `§ ${mm.root?.badge || "Direct Tax"}`;
    }
  }
 }
 /* Auto-Hiding Controls Engine (Inactivity Timer: 2.5s) */
 let controlsTimer = null;
 let isHoveringControls = false;
 const AUTO_HIDE_DELAY = 2500;

 function resetControlsTimer(){
  if(!vtheater || !vtheater.classList.contains("open")) return;
  vtheater.classList.remove("controls-hidden");
  clearTimeout(controlsTimer);
  if(!isHoveringControls){
   controlsTimer = setTimeout(() => {
    if(playing && vtheater && vtheater.classList.contains("open") && !isHoveringControls){
     vtheater.classList.add("controls-hidden");
    }
   }, AUTO_HIDE_DELAY);
  }
 }

 const topbarEl = vtheater ? vtheater.querySelector(".vtheater-topbar") : null;
 const dockEl = vtheater ? vtheater.querySelector(".vtheater-dock") : null;

 const onControlEnter = () => { isHoveringControls = true; resetControlsTimer(); };
 const onControlLeave = () => { isHoveringControls = false; resetControlsTimer(); };

 if(topbarEl){
  topbarEl.addEventListener("mouseenter", onControlEnter);
  topbarEl.addEventListener("mouseleave", onControlLeave);
 }
 if(dockEl){
  dockEl.addEventListener("mouseenter", onControlEnter);
  dockEl.addEventListener("mouseleave", onControlLeave);
 }

 const onUserActivity = () => {
  resetControlsTimer();
 };

 if(vtheater){
  vtheater.addEventListener("mousemove", onUserActivity, { passive: true });
  vtheater.addEventListener("pointermove", onUserActivity, { passive: true });
  vtheater.addEventListener("mousedown", onUserActivity, { passive: true });
  vtheater.addEventListener("touchstart", onUserActivity, { passive: true });
  vtheater.addEventListener("click", onUserActivity, { passive: true });
 }

 function initializeTheaterMindMap(onReady){
  requestAnimationFrame(()=>{
   if(!vtheater || !vtheater.classList.contains("open")) return;
   const stage=document.getElementById("mm-scroll-stage");
   const canvas=document.getElementById("mm-canvas-container");
   if(!stage || !canvas || stage.clientWidth<1 || stage.clientHeight<1) return;
   stage.classList.remove("mm-point-focused","mm-camera-context","mm-camera-overview","mm-branch-transition");
   stage.dataset.focusedPoint="";
   stage.dataset.preparedPoint="";
   stage.dataset.preparedBranch="";
   stage.dataset.shownBranch="";
   stage.dataset.cameraVoicePoint="";
   if(!isDiscreteMode){
    canvas.style.setProperty("--mm-pan-x","0px");
    canvas.style.setProperty("--mm-pan-y","0px");
   }
   lastActiveBranchId=null;
   lastActivePointId=null;
   lastActiveFlowStepKey=null;
   layoutMindMapTree(true);
   if(!isDiscreteMode){
    syncMindMap(audio.currentTime||0);
   }
   if(typeof onReady === "function") onReady();
  });
 }

 function openTheater(onReady){
  if(vtheater){
   vtheater.style.removeProperty("display");
   vtheater.classList.add("open");
   vtheater.classList.remove("controls-hidden");
  }
  document.body.style.overflow = "hidden";
  resetControlsTimer();
  initializeTheaterMindMap(() => {
   if(typeof onReady === "function"){
    onReady();
   } else if(isDiscreteMode){
    playPoint(currentPtIdx, true);
   } else {
    if(!playing) start();
   }
  });
 }

 function closeTheater(){
  if(vtheater){
   vtheater.classList.remove("open");
   vtheater.classList.remove("controls-hidden");
   vtheater.style.setProperty("display", "none", "important");
  }
  clearTimeout(controlsTimer);
  document.body.style.overflow = "";
  stop();
 }

 function ui(){
  const cur = audio.currentTime || 0;
  const T = total();
  const f = T > 0 ? Math.min(1, Math.max(0, cur / T)) : 0;
  time.textContent = fmt(cur) + " / " + fmt(T);
  seek.value = Math.round(f * 1000);
  seek.style.setProperty("--p", f);
  const n = Math.round(f * bars.length);
  bars.forEach((b, k) => b.classList.toggle("on", k < n));
  const rc = $("#ringc");
  if(rc) rc.style.strokeDashoffset = 175.9 * (1 - f);
  const vtdTime = $("#vtd-time");
  if(vtdTime) vtdTime.textContent = fmt(cur) + " / " + fmt(T);
  const vtdSeek = $("#vtd-seek");
  if(vtdSeek) vtdSeek.value = Math.round(f * 1000);
  const curVtdPlay = $("#vtd-play");
  if(curVtdPlay) curVtdPlay.innerHTML = playing ? I.pause : I.play;

  syncMindMap(cur);
  syncFlowchart(cur);
 }

 function syncFlowchart(cur){
  const slides = $$(".ppt-slide");
  if(slides && slides.length > 0){
   let activeIdx = 0;
   slides.forEach((slide, idx) => {
    const t0 = parseFloat(slide.dataset.t0 || "0");
    const t1 = parseFloat(slide.dataset.t1 || "9999");
    if(cur >= t0 && cur < t1){
     activeIdx = idx;
    }
   });

   slides.forEach((slide, idx) => {
    const wasActive = slide.classList.contains("active");
    const shouldBeActive = (idx === activeIdx);
    if(shouldBeActive && !wasActive){
     slide.classList.add("active");
    } else if(!shouldBeActive && wasActive){
     slide.classList.remove("active");
    }
   });

   const dots = $$(".ppt-nav-dot");
   if(dots && dots.length > 0){
    dots.forEach((dot, idx) => {
     dot.classList.toggle("active", idx === activeIdx);
     dot.classList.toggle("past", idx < activeIdx);
    });
   }

   if(pptSlidesWrapper && pptSlidesWrapper.style.display !== "none"){
    const vtdLabel = $("#vtd-label");
    if(vtdLabel && slides[activeIdx]){
     const sTitle = slides[activeIdx].querySelector(".ppt-slide-title");
     vtdLabel.textContent = `Slide ${activeIdx + 1} of ${slides.length}: ${sTitle ? sTitle.textContent : ''}`;
    }
   }
  }
 }

 function vizOn(){
  cancelAnimationFrame(vraf);

   });
   vraf = requestAnimationFrame(f);
  })(performance.now());
 }

 }

 function startMindMapDrawLoop(){

 async function start(){
  if(dead) return;
  if(isDiscreteMode){
   playPoint(currentPtIdx, true);
   return;
  }
  try {
   if(audio.ended || (audio.currentTime >= total() - 0.2)){
    audio.currentTime = 0;
   }
   audio.playbackRate = speeds[si];
   await audio.play();
   playing = true;
   root.classList.add("playing");
   playB.innerHTML = I.pause;
   playB.setAttribute("aria-label", "Pause audio");
   note.textContent = "Playing Malayalam explainer: " + (p.doctrine || "Statutory Rule") + " · " + (p.voice || "Gemini Voice (Aoede)");
   if(vtheater){
    vtheater.style.removeProperty("display");
    vtheater.classList.add("open");
    document.body.style.overflow = "hidden";
    initializeTheaterMindMap();
   }
   const curVtdPlay = $("#vtd-play");
   if(curVtdPlay) curVtdPlay.innerHTML = I.pause;
   resetControlsTimer();
   vizOn();
   startMindMapDrawLoop();
  } catch(err) {
   console.warn("audio.play() error:", err);
   note.textContent = "Tap play to start audio playback (" + (err.message || "User interaction required") + ")";
   stop();
  }
 }

 function stop(){
  playing = false;
  window.clearTimeout(window.__mmAudioPlayTimer);
  const stage = document.getElementById("mm-scroll-stage");
  if (stage) {
   window.clearTimeout(stage.__mmDiscreteCamTimer1);

  }
  try { audio.pause(); } catch(e){}
  const curVtdPlay = $("#vtd-play");

  stopMindMapDrawLoop();
