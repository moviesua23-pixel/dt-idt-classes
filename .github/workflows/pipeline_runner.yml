name: DT & IDT AI Cloud Pipeline

on:
  schedule:
    # Run daily at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      subject:
        description: 'Subject to process (DT / IDT / BOTH)'
        required: true
        default: 'BOTH'
      chapter:
        description: 'Specific Chapter number to process (leave blank for sequential)'
        required: false
        default: ''
      question:
        description: 'Specific Question number to process (e.g. 32)'
        required: false
        default: ''
      force:
        description: 'Force re-generation even if already exists (true/false)'
        required: false
        default: 'false'
      only_new:
        description: 'Process strictly brand new questions not yet in Google Sheets (true/false)'
        required: false
        default: 'true'
      limit:
        description: 'Max new questions to process in this run (leave blank for unlimited)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud Pipeline & Sync Google Sheets
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DRIVE_ROOT_ID: ${{ secrets.DRIVE_ROOT_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          CLI_ARGS=""
          if [ -n "${{ github.event.inputs.subject }}" ] && [ "${{ github.event.inputs.subject }}" != "BOTH" ]; then
            CLI_ARGS="$CLI_ARGS --subject ${{ github.event.inputs.subject }}"
          fi
          if [ -n "${{ github.event.inputs.chapter }}" ]; then
            CLI_ARGS="$CLI_ARGS --chapter ${{ github.event.inputs.chapter }}"
          fi
          if [ -n "${{ github.event.inputs.question }}" ]; then
            CLI_ARGS="$CLI_ARGS --question ${{ github.event.inputs.question }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            CLI_ARGS="$CLI_ARGS --force"
          elif [ "${{ github.event.inputs.only_new }}" = "true" ] || [ -z "${{ github.event.inputs.question }}" ]; then
            CLI_ARGS="$CLI_ARGS --only-new"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            CLI_ARGS="$CLI_ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python -u pipeline/cloud_pipeline_runner.py $CLI_ARGS

      - name: Commit & Push Updated Data Files (if any)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # Guardrail: Preserve redesign_demo/frontend/index.html 100% untouched
          git checkout -- redesign_demo/frontend/index.html 2>/dev/null || true
          git add data/ redesign_demo/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Sync data from cloud pipeline [skip ci]" && git push)
