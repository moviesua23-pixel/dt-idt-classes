name: Build and deploy Study Board

on:
  push:
    branches: [main]
    paths:
      - "redesign_demo/frontend/**"
      - "redesign_demo/data/**"
      - "pipeline/build_site.py"
      - ".github/workflows/study-board-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out pipeline outputs
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bundle screenplays and assemble site
        run: python pipeline/build_site.py --site-dir _site
      - name: Install Playwright browser for visual checks
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Test every question and visual beat
        env:
          TARGET_URL: http://127.0.0.1:4173/
          SCREENSHOT_DIR: test-results/study-board
        run: |
          python -m http.server 4173 --directory _site > /tmp/study-board-http.log 2>&1 &
          echo $! > /tmp/study-board-http.pid
          node tests/study_board_playwright.js
      - name: Upload visual regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-board-visual-checks
          path: test-results/study-board/
          if-no-files-found: ignore
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
