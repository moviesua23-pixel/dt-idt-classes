name: Statutory Provision to Kinetic Presentation

on:
  workflow_dispatch:
    inputs:
      provision_text:
        description: 'Statutory Tax Provision Text (paste Section/Rule from DT or IDT)'
        required: true
        type: string
      subject:
        description: 'Subject (DT / IDT)'
        required: true
        default: 'DT'
        type: choice
        options:
          - DT
          - IDT
      domain:
        description: 'Real-Life Pedagogical Domain'
        required: false
        default: 'Real Estate'
        type: choice
        options:
          - Real Estate
          - Shares & Securities
          - Goods & Logistics
          - General Business
      voice:
        description: 'Malayalam Teacher Voice'
        required: false
        default: 'ml-IN-MidhunNeural'
        type: choice
        options:
          - ml-IN-MidhunNeural
          - ml-IN-SobhanaNeural

permissions:
  contents: write

jobs:
  generate-presentation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Convert Statutory Provision to Kinetic Presentation
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API_KEYS }}
        run: |
          python pipeline/provision_to_presentation.py \
            --provision "${{ github.event.inputs.provision_text }}" \
            --subject "${{ github.event.inputs.subject }}" \
            --domain "${{ github.event.inputs.domain }}" \
            --voice "${{ github.event.inputs.voice || 'ml-IN-MidhunNeural' }}"

      - name: Commit & Push Presentation Screenplay
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # Guardrail: Preserve frontend files
          git add redesign_demo/data/screenplays/ redesign_demo/data/audio/presentations/ viewer/latest_presentation.js data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Generate multi-slide presentation & voice for ${{ github.event.inputs.subject }} provision [skip ci]" && git pull --rebase origin main && git push)

      - name: Generate Job Summary
        run: |
          echo "## 🎬 Kinetic Presentation Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Subject**: \`${{ github.event.inputs.subject }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Domain**: \`${{ github.event.inputs.domain }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Provision Length**: \`${{ github.event.inputs.provision_text }}\` characters" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📄 Latest Generated Screenplays" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          ls -lt redesign_demo/data/screenplays/ | head -n 5 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔊 Generated Malayalam Audio Voiceover Files (.mp3)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          ls -lh redesign_demo/data/audio/presentations/*/*.mp3 | tail -n 10 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
